<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Not linked from the site nav and not indexed. Adult content on the same
     domain as the Cindervale marketing pages, at Jordan's direction. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Tokyo Shift</title>
<style>
/* ============================================================ [CSS-01] base */
:root{
  --bg:#0b0a0d; --panel:#15131a; --panel2:#1d1a24; --line:#2e2836;
  --ink:#e8e3ee; --dim:#9a91a8; --faint:#655d73;
  --hot:#e0486b; --hot2:#ff6f8d; --gold:#e0b054; --ok:#5fbf82;
  --mei:#c8564f; --haruka:#d99a3c; --reiko:#8b6bc4; --ayano:#6b93c4;
  --rina:#d4649e; --sana:#79b3ad;
  --shadow:0 12px 34px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.6 "Segoe UI",system-ui,-apple-system,sans-serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{position:relative;width:100vw;height:100vh;overflow:hidden}
.hide{display:none!important}

/* ============================================================ [CSS-02] title */
#title{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;
  background:radial-gradient(ellipse at 50% 35%,#241a26 0%,#0b0a0d 70%);
}
#title h1{
  margin:0;font-size:64px;letter-spacing:.14em;font-weight:200;
  background:linear-gradient(180deg,#fff 10%,var(--hot) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
#title .sub{color:var(--dim);letter-spacing:.34em;font-size:12px;text-transform:uppercase}
#title .menu{display:flex;flex-direction:column;gap:10px;margin-top:14px;min-width:240px}
.mbtn{
  padding:13px 22px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);letter-spacing:.1em;font-size:13px;text-transform:uppercase;
  transition:background .15s,border-color .15s,transform .1s;
}
.mbtn:hover{background:var(--panel2);border-color:var(--hot);transform:translateY(-1px)}
.mbtn[disabled]{opacity:.35;cursor:not-allowed;transform:none}
#title .warn{color:var(--faint);font-size:11px;max-width:420px;text-align:center;line-height:1.7}

/* ============================================================ [CSS-03] hub */
#hub{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#hubTop{
  display:flex;align-items:center;gap:20px;padding:12px 22px;
  border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;
}
#hubTop .stat{display:flex;align-items:baseline;gap:7px}
#hubTop .lbl{color:var(--faint);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
#hubTop .val{font-size:17px;font-weight:600}
#hubTop .val.money{color:var(--gold)}
#hubTop .spacer{flex:1}
.tbtn{padding:7px 13px;border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--dim)}
.tbtn:hover{color:var(--ink);border-color:var(--hot)}

#hubBody{flex:1;display:flex;min-height:0}
#hubMain{flex:1;padding:26px 30px;overflow-y:auto}
#hubMain h2{margin:0 0 4px;font-size:22px;font-weight:300;letter-spacing:.04em}
#hubMain .phase{color:var(--dim);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:22px}

.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.act{
  text-align:left;padding:16px 18px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);transition:border-color .15s,background .15s,transform .1s;
}
.act:hover:not([disabled]){border-color:var(--hot);background:var(--panel2);transform:translateY(-2px)}
.act[disabled]{opacity:.4;cursor:not-allowed}
.act .an{font-size:15px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.act .ad{color:var(--dim);font-size:12.5px;line-height:1.55}
.act .tag{
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;
  border-radius:4px;border:1px solid currentColor;
}
.tag.pay{color:var(--gold)} .tag.new{color:var(--hot2)} .tag.lock{color:var(--faint)}

/* roster rail */
#roster{
  flex:0 0 268px;border-left:1px solid var(--line);background:var(--panel);
  padding:18px 16px;overflow-y:auto;
}
#roster h3{margin:0 0 14px;font-size:10px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
.pcard{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.pcard:last-child{border-bottom:0}
.pcard .av{
  width:44px;height:44px;border-radius:9px;flex:0 0 auto;background:var(--panel2);
  background-size:cover;background-position:center 18%;border:1px solid var(--line);
}
.pcard.locked .av{filter:grayscale(1) brightness(.35)}
.pcard .who{flex:1;min-width:0}
.pcard .nm{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.pcard.locked .nm{color:var(--faint)}
.pcard .rl{font-size:10.5px;color:var(--faint);letter-spacing:.05em}
.meter{height:4px;border-radius:2px;background:#241f2c;margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:2px;transition:width .35s}
.rt{font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:1px 5px;border-radius:3px}
.rt.on{color:var(--ok);border:1px solid var(--ok)}
.rt.out{color:var(--faint);border:1px solid var(--faint)}

/* ============================================================ [CSS-03b] map */
#mapWrap{flex:1;position:relative;min-height:0;overflow:hidden;background:#07060b}
#cityBg{
  position:absolute;inset:0;background-size:cover;background-position:center;
  filter:saturate(.85) brightness(.62);
}
#cityBg::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 35%,rgba(7,6,11,.82) 100%);
}
#pins{position:absolute;inset:0}

/* Each location is a painted building card. SDXL will not give clean alpha, so
   the card is radially masked instead of keyed — it fades into the backdrop
   rather than ending on a rectangle. Same fix as the dialogue portraits. */
.bld{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;transition:transform .16s;
}
.bld:hover{transform:translate(-50%,-52%) scale(1.06)}
.bld .art{
  width:clamp(84px,11vw,132px);aspect-ratio:1;
  background-size:cover;background-position:center;
  -webkit-mask-image:radial-gradient(ellipse at 50% 46%,#000 46%,transparent 72%);
  mask-image:radial-gradient(ellipse at 50% 46%,#000 46%,transparent 72%);
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.75));
  transition:filter .16s;
}
.bld:hover .art{filter:drop-shadow(0 0 18px var(--hot)) brightness(1.15)}
.bld.closed{cursor:not-allowed}
.bld.closed .art{filter:grayscale(1) brightness(.4)}
.bld.closed:hover{transform:translate(-50%,-50%)}
.bld.closed:hover .art{filter:grayscale(1) brightness(.4)}
.bld .nm{
  font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--ink);
  paint-order:stroke;text-shadow:0 1px 4px #000,0 0 10px #000;pointer-events:none;
}
.bld.closed .nm{color:var(--faint)}
.bld .who{font-size:11px;font-weight:600;text-shadow:0 1px 4px #000,0 0 8px #000;
  pointer-events:none;line-height:1.35}
.bld .shut{font-size:10px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase}

/* location drawer */
#loc{
  position:absolute;right:0;top:0;bottom:0;width:340px;max-width:88vw;
  background:var(--panel);border-left:1px solid var(--line);
  padding:20px 20px 24px;overflow-y:auto;transform:translateX(102%);
  transition:transform .22s cubic-bezier(.3,.8,.4,1);box-shadow:var(--shadow);
}
#loc.open{transform:none}
#loc h3{margin:0 0 3px;font-size:19px;font-weight:500}
#loc .blurb{color:var(--dim);font-size:13px;margin-bottom:16px;line-height:1.6}
#loc .sec{font-size:10px;letter-spacing:.2em;color:var(--faint);
  text-transform:uppercase;margin:16px 0 9px}
#locClose{position:absolute;top:12px;right:14px;color:var(--faint);font-size:18px;line-height:1}
#locClose:hover{color:var(--ink)}
.here{display:flex;gap:9px;align-items:center;padding:7px 0}
.here .av{width:34px;height:34px;border-radius:7px;background:var(--panel2);
  background-size:cover;background-position:center 16%;border:1px solid var(--line)}
.here .n{font-size:13px;font-weight:600}
.here .s{font-size:11px;color:var(--faint)}

/* ============================================================ [CSS-03d] stats */
#stats{
  position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:52;
  display:flex;align-items:center;justify-content:center;
}
#statsBody{
  width:520px;max-width:94vw;max-height:88vh;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--shadow);
}
#statsTop{padding:15px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;flex:0 0 auto}
#statsTop .t{flex:1;font-size:15px;font-weight:600}
#statsScroll{overflow-y:auto;padding:16px 18px 22px}
#statsScroll .sec{font-size:10px;letter-spacing:.2em;color:var(--faint);
  text-transform:uppercase;margin:4px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px;margin-bottom:20px}
.kv{display:flex;justify-content:space-between;align-items:baseline;
  padding:7px 11px;background:var(--panel2);border-radius:8px;border:1px solid var(--line)}
.kv .k{font-size:11.5px;color:var(--dim)}
.kv .v{font-size:14px;font-weight:600}
.rel{padding:11px 0;border-bottom:1px solid var(--line)}
.rel:last-child{border-bottom:0}
.rel .top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rel .av{width:36px;height:36px;border-radius:8px;flex:0 0 auto;background:var(--panel2);
  background-size:cover;background-position:center 16%;border:1px solid var(--line)}
.rel .nm{font-size:14px;font-weight:600;flex:1}
.rel .pct{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.rel .bar{height:6px;border-radius:3px;background:#241f2c;overflow:hidden}
.rel .bar i{display:block;height:100%;border-radius:3px;transition:width .4s}
.rel .note{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.5}
.rel.locked{opacity:.45}
.mile{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:12.5px}
.mile .tick{color:var(--ok);flex:0 0 auto}
.mile .no{color:var(--faint);flex:0 0 auto}
.mile.undone{color:var(--faint)}

/* ============================================================ [CSS-03c] phone */
#phoneBtn{position:relative}
#badge{
  position:absolute;top:-5px;right:-6px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--hot);color:#fff;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
#phone{
  position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:50;
  display:flex;align-items:center;justify-content:center;
}
#phoneBody{
  width:370px;max-width:94vw;height:min(660px,88vh);background:#0e0d13;
  border:1px solid var(--line);border-radius:26px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--shadow);
}
#phoneTop{
  padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel);
  display:flex;align-items:center;gap:10px;flex:0 0 auto;
}
#phoneTop .t{flex:1;font-size:14px;font-weight:600}
#phoneTabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
#phoneTabs button{flex:1;padding:11px;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);border-bottom:2px solid transparent}
#phoneTabs button.on{color:var(--ink);border-bottom-color:var(--hot)}
#phoneList{flex:1;overflow-y:auto;padding:8px 0}
.thread{display:flex;gap:11px;align-items:center;padding:11px 16px;cursor:pointer;
  border-bottom:1px solid #191622}
.thread:hover{background:var(--panel2)}
.thread .av{width:40px;height:40px;border-radius:50%;flex:0 0 auto;background:var(--panel2);
  background-size:cover;background-position:center 16%;border:1px solid var(--line)}
.thread .tb{flex:1;min-width:0}
.thread .tn{font-size:13.5px;font-weight:600;display:flex;gap:7px;align-items:center}
.thread .tp{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.thread .un{width:8px;height:8px;border-radius:50%;background:var(--hot);flex:0 0 auto}
#msgs{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;
  flex-direction:column;gap:9px}
.msg{max-width:80%;padding:9px 13px;border-radius:15px;font-size:13.5px;line-height:1.55}
.msg.them{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:5px}
.msg.you{align-self:flex-end;background:#5a2740;border-bottom-right-radius:5px}
.msg .tm{display:block;font-size:10px;color:var(--faint);margin-top:4px}
#reply{padding:10px 12px 14px;border-top:1px solid var(--line);display:flex;
  flex-direction:column;gap:7px;flex:0 0 auto}
.rp{text-align:left;padding:9px 13px;border:1px solid var(--line);border-radius:9px;
  font-size:13px;background:var(--panel)}
.rp:hover{border-color:var(--hot);background:var(--panel2)}
#phoneEmpty{padding:36px 20px;text-align:center;color:var(--faint);font-size:13px;line-height:1.7}

/* ============================================================ [CSS-04] VN */
#vn{position:absolute;inset:0;background:#000;display:flex;flex-direction:column}
#vnArt{
  position:absolute;inset:0;background-size:cover;background-position:center;
  transition:opacity .3s;
}
#vnArt.dim::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 40%,rgba(0,0,0,.82) 100%)}
/* Portraits are rendered WITH their room baked in (SDXL will not give clean
   alpha, and a bad key looks worse than no key). Dropped straight onto the
   scene background that makes an obvious picture-in-picture rectangle, so the
   edges are feathered with a mask: the image dissolves into the darkened
   background instead of ending on a hard line. */
#vnPort{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  height:88%;max-width:60%;object-fit:cover;object-position:center top;
  transition:opacity .25s;
  -webkit-mask-image:
    linear-gradient(to right,transparent 0,#000 16%,#000 84%,transparent 100%),
    linear-gradient(to bottom,transparent 0,#000 12%,#000 100%);
  -webkit-mask-composite:source-in;
  mask-image:
    linear-gradient(to right,transparent 0,#000 16%,#000 84%,transparent 100%),
    linear-gradient(to bottom,transparent 0,#000 12%,#000 100%);
  mask-composite:intersect;
}
#vnBox{
  position:absolute;left:0;right:0;bottom:0;padding:20px 26px 24px;
  background:linear-gradient(180deg,rgba(10,9,12,.0) 0%,rgba(10,9,12,.93) 22%,rgba(10,9,12,.98) 100%);
  min-height:210px;
}
#vnWrap{max-width:960px;margin:0 auto}
#vnWho{
  font-size:15px;font-weight:700;letter-spacing:.08em;margin-bottom:7px;min-height:22px;
}
#vnText{font-size:17px;line-height:1.72;min-height:82px;white-space:pre-wrap}
#vnText .nar{color:var(--dim);font-style:italic}
#vnChoices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ch{
  text-align:left;padding:11px 16px;border:1px solid var(--line);border-radius:9px;
  background:rgba(30,26,38,.9);font-size:14.5px;transition:all .13s;
}
.ch:hover{border-color:var(--hot);background:rgba(48,32,48,.95);transform:translateX(3px)}
.ch .hint{color:var(--faint);font-size:11px;margin-left:8px}
.ch.warnlock{border-color:#7a3a4a}
.ch.warnlock .hint{color:var(--hot2)}
#vnNext{
  position:absolute;right:26px;bottom:20px;color:var(--faint);font-size:12px;
  letter-spacing:.14em;animation:bob 1.4s ease-in-out infinite;
}
@keyframes bob{0%,100%{opacity:.35}50%{opacity:1}}
#vnBack{position:absolute;top:16px;right:18px;z-index:5}

/* ============================================================ [CSS-05] misc */
#toast{
  position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:40;
  display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;
}
.tst{
  padding:9px 17px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);
  font-size:13px;box-shadow:var(--shadow);animation:tin .3s ease;
}
.tst.up{border-color:var(--ok);color:var(--ok)}
.tst.money{border-color:var(--gold);color:var(--gold)}
.tst.lock{border-color:var(--hot);color:var(--hot2)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.ph{
  display:flex;align-items:center;justify-content:center;height:100%;
  color:var(--faint);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  background:repeating-linear-gradient(45deg,#16141b,#16141b 12px,#1b1822 12px,#1b1822 24px);
}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:60}
#modalBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 28px;max-width:440px;box-shadow:var(--shadow)}
#modalBox h3{margin:0 0 10px;font-weight:400;font-size:19px}
#modalBox p{color:var(--dim);font-size:14px;margin:0 0 18px}
#modalBox .row{display:flex;gap:10px;justify-content:flex-end}
@media(max-width:900px){
  #roster{display:none}
  #title h1{font-size:44px}
  #vnPort{max-width:80%;height:66%}
}
</style>
</head>
<body>
<div id="app">

  <!-- ---------------------------------------------------------- title -->
  <div id="title">
    <div class="sub">a part-time job in shinjuku</div>
    <h1>TOKYO SHIFT</h1>
    <div class="menu">
      <button class="mbtn" id="btnNew">New Game</button>
      <button class="mbtn" id="btnCont">Continue</button>
    </div>
    <div class="warn">Adult visual novel. All characters are adults.</div>
  </div>

  <!-- ---------------------------------------------------------- hub -->
  <div id="hub" class="hide">
    <div id="hubTop">
      <div class="stat"><span class="lbl">Day</span><span class="val" id="hDay">1</span></div>
      <div class="stat"><span class="lbl">Yen</span><span class="val money" id="hMoney">0</span></div>
      <div class="stat"><span class="lbl">Time</span><span class="val" id="hPhase">Morning</span></div>
      <div class="spacer"></div>
      <button class="tbtn" id="statsBtn">Stats</button>
      <button class="tbtn" id="phoneBtn">Phone<span id="badge" class="hide">0</span></button>
      <button class="tbtn" id="btnSave">Save</button>
      <button class="tbtn" id="btnQuit">Title</button>
    </div>
    <div id="mapWrap">
      <div id="cityBg"></div>
      <div id="pins"></div>
      <div id="loc">
        <button id="locClose">&times;</button>
        <h3 id="locName"></h3>
        <div class="blurb" id="locBlurb"></div>
        <div id="locWho"></div>
        <div class="sec">Do</div>
        <div class="acts" id="acts" style="grid-template-columns:1fr"></div>
      </div>
    </div>
  </div>

  <!-- ---------------------------------------------------------- stats -->
  <div id="stats" class="hide"><div id="statsBody">
    <div id="statsTop"><div class="t">Where you're at</div>
      <button class="tbtn" id="stClose">Close</button></div>
    <div id="statsScroll"></div>
  </div></div>

  <!-- ---------------------------------------------------------- phone -->
  <div id="phone" class="hide"><div id="phoneBody">
    <div id="phoneTop">
      <button class="tbtn" id="phBack" style="display:none">&larr;</button>
      <div class="t" id="phTitle">Phone</div>
      <button class="tbtn" id="phClose">Close</button>
    </div>
    <div id="phoneTabs">
      <button data-tab="msg" class="on">Messages</button>
      <button data-tab="con">Contacts</button>
    </div>
    <div id="phoneList"></div>
    <div id="msgs" class="hide"></div>
    <div id="reply" class="hide"></div>
  </div></div>

  <!-- ---------------------------------------------------------- VN -->
  <div id="vn" class="hide">
    <div id="vnArt"></div>
    <img id="vnPort" alt="">
    <button class="tbtn" id="vnBack">Skip scene</button>
    <div id="vnBox"><div id="vnWrap">
      <div id="vnWho"></div>
      <div id="vnText"></div>
      <div id="vnChoices"></div>
    </div><div id="vnNext">CLICK</div></div>
  </div>

  <div id="toast"></div>
  <div id="modal" class="hide"><div id="modalBox">
    <h3 id="mTitle"></h3><p id="mBody"></p>
    <div class="row"><button class="mbtn" id="mNo">Back</button><button class="mbtn" id="mYes">Confirm</button></div>
  </div></div>
</div>

<script>
"use strict";
/* ==================================================== [JS-01] constants */
const SAVE_KEY = "tokyoshift_save_v1";
const ART = "assets/tokyoshift/";
/* Four phases, not three. Night is what makes the city worth walking:
   the konbini and the bar only exist after dark, and Sana only exists then. */
const PHASES = ["Morning","Afternoon","Evening","Night"];

/* Characters. `locked` describes how they enter the story — the four beyond
   the vertical slice are visible in the roster from day one but greyed, so the
   player can see there is more game than they have reached. */
const CHARS = {
  mei:    {name:"Mei",    age:26, role:"Closer",        color:"var(--mei)",    slice:true},
  haruka: {name:"Haruka", age:23, role:"Kitchen",       color:"var(--haruka)", slice:true},
  reiko:  {name:"Reiko",  age:41, role:"Manager",       color:"var(--reiko)",  hidden:true,
           hint:"Cover someone's shift."},
  rina:   {name:"Rina",   age:24, role:"Front",         color:"var(--rina)"},
  ayano:  {name:"Ayano",  age:19, role:"Part-time",     color:"var(--ayano)"},
  sana:   {name:"Sana",   age:30, role:"Night shift",   color:"var(--sana)",   hidden:true,
           hint:"Work nights."}
};
const AFF_MAX = 100;

/* ==================================================== [JS-02] state */
let S = null;

function freshState(){
  return {
    v:1, day:1, phase:0, money:0,
    aff:{mei:0,haruka:0,reiko:0,rina:0,ayano:0,sana:0},
    flags:{}, seen:{}, route:null, locked:[], shifts:0, nights:0,
    read:{}, sent:{}, locOpen:null, worked:{}, intim:{}, met:{}
  };
}

/* Same discipline as Cindervale: every field gets a default here so an old
   save never crashes a newer build. Add a field -> guard it here. */
function normalizeState(o){
  const d = freshState();
  if(!o || typeof o!=="object") return d;
  /* Merge into a FRESH object, not into `d`. Object.assign(d,o) mutates the
     defaults and replaces d.aff with the save's own aff object wholesale — so
     the next line would then assign that object onto itself and every
     character added since that save was written would be left undefined
     instead of 0. Caught by the migration test, never by a crash. */
  const s = Object.assign({}, d, o);
  s.aff = Object.assign({}, d.aff, o.aff||{});
  s.flags = o.flags||{}; s.seen = o.seen||{};
  s.read = o.read||{}; s.sent = o.sent||{}; s.worked = o.worked||{};
  s.intim = o.intim||{};
  s.met = o.met||{};
  s.locOpen = (o.locOpen && LOCS && LOCS[o.locOpen]) ? o.locOpen : null;
  s.locked = Array.isArray(o.locked)?o.locked:[];
  s.phase = Math.max(0,Math.min(PHASES.length-1, s.phase|0));
  s.day = Math.max(1, s.day|0);
  s.money = Math.max(0, s.money|0);
  for(const k in s.aff) s.aff[k] = Math.max(0, Math.min(AFF_MAX, s.aff[k]|0));
  return s;
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); toast("Saved."); }catch(e){ toast("Save failed."); } }
function load(){ try{ const r=localStorage.getItem(SAVE_KEY); return r?normalizeState(JSON.parse(r)):null; }catch(e){ return null; } }
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }

/* ==================================================== [JS-03] dom + fx */
const $ = id => document.getElementById(id);
function show(id){ ["title","hub","vn"].forEach(v => $(v).classList.toggle("hide", v!==id)); }
function toast(msg, cls){
  const d = document.createElement("div");
  d.className = "tst" + (cls?" "+cls:""); d.textContent = msg;
  $("toast").appendChild(d);
  setTimeout(()=>{ d.style.transition="opacity .4s"; d.style.opacity=0;
                   setTimeout(()=>d.remove(),400); }, 2100);
}
function confirmBox(title, body, onYes){
  $("mTitle").textContent=title; $("mBody").textContent=body;
  $("modal").classList.remove("hide");
  $("mYes").onclick=()=>{ $("modal").classList.add("hide"); onYes(); };
  $("mNo").onclick=()=>$("modal").classList.add("hide");
}
/* Art is generated in batches, so a missing file must degrade rather than
   show a broken-image icon mid-scene. */
/* .webp, not .png. The raw batch was 100 MB across 92 files; WebP at q82 is
   5.2 MB for the same picture. This repo is a GitHub Pages site, so weight is
   permanent in git history and metered on every page view. */
const EXT = ".webp";
function bgUrl(room){ return ART+"bg/"+room+EXT; }
function portUrl(who,room,expr){ return ART+"port/"+who+"_"+room+"_"+expr+EXT; }
function sceneUrl(id){ return ART+"scene/"+id+EXT; }

/* ==================================================== [JS-04] progression */
function affAdd(who, n){
  if(!(who in S.aff)) return;
  const before = S.aff[who];
  S.aff[who] = Math.max(0, Math.min(AFF_MAX, before + n));
  if(S.aff[who] !== before && n>0) toast(CHARS[who].name+" +"+n, "up");
}
function isLockedOut(who){ return S.locked.indexOf(who) >= 0; }
function available(who){
  if(isLockedOut(who)) return false;
  const c = CHARS[who];
  if(c.hidden && !S.flags["found_"+who]) return false;
  return true;
}
/* Committing to a route closes the others. The warning happens BEFORE the
   choice is taken, never after — see the `lockWarn` field on choices. */
function commitRoute(who){
  S.route = who;
  S.locked = Object.keys(CHARS).filter(k => k!==who && !isDuoPartner(k,who));
  toast("You chose "+CHARS[who].name+".", "lock");
}
/* Duo routes. mei+haruka is the slice's reachable one — the other pairs need
   characters whose routes are not written yet, so they sit here inert rather
   than being added later and forgotten. */
const DUOS = [["mei","haruka"],["reiko","rina"],["ayano","sana"]];
function isDuoPartner(a,b){ return DUOS.some(p => p.indexOf(a)>=0 && p.indexOf(b)>=0); }
function duoReady(a,b){
  return S.aff[a]>=70 && S.aff[b]>=70 && !isLockedOut(a) && !isLockedOut(b);
}

function advancePhase(){
  S.phase++;
  if(S.phase >= PHASES.length){ S.phase = 0; S.day++; onNewDay(); }
  renderHub();
}
/* One meeting per person per day. You could previously talk to someone at the
   shop, walk to the arcade, and talk to the same person again in the same
   afternoon -- which chewed through a whole route in a couple of in-game days
   and made the city feel like a corridor rather than a week. Working a shift
   with someone counts as the meeting. */
function metToday(who){ return S.met[who] === S.day; }
function markMet(who){ S.met[who] = S.day; }

function onNewDay(){
  if(S.shifts>=3 && !S.flags.found_reiko && S.flags.covered_shift){
    S.flags.found_reiko = 1; toast("Reiko noticed you.", "lock");
  }
  if(S.nights>=2 && !S.flags.found_sana){
    S.flags.found_sana = 1; toast("Someone else works nights.", "lock");
  }
}

/* ==================================================== [JS-05] the city
   The hub is a map, not a menu. Each location knows when it is open, who tends
   to be there, and what you can do — so "where do I go tonight" is the actual
   decision, and catching someone somewhere is a thing you can plan for. */
const LOCS = {
 home:    {name:"Your Place", x:14, y:76,
           blurb:"One room, a futon, a window that faces a wall. Rent's cheap for a reason.",
           open:[0,1,2,3]},
 shop:    {name:"The Shop", x:47, y:50,
           blurb:"Four seats wide, wedged between a laundromat and a stairwell. Smells like fryer oil at all times.",
           open:[0,1,2,3]},
 station: {name:"Station", x:80, y:73,
           blurb:"Everyone passes through here eventually. Last train's at midnight.",
           open:[1,2,3]},
 arcade:  {name:"Arcade", x:71, y:27,
           blurb:"Two floors, mostly broken machines, permanently too loud.",
           open:[2,3]},
 konbini: {name:"Konbini", x:26, y:25,
           blurb:"Open all night. The only other lit thing on this street after two.",
           open:[2,3]},
 park:    {name:"Backstreet Park", x:16, y:49,
           blurb:"Three benches and a vending machine. Quiet enough to read in.",
           open:[0,1,2]},
 bar:     {name:"Standing Bar", x:60, y:80,
           blurb:"Six people fit if nobody moves. The owner never asks anyone's name.",
           open:[2,3]},
};

/* Where each person is RIGHT NOW. One place at a time -- the first version
   tested each location independently, so anyone whose haunts overlapped in a
   phase (Mei had shop and station both on Evening) appeared in two places at
   once. locOf picks exactly one, deterministically, so people have a routine
   you can learn instead of a dice roll. */
const HAUNTS = {
 mei:    {shop:[0,1], station:[2], konbini:[3]},
 haruka: {shop:[0,1], arcade:[2,3], station:[2]},
 reiko:  {shop:[1], office:[2], bar:[3]},
 rina:   {shop:[0], bar:[2,3], station:[1]},
 ayano:  {shop:[1], park:[0,2]},
 sana:   {shop:[3], konbini:[3], station:[0]},
};
function locOf(k){
  if(!available(k)) return null;
  const h = HAUNTS[k]; if(!h) return null;
  const opts = Object.keys(h).filter(l => LOCS[l] && h[l].indexOf(S.phase)>=0 && locOpen(l));
  if(!opts.length) return null;
  return opts[(S.day*3 + S.phase + k.length) % opts.length];
}
function whoIsAt(locId){
  return Object.keys(CHARS).filter(k=>{
    if(S.aff[k] < 1 && locId !== "shop") return false;  // strangers aren't findable
    return locOf(k) === locId;
  });
}
function locOpen(id){ return LOCS[id].open.indexOf(S.phase) >= 0; }

/* ==================================================== [JS-05b] map render
   Painted buildings, not SVG dots. Each location is a card image positioned by
   percentage over the backdrop, radially masked in CSS so it melts into the
   art. Percentages (not viewBox units) because the backdrop is a cover-fitted
   photo now — a fixed coordinate space would drift off the building it labels
   as soon as the window aspect changed. */
function drawMap(){
  $("cityBg").style.backgroundImage = "url("+ART+"city/backdrop.webp)";
  const box = $("pins");
  box.innerHTML = "";
  for(const [id,L] of Object.entries(LOCS)){
    const open = locOpen(id), here = open ? whoIsAt(id) : [];
    const d = document.createElement("div");
    d.className = "bld" + (open?"":" closed");
    d.style.left = L.x+"%"; d.style.top = L.y+"%";
    let inner = '<div class="art" style="background-image:url('+ART+'city/'+id+'.webp)"></div>'+
                '<div class="nm">'+esc(L.name)+'</div>';
    if(!open) inner += '<div class="shut">closed</div>';
    else here.slice(0,3).forEach(k=>{
      inner += '<div class="who" style="color:'+CHARS[k].color+'">'+esc(CHARS[k].name)+'</div>';
    });
    d.innerHTML = inner;
    if(open) d.onclick = ()=>openLoc(id);
    box.appendChild(d);
  }
}

/* ==================================================== [JS-05c] hub render */
function renderHub(){
  $("hDay").textContent = S.day;
  $("hMoney").textContent = "¥"+S.money.toLocaleString();
  $("hPhase").textContent = PHASES[S.phase];
  drawMap();
  if($("loc").classList.contains("open") && S.locOpen) openLoc(S.locOpen);
  renderBadge();
}
function openLoc(id){
  if(!locOpen(id)) return;
  S.locOpen = id;
  const L = LOCS[id];
  $("locName").textContent = L.name;
  $("locBlurb").textContent = L.blurb;
  const here = whoIsAt(id);
  const w = $("locWho"); w.innerHTML = "";
  if(here.length){
    w.appendChild(Object.assign(document.createElement("div"),
      {className:"sec", textContent:"Here now"}));
    here.forEach(k=>{
      const c = CHARS[k], d = document.createElement("div");
      d.className = "here";
      d.innerHTML = '<div class="av" style="background-image:url('+avatarUrl(k)+')"></div>'+
        '<div><div class="n" style="color:'+c.color+'">'+esc(c.name)+'</div>'+
        '<div class="s">'+esc(c.role)+'</div></div>';
      w.appendChild(d);
    });
  }
  renderActs(id, here);
  $("loc").classList.add("open");
}
$("locClose").onclick = ()=>{ $("loc").classList.remove("open"); S.locOpen = null; };

function renderActs(locId, here){
  const box = $("acts"); box.innerHTML = "";
  buildActs(locId, here).forEach(a=>{
    const b = document.createElement("button");
    b.className = "act"; if(a.locked) b.disabled = true;
    b.innerHTML = '<div class="an">'+esc(a.name)+
      (a.tag?' <span class="tag '+a.tagCls+'">'+esc(a.tag)+'</span>':'')+'</div>'+
      '<div class="ad">'+esc(a.desc)+'</div>';
    if(!a.locked) b.onclick = a.go;
    box.appendChild(b);
  });
}

function buildActs(locId, here){
  const out = [];
  const withPeople = (here||[]).filter(k=>S.aff[k]>=10 && SCENES[k+"_hang0"]);
  if(locId === "shop"){
    const night = S.phase === 3, pay = night ? "¥6,500" : "¥4,000";
    const crew = (here||[]).filter(k=>SCENES[k+"_shift0"]);
    // one entry per coworker actually on with you, so you choose the company
    crew.forEach(k=>{
      if(metToday(k)){
        out.push({name:"Work with "+CHARS[k].name, locked:true, tag:"tomorrow", tagCls:"lock",
          desc:"You've already been on with her today."});
        return;
      }
      out.push({name:"Work the "+(night?"night ":"")+"shift with "+CHARS[k].name,
        tag:pay, tagCls:"pay",
        desc:night?"Eleven to seven, just the two of you.":"Six hours on the counter beside her.",
        go:()=>doShift(night,k)});
    });
    if(!crew.length) out.push({name:"Work the "+(night?"night ":"")+"shift alone",
      tag:pay, tagCls:"pay", desc:"Nobody else is on. Long six hours.",
      go:()=>{ const pay2 = night?6500:4000; S.money+=pay2; S.shifts++; if(night) S.nights++;
               toast("+¥"+pay2.toLocaleString(),"money"); advancePhase(); }});
    if(S.phase < 3 && !S.flags.covered_shift)
      out.push({name:"Cover someone's shift", tag:"¥2,000", tagCls:"pay",
        desc:"Nobody asked you to. Reiko keeps the rota herself.",
        go:()=>{ S.flags.covered_shift=1; S.money+=2000; S.shifts++;
                 toast("+¥2,000","money"); toast("Reiko keeps the rota.","lock");
                 advancePhase(); }});
  }
  if(locId === "shop" && S.phase < 3){
    // the break room: whoever else is on, in a room together, not serving
    const ens = [];
    for(let i=0;i<8;i++) if(sceneOk("break_ensemble"+i)) ens.push("break_ensemble"+i);
    if(ens.length) out.push({name:"Take your break",
      desc:"Eleven minutes in the back with whoever else is on.",
      go:()=>playScene(ens[(S.day+S.phase) % ens.length], ()=>advancePhase())});
  }
  if(locId === "home"){
    out.push({name:"Sleep", desc:"End the day here.", go:()=>{ S.phase=3; advancePhase(); }});
    out.push({name:"Check your phone", desc:unread()?unread()+" unread.":"Nothing new.",
      go:openPhone});
  }
  if(locId === "konbini")
    out.push({name:"Buy something hot", tag:"-¥400", tagCls:"lock",
      desc:"It's cold and you've been on your feet.",
      go:()=>{ if(S.money<400){ toast("Not enough."); return; }
               S.money-=400; toast("-¥400","money"); advancePhase(); }});
  if(locId === "bar")
    out.push({name:"Have a drink alone", tag:"-¥900", tagCls:"lock",
      desc:"Sit at the end. Nobody asks your name.",
      go:()=>{ if(S.money<900){ toast("Not enough."); return; }
               S.money-=900; toast("-¥900","money"); advancePhase(); }});
  if(locId === "park")
    out.push({name:"Sit for a while", desc:"Cheaper than the bar.",
      go:()=>advancePhase()});
  if(locId === "arcade")
    out.push({name:"Waste a few hundred yen", tag:"-¥300", tagCls:"lock",
      desc:"Most of the machines eat it without starting.",
      go:()=>{ if(S.money<300){ toast("Not enough."); return; }
               S.money-=300; toast("-¥300","money"); advancePhase(); }});
  if(locId === "station")
    out.push({name:"Ride one stop and walk back", desc:"You do this more than you admit.",
      go:()=>advancePhase()});
  // anyone standing here you actually know
  withPeople.forEach(k=>{
    if(locId === "shop") return;             // at work you talk by taking the shift
    const c = CHARS[k], partner = duoPartnerFor(k);
    const at = SCENES[k+"_at_"+locId];
    if(metToday(k)){
      out.push({name:"Talk to "+c.name, locked:true, tag:"tomorrow", tagCls:"lock",
        desc:"You've already had your time with her today."});
      return;
    }
    out.push({
      name:"Talk to "+c.name,
      tag: partner ? "duo" : (S.aff[k]>=70 ? "route" : null), tagCls:"new",
      desc: partner ? "She said she'd bring someone."
           : S.route===k ? "She's yours. She's still got things to say."
           : isLockedOut(k) ? "Things are different now."
           : (at && !S.seen[k+"_at_"+locId]) ? "She wasn't expecting to see you here."
           : S.aff[k]>=COMMIT_AFF && !canCommit(k) ? "Work a few more shifts with her first."
           : "She's got a minute.",
      go:()=>doTalk(k, locId)
    });
  });
  // visible-but-locked teasers
  Object.keys(CHARS).forEach(k=>{
    const c = CHARS[k];
    if(c.hidden && !S.flags["found_"+k] && locId==="shop")
      out.push({name:"???", tag:"locked", tagCls:"lock", locked:true, desc:c.hint});
  });
  if(!out.length) out.push({name:"Nothing here right now", locked:true,
    desc:"Try a different time of day."});
  return out;
}
function duoPartnerFor(k){
  for(const [a,b] of DUOS){
    if(k===a && duoReady(a,b)) return b;
    if(k===b && duoReady(a,b)) return a;
  }
  return null;
}
function avatarUrl(k){ return portUrl(k,"counter","neutral"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,
  m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

/* ==================================================== [JS-06] shift logic */
/* Working is no longer "press button, get whoever". You pick which coworker
   you're on with, because having three people rostered and only ever hearing
   from one of them was the single most repetitive thing in the build. */
function doShift(night, who){
  const pay = night ? 6500 : 4000;
  S.money += pay; S.shifts++; if(night) S.nights++;
  S.worked[who] = (S.worked[who]||0) + 1;
  markMet(who);
  toast("+¥"+pay.toLocaleString(), "money");
  playScene(pickShiftScene(who), ()=>{ advancePhase(); });
}
/* Story beats first, then banter. A tier scene is a MILESTONE and plays once;
   after that the pool rotates, so a fourth shift with the same person is a
   different conversation rather than the same one again. */
function pickShiftScene(who){
  const a = S.aff[who];
  const tier = a >= 45 ? 2 : (a >= 20 ? 1 : 0);
  for(let t=tier;t>=0;t--){
    const k = who+"_shift"+t;
    if(sceneOk(k) && !S.seen[k]) return k;
  }
  const pool = poolOf(who,"banter",12);
  if(pool.length) return pool[(S.worked[who]||0) % pool.length];
  for(let t=tier;t>=0;t--) if(SCENES[who+"_shift"+t]) return who+"_shift"+t;
  return "mei_shift0";
}
/* Talking to someone somewhere that isn't work. Prefers a scene written for
   THAT PLACE -- the whole point of finding her at the arcade is that it isn't
   the counter. Falls back through route beats to banter so it is never a
   dead click. */
/* Affection tiers for the OUT-OF-WORK scenes. Deliberately slower than the
   first pass: hang1 used to open at 40 and carried the commit choice, so a
   route could be finished in about five interactions. The commit now sits in
   hang3 behind COMMIT_AFF and a minimum number of shifts worked together, and
   the choice itself carries a `req` so it does not even appear early. */
const HANG_GATE = [0, 30, 50, 70];     // hang0..hang3
const COMMIT_AFF = 70, COMMIT_SHIFTS = 3;
function canCommit(who){
  return S.aff[who] >= COMMIT_AFF && (S.worked[who]||0) >= COMMIT_SHIFTS;
}
function hangTier(who){
  let t = 0;
  for(let i=0;i<HANG_GATE.length;i++) if(S.aff[who] >= HANG_GATE[i]) t = i;
  if(t >= 3 && !canCommit(who)) t = 2;   // hold at the door until she's ready
  return t;
}
/* A scene may carry its own `when`. That is how a payoff stays behind its
   setup: mei_banter4 is the Thursday man remembering her name, and it must not
   be offered to someone who never told her to ask him. */
function sceneOk(k){
  const sc = SCENES[k];
  return !!sc && (!sc.when || sc.when(S));
}
function poolOf(who, kind, n){
  const out = [];
  for(let i=0;i<n;i++){ const k = who+"_"+kind+i; if(sceneOk(k)) out.push(k); }
  return out;
}
function firstUnseen(list){ for(const k of list) if(!S.seen[k]) return k; return null; }
/* Nights together, per person. Gates what the intimate menu will even offer,
   so the first night cannot reach the last of it however you choose. Counted
   on reaching a room's _end rather than on entering the room, so backing out
   of a night does not advance anything. */
function intim(who){ return (S.intim && S.intim[who]) || 0; }
const ROOM_OWNER = {mei_room_end:"mei", har_room_end:"haruka", rei_room_end:"reiko",
                    rin_room_end:"rina", aya_room_end:"ayano", san_room_end:"sana"};

function doTalk(who, locId){
  markMet(who);
  const play = k => playScene(k, ()=>advancePhase());
  const partner = duoPartnerFor(who);
  if(partner){
    const k = "duo_"+[who,partner].sort().join("_");
    if(SCENES[k] && !S.seen[k]) return play(k);
  }
  /* AFTER you have chosen her, the relationship keeps going. This is the whole
     back half of the game and it did not exist: committing used to leave one
     looping scene and nothing else. */
  if(S.route === who){
    const milestone = firstUnseen(poolOf(who,"after",6));
    if(milestone) return play(milestone);
    const after = poolOf(who,"after",6);
    if(after.length) return play(after[(S.day + S.phase) % after.length]);
  }
  /* If you chose someone else, she is still a person you work with. She gets
     her own small ending rather than becoming a dead entry on the map. */
  if(isLockedOut(who)){
    const lk = firstUnseen(poolOf(who,"locked",3));
    if(lk) return play(lk);
    const lp = poolOf(who,"locked",3);
    if(lp.length) return play(lp[(S.day) % lp.length]);
  }
  const at = who+"_at_"+locId;
  if(SCENES[at] && !S.seen[at]) return play(at);
  const tier = hangTier(who);
  for(let t=tier;t>=0;t--){
    const k = who+"_hang"+t;
    if(SCENES[k] && !S.seen[k]) return play(k);
  }
  if(SCENES[at]) return play(at);
  const banter = poolOf(who,"banter",12);
  if(banter.length) return play(banter[(S.day+S.phase) % banter.length]);
  for(let t=tier;t>=0;t--) if(SCENES[who+"_hang"+t]) return play(who+"_hang"+t);
  toast("Nothing to say right now.");
}

/* ==================================================== [JS-06c] stats panel
   Everything the player can otherwise only infer: how far each relationship
   has actually got, which ones are shut and WHY, and what the hidden unlocks
   are waiting on. Descriptions are deliberately vague about numbers ("she's
   started waiting for you") rather than printing a percentage as the headline,
   because a bar you can game stops feeling like a person. */
function relNote(k){
  const a = S.aff[k], c = CHARS[k];
  if(isLockedOut(k)) return "You chose someone else. She's polite about it.";
  if(c.hidden && !S.flags["found_"+k]) return c.hint;
  if(S.route === k) return "You're with her.";
  if(a >= 70) return "She's stopped pretending this is about the shifts.";
  if(a >= 40) return "She looks for you when you're not on.";
  if(a >= 20) return "She's started waiting for you at close.";
  if(a >= 5)  return "She knows your name and that's about it.";
  return "You've barely spoken.";
}
const MILES = [
 {t:"Worked your first shift",  ok:s=>s.shifts>=1},
 {t:"Took a night shift",       ok:s=>s.nights>=1},
 {t:"Covered a shift nobody asked you to", ok:s=>!!s.flags.covered_shift},
 {t:"Found out who runs the rota", ok:s=>!!s.flags.found_reiko},
 {t:"Found out who works nights",  ok:s=>!!s.flags.found_sana},
 {t:"Committed to someone",     ok:s=>!!s.route},
 {t:"Got someone to bring a friend", ok:s=>!!(s.flags.duo_done||s.flags.duo_rr_done||s.flags.duo_as_done)},
];
function openStats(){
  const box = $("statsScroll");
  const seen = Object.keys(S.seen).length;
  const rows = [
   ["Day", S.day], ["Time", PHASES[S.phase]],
   ["Yen", "¥"+S.money.toLocaleString()], ["Shifts worked", S.shifts],
   ["Nights worked", S.nights], ["Scenes seen", seen],
  ];
  let h = '<div class="sec">You</div><div class="grid2">';
  rows.forEach(([k,v])=>{ h += '<div class="kv"><span class="k">'+esc(k)+
    '</span><span class="v">'+esc(v)+'</span></div>'; });
  h += '</div><div class="sec">Everyone</div>';
  Object.keys(CHARS).forEach(k=>{
    const c = CHARS[k], av = available(k), known = S.aff[k]>0 || av;
    h += '<div class="rel'+(av?'':' locked')+'">'+
      '<div class="top">'+
        '<div class="av" style="background-image:url('+avatarUrl(k)+')"></div>'+
        '<div class="nm" style="color:'+(av?c.color:'')+'">'+esc(known?c.name:"???")+
          (S.route===k?' <span class="rt on">route</span>':'')+
          (isLockedOut(k)?' <span class="rt out">closed</span>':'')+'</div>'+
        '<div class="pct">'+(known?S.aff[k]+"%":"—")+'</div>'+
      '</div>'+
      '<div class="bar"><i style="width:'+(av?S.aff[k]:0)+'%;background:'+c.color+'"></i></div>'+
      '<div class="note">'+esc(relNote(k))+'</div></div>';
  });
  h += '<div class="sec" style="margin-top:20px">Milestones</div>';
  MILES.forEach(m=>{
    const done = m.ok(S);
    h += '<div class="mile'+(done?'':' undone')+'">'+
      (done?'<span class="tick">&#10003;</span>':'<span class="no">&#9675;</span>')+
      '<span>'+esc(m.t)+'</span></div>';
  });
  box.innerHTML = h;
  $("stats").classList.remove("hide");
}
$("statsBtn").onclick = openStats;
$("stClose").onclick = ()=>$("stats").classList.add("hide");
$("stats").addEventListener("click", e=>{ if(e.target.id==="stats") $("stats").classList.add("hide"); });

function liveThreads(){ return TEXTS.filter(t=>t.need(S)); }
function lastLine(t){
  const sent = (S.sent[t.id]||[]).length;
  const r = t.rounds[Math.min(sent, t.rounds.length-1)];
  return r.msgs[r.msgs.length-1];
}
/* Unread means "she is waiting on you", not "you have never opened this". A
   thread with an unanswered round stays lit, so the badge keeps meaning
   something after the first read. */
function unread(){
  return liveThreads().filter(t=>(S.sent[t.id]||[]).length < t.rounds.length).length;
}
function renderBadge(){
  const n = unread(), b = $("badge");
  b.textContent = n; b.classList.toggle("hide", n===0);
}
let phTab = "msg", phThread = null;
function openPhone(){ $("phone").classList.remove("hide"); phThread=null; drawPhone(); }
function closePhone(){ $("phone").classList.add("hide"); renderBadge(); }
function drawPhone(){
  const list = $("phoneList"), msgs = $("msgs"), rep = $("reply");
  $("phBack").style.display = phThread ? "" : "none";
  if(phThread){
    const t = TEXTS.find(x=>x.id===phThread);
    $("phTitle").textContent = CHARS[t.who].name;
    list.classList.add("hide"); msgs.classList.remove("hide"); rep.classList.remove("hide");
    msgs.innerHTML = "";
    const sent = S.sent[t.id] || [];
    /* Render every round you have already answered, plus the one waiting on
       you. That is what makes it read as a conversation with history rather
       than a notification. */
    for(let r=0; r<=sent.length && r<t.rounds.length; r++){
      t.rounds[r].msgs.forEach(m=>{
        const d = document.createElement("div");
        d.className = "msg them"; d.textContent = m;
        msgs.appendChild(d);
      });
      if(sent[r] !== undefined){
        const d = document.createElement("div");
        d.className = "msg you"; d.textContent = sent[r];
        msgs.appendChild(d);
      }
    }
    rep.innerHTML = "";
    const round = t.rounds[sent.length];
    if(round){
      round.replies.forEach(r=>{
        const b = document.createElement("button");
        b.className = "rp"; b.textContent = r.t;
        b.onclick = ()=>{
          S.sent[t.id] = (S.sent[t.id]||[]).concat([r.t]);
          for(const k in (r.aff||{})) affAdd(k, r.aff[k]);
          if(r.flag) S.flags[r.flag] = 1;
          drawPhone(); renderBadge();
        };
        rep.appendChild(b);
      });
    } else {
      const d = document.createElement("div");
      d.style.cssText = "color:var(--faint);font-size:12px;text-align:center";
      d.textContent = "She'll message again when there's something to say.";
      rep.appendChild(d);
    }
    msgs.scrollTop = msgs.scrollHeight;
    return;
  }
  $("phTitle").textContent = "Phone";
  msgs.classList.add("hide"); rep.classList.add("hide"); list.classList.remove("hide");
  list.innerHTML = "";
  if(phTab === "msg"){
    const th = liveThreads();
    if(!th.length){ list.innerHTML = '<div id="phoneEmpty">No messages.<br>People text once they know you.</div>'; return; }
    th.forEach(t=>{
      const c = CHARS[t.who], un = (S.sent[t.id]||[]).length < t.rounds.length;
      const d = document.createElement("div"); d.className="thread";
      d.innerHTML = '<div class="av" style="background-image:url('+avatarUrl(t.who)+')"></div>'+
        '<div class="tb"><div class="tn" style="color:'+c.color+'">'+esc(c.name)+'</div>'+
        '<div class="tp">'+esc(lastLine(t))+'</div></div>'+
        (un?'<div class="un"></div>':'');
      d.onclick = ()=>{ S.read[t.id]=1; phThread=t.id; drawPhone(); renderBadge(); };
      list.appendChild(d);
    });
  } else {
    Object.keys(CHARS).forEach(k=>{
      const c = CHARS[k], av = available(k), known = S.aff[k]>0 || av;
      const d = document.createElement("div"); d.className="thread";
      d.innerHTML = '<div class="av" style="background-image:url('+avatarUrl(k)+')'+
        (av?'':';filter:grayscale(1) brightness(.4)')+'"></div>'+
        '<div class="tb"><div class="tn" style="color:'+(av?c.color:'')+'">'+
        esc(known?c.name:"???")+
        (S.route===k?' <span class="rt on">route</span>':'')+
        (isLockedOut(k)?' <span class="rt out">closed</span>':'')+'</div>'+
        '<div class="tp">'+esc(known?(c.role+" · "+S.aff[k]+"%"):(c.hint||"Not met"))+'</div></div>';
      list.appendChild(d);
    });
  }
}
$("phoneBtn").onclick = openPhone;
$("phClose").onclick = closePhone;
$("phBack").onclick = ()=>{ phThread=null; drawPhone(); };
$("phone").addEventListener("click", e=>{ if(e.target.id==="phone") closePhone(); });
[...document.querySelectorAll("#phoneTabs button")].forEach(b=>{
  b.onclick = ()=>{
    phTab = b.dataset.tab; phThread = null;
    [...document.querySelectorAll("#phoneTabs button")].forEach(x=>x.classList.toggle("on",x===b));
    drawPhone();
  };
});

/* ==================================================== [JS-07] VN player */
let VN = null;
/* If a scene has a variant written for the route you are actually on, play
   that instead. `mei_locked0__haruka` beats `mei_locked0` when you chose
   Haruka, so characters can react to WHO you picked by name rather than to
   the generic fact that you picked somebody. */
function variantOf(id){
  if(S && S.route && SCENES[id+"__"+S.route]) return id+"__"+S.route;
  return id;
}
function playScene(id, done){
  id = variantOf(id);
  const sc = SCENES[id];
  if(!sc){ console.warn("missing scene",id); done && done(); return; }
  S.seen[id] = 1;
  VN = {sc, i:0, done, id};
  show("vn");
  setArt(sc.bg, sc.art);
  step();
}
function setArt(room, sceneImg){
  const a = $("vnArt");
  if(sceneImg){
    a.style.backgroundImage = "url("+sceneUrl(sceneImg)+")"; a.classList.add("dim");
    clearPort();                  // the illustration IS the frame; sprite would obstruct it
  }
  else if(room){ a.style.backgroundImage = "url("+bgUrl(room)+")"; a.classList.add("dim"); }
  else { a.style.backgroundImage = "none"; }
}
/* A narration line does NOT clear the sprite. Hiding it every time the prose
   cuts in makes the portrait strobe in and out, which is what the first
   playthrough looked like. The sprite is cleared only when a full illustration
   takes over the frame, which is where it would just be in the way. */
function setPort(who, expr, room){
  const p = $("vnPort");
  if(!who) return;                       // narration: leave whoever is on screen
  const url = portUrl(who, room||VN.sc.portRoom||VN.sc.bg||"counter", expr||"neutral");
  p.onerror = ()=>{ p.style.opacity = 0; };
  p.onload  = ()=>{ p.style.opacity = 1; };
  if(p.getAttribute("src") !== url) p.src = url; else p.style.opacity = 1;
}
function clearPort(){ $("vnPort").style.opacity = 0; }

function step(){
  const sc = VN.sc, L = sc.lines;
  if(VN.i >= L.length){ endScene(); return; }
  /* A line can carry `when` and be skipped when it is false. This is what makes
     cross-route reactivity affordable: instead of writing five variants of a
     scene, one scene carries the lines that only exist if you chose Mei, or if
     Rina has been locked out, and the rest are stepped over silently. */
  let guard = 0;
  while(L[VN.i] && L[VN.i].when && !L[VN.i].when(S) && guard++ < 200) VN.i++;
  if(VN.i >= L.length){ endScene(); return; }
  const ln = L[VN.i];

  // a line can swap the art mid-scene
  if(ln.art !== undefined || ln.bg !== undefined) setArt(ln.bg||sc.bg, ln.art);

  if(ln.choices){
    /* If every option is gated out, this line has nothing to show. Rendering
       an empty box is a hard freeze -- no buttons and the advance handler is
       waiting on a decision that can never be made. Step past it instead.
       Belt and braces: the gating pass that added intimacy `req`s emptied
       mei_room_sex's continuation screen and this is what caught it. */
    if(ln.choices.filter(c=>!c.req || c.req()).length === 0){ VN.i++; step(); return; }
    renderChoices(ln); return;
  }

  $("vnChoices").innerHTML = "";
  $("vnNext").style.display = "";
  const who = ln.who ? CHARS[ln.who] : null;
  $("vnWho").textContent = who ? who.name : "";
  $("vnWho").style.color = who ? who.color : "";
  $("vnText").innerHTML = ln.who ? esc(ln.text)
                                 : '<span class="nar">'+esc(ln.text)+'</span>';
  setPort(ln.who, ln.expr, ln.room);
  if(ln.aff) for(const k in ln.aff) affAdd(k, ln.aff[k]);
  if(ln.flag) S.flags[ln.flag] = 1;
  VN.i++;
}

function renderChoices(ln){
  $("vnNext").style.display = "none";
  /* Only overwrite the text if this choice brings its own prompt. Blanking it
     otherwise strips away the line the player was mid-way through reading and
     leaves the options floating with no context. */
  if(ln.prompt){
    $("vnText").innerHTML = '<span class="nar">'+esc(ln.prompt)+'</span>';
    $("vnWho").textContent = "";
  }
  const box = $("vnChoices"); box.innerHTML = "";
  ln.choices.forEach(c=>{
    if(c.req && !c.req()) return;
    const b = document.createElement("button");
    b.className = "ch" + (c.lockWarn?" warnlock":"");
    b.innerHTML = esc(c.text) +
      (c.hint?'<span class="hint">'+esc(c.hint)+'</span>':'') +
      (c.lockWarn?'<span class="hint">this closes other routes</span>':'');
    b.onclick = ()=>takeChoice(c);
    box.appendChild(b);
  });
}
function takeChoice(c){
  const apply = ()=>{
    if(c.aff) for(const k in c.aff) affAdd(k, c.aff[k]);
    if(c.flag) S.flags[c.flag] = 1;
    if(c.money){ S.money += c.money; toast((c.money>0?"+":"")+"¥"+c.money.toLocaleString(),"money"); }
    if(c.commit) commitRoute(c.commit);
    if(c.goto){ const nx = SCENES[c.goto]; if(nx){ VN.sc = nx; VN.i = 0; setArt(nx.bg, nx.art); step(); return; } }
    VN.i++; step();
  };
  if(c.lockWarn){
    confirmBox("Are you sure?",
      "Choosing this commits you to "+CHARS[c.commit].name+
      ". The others stop being available. You can still finish what you've started with them.",
      apply);
  } else apply();
}
function endScene(){
  const who = ROOM_OWNER[VN.id];
  if(who){ S.intim[who] = intim(who) + 1; }
  const d = VN.done; VN = null;
  $("vnPort").style.opacity = 0;
  show("hub"); renderHub();
  d && d();
}

/* ==================================================== [JS-08] wiring */
/* ONE advance handler, on the whole VN layer, in the capture phase.
   The old version put click handlers on #vnArt and #vnBox only — but #vnPort
   (the character sprite) and #vnNext sit on top of both, so clicking the
   character, or the blinking CLICK prompt, did nothing at all. That is the
   "sometimes it just stops being clickable" bug: it depended entirely on where
   in the frame you happened to click. Listening on #vn catches every child. */
$("vn").addEventListener("click", e=>{
  if(e.target.closest(".ch")) return;        // choices handle themselves
  if(e.target.closest("#vnBack")) return;    // so does the skip button
  if(!VN) return;
  /* Gate on whether choice buttons are ON SCREEN, not on whether the current
     line happens to be a choice line.
     The old guard was `if(VN.sc.lines[VN.i]?.choices) return;` and it deadlocked
     the game: step() is the only thing that renders choices, and after the last
     dialogue line advanced the pointer onto a choice line, this guard refused to
     call step() — so the buttons were never drawn, clicking did nothing, and
     Skip Scene was the only way out. */
  if($("vnChoices").children.length) return;  // decision already on screen
  step();
});
$("vnBack").onclick = ()=>{ if(VN){ const d=VN.done; VN=null; show("hub"); renderHub(); d&&d(); } };
$("btnSave").onclick = save;
$("btnQuit").onclick = ()=>confirmBox("Back to title?","Unsaved progress since your last save is lost.",()=>{ show("title"); $("btnCont").disabled=!hasSave(); });
$("btnNew").onclick = ()=>{
  const start = ()=>{ S = freshState(); playScene("intro", ()=>{ renderHub(); }); };
  if(hasSave()) confirmBox("Start over?","This overwrites your existing save when you next save.",start);
  else start();
};
$("btnCont").onclick = ()=>{ const s = load(); if(!s){ toast("No save found."); return; } S = s; show("hub"); renderHub(); };

/* ==================================================== [JS-09] boot */
(function boot(){
  $("btnCont").disabled = !hasSave();
  show("title");
})();
</script>

  {text:"\"More. Obviously.\"",aff:{reiko:4}},
  {text:"\"You give the good ones more until they quit.\"",hint:"sharp",aff:{reiko:9},flag:"rei_saw"}]},
 {who:"reiko",expr:"surprise",text:"..."},

reiko_shift2:{ bg:"office", portRoom:"office", art:"rei_office", lines:[
 {text:"The office is a desk behind a curtain that doesn't shut. It's one in the morning and she's still at it."},
 {who:"reiko",expr:"neutral",bg:"office",text:"Rota, payroll, the tax thing. Sit down or go, don't hover."},

  {text:"\"Want a hand?\"",hint:"+Reiko",aff:{reiko:10}}]},
 {who:"reiko",expr:"soft",text:"Nobody's offered me that in eleven years."},

]},
reiko_hang0:{ bg:"office", portRoom:"office", art:"rei_office", lines:[
 {who:"reiko",expr:"neutral",bg:"office",text:"You stayed again."},
 {who:"reiko",expr:"soft",text:"I know how this looks. I've decided I don't care about that tonight."},
 {choices:[{text:"\"How does it look?\"",aff:{reiko:6}},
  {text:"\"Good.\"",aff:{reiko:8}},
  {text:"\"You care every other night.\"",aff:{reiko:10},flag:"rei_every"}]},
 {who:"reiko",expr:"blush",text:"Every other night I'm the manager. It's one in the morning. There's nobody here to manage."},
 {who:"reiko",expr:"soft",text:"Lock the front."}

reiko_hang1:{ bg:"office", portRoom:"office", lines:[
 {who:"reiko",expr:"soft",bg:"office",text:"Eleven years. Same desk. Same strip light that's never once been changed."},
 {who:"reiko",expr:"neutral",text:"I'm forty-one. I'm not going to pretend this is going somewhere respectable."},

 {who:"reiko",expr:"blush",text:"..."},
 {who:"reiko",expr:"soft",text:"My flat's twenty minutes. Or there's the desk."},
 {choices:[{prompt:"She hasn't moved. She's letting someone else decide, which she never does.",
   text:"The desk.",hint:"commits to Reiko",aff:{reiko:12},commit:"reiko",lockWarn:true,req:()=>intim("reiko")>=4,goto:"rei_desk_s"},
  {text:"Her flat.",hint:"commits to Reiko",aff:{reiko:12},commit:"reiko",lockWarn:true,goto:"rei_room_a"},

rei_desk_s:{ bg:"office", art:"rei_desk", lines:[

rei_room_a:{ bg:"reiko_room", art:"rei_room1", lines:[

rei_room_b:{ bg:"reiko_room", art:"rei_nude", lines:[
 {who:"reiko",expr:"blush",bg:"reiko_room",text:"I'm forty-one. If you're going to be strange about that, be strange about it now."},

rei_room_sex:{ bg:"reiko_room", art:"rei_sex", lines:[

rei_room_ride:{ bg:"reiko_room", art:"rei_ride", lines:[
 {who:"reiko",expr:"blush",bg:"reiko_room",text:"Stay there. Eleven years of doing what needs doing. Let me have this one."},

 {who:"reiko",expr:"blush",bg:"reiko_room",text:"Slowly. I mean it. I'll say when."},

 {who:"reiko",expr:"blush",text:"Mm."}

reiko_hang2:{ bg:"reiko_room", art:"rei_room1", lines:[
 {who:"reiko",expr:"soft",bg:"reiko_room",text:"I've put you on closings. So we finish at the same time."},

/* ---------------------------------------------------------------- Rina */
rina_shift0:{ bg:"counter", lines:[
 {who:"rina",expr:"smile",text:"You've met everyone now right? Okay, let me save you a month."},
 {who:"rina",expr:"smile",text:"Mei's not cold she's just done with it. Haruka's a golden retriever. Ayano would apologise to a door."},
 {who:"rina",expr:"neutral",text:"And Reiko's the scariest woman in Shinjuku and I'd take a bullet for her, obviously."},
 {choices:[{text:"\"What's mine?\"",aff:{rina:6}},
  {text:"\"That's a lot of opinions.\"",aff:{rina:3}},
  {text:"\"You skipped yourself.\"",hint:"noticed",aff:{rina:8},flag:"rin_noticed"}]},
 {who:"rina",expr:"blush",text:"Mine's boring! Mine's, like, girl talks too much, girl works here. Next."}
]},
rina_shift1:{ bg:"counter", lines:[
 {who:"rina",expr:"smile",text:"Guess who got kept behind Friday. Go on."},
 {who:"rina",expr:"annoyed",text:"Me. It's always me. She thinks I don't take it seriously."},
 {choices:[{text:"\"Do you?\"",aff:{rina:4}},
  {text:"\"You take it more seriously than any of us.\"",aff:{rina:9},flag:"rin_seen"},
  {text:"\"She keeps everyone behind.\"",aff:{rina:3}}]},
 {who:"rina",expr:"blush",text:"...You can't just say stuff like that during a lunch rush."}
]},
rina_shift2:{ bg:"break", lines:[
 {who:"rina",expr:"neutral",bg:"break",text:"Can I say the real thing? Not the gossip version."},
 {who:"rina",expr:"soft",text:"I know everything about everyone because it's how I can tell I'm actually part of it."},
 {choices:[{text:"\"You are part of it.\"",aff:{rina:10}},
  {text:"\"That's a rough way to live.\"",aff:{rina:8}},
  {text:"\"Tell me something about you instead.\"",hint:"+Rina",aff:{rina:12},flag:"rin_you"}]},
 {who:"rina",expr:"blush",text:"Ugh. You're going to be a problem."}
]},
rina_hang0:{ bg:"street", art:"rin_walk", lines:[
 {who:"rina",expr:"smile",bg:"street",text:"Okay so the deal is we walk to the station, I talk, you go 'mm' in the right places."},
 {who:"rina",expr:"smile",text:"That's it. That's the whole friendship. Very low effort."},
 {choices:[{text:"\"Mm.\"",aff:{rina:6}},
  {text:"\"Or you could ask me something.\"",aff:{rina:9},flag:"rin_ask"},
  {text:"\"I like listening to you.\"",aff:{rina:8}}]},
 {who:"rina",expr:"blush",text:"...Nobody asks me things. They just let me go until I stop."}
]},
rina_hang1:{ bg:"rina_room", art:"rin_room1", lines:[
 {text:"Bright, cluttered, every surface covered in stuff she clearly loves."},
 {who:"rina",expr:"smile",bg:"rina_room",text:"Don't say it's a lot. I know it's a lot. It's on purpose."},
 {who:"rina",expr:"soft",text:"Empty rooms make me weird."},
 {choices:[{text:"\"It suits you.\"",aff:{rina:8}},
  {text:"\"You don't have to fill the quiet with me.\"",hint:"+Rina",aff:{rina:12},flag:"rin_quiet"},
  {text:"\"It's a lot.\"",aff:{rina:2}}]},
 {who:"rina",expr:"blush",text:"Okay, that one got me. That's not fair."},
 {choices:[{prompt:"First time since you met her that she's not talking.",
   text:"Kiss her.",hint:"commits to Rina",aff:{rina:12},commit:"rina",lockWarn:true,goto:"rin_room_a"},
  {text:"\"I should go.\"",aff:{rina:2}}]}
]},
rin_room_a:{ bg:"rina_room", art:"rin_undress", lines:[
 {who:"rina",expr:"blush",bg:"rina_room",text:"Heads up, I'm going to talk the whole time. It's a nerves thing. It's not a review."},
 {choices:[{text:"\"Talk all you want.\"",aff:{rina:10},goto:"rin_room_b"},
  {text:"\"Try being quiet.\"",aff:{rina:8},goto:"rin_room_b"}]}
]},
rin_room_b:{ bg:"rina_room", art:"rin_nude", lines:[
 {who:"rina",expr:"soft",bg:"rina_room",text:"...Okay, the quiet thing is actually really —"},

]},
rin_room_oral:{ bg:"rina_room", art:"rin_oral", lines:[
 {text:"She gets about half a sentence out and then gives up on sentences."},
 {choices:[{text:"Keep going.",aff:{rina:10},goto:"rin_room_end"},

]},
rin_room_sex:{ bg:"rina_room", art:"rin_sex", lines:[
 {art:"rin_top",text:"She goes properly quiet, which from her is the loudest thing that's happened tonight."},
 {choices:[{text:"Let her on top.",aff:{rina:10},req:()=>intim("rina")>=3,goto:"rin_room_ride"},
  {text:"Turn her over.",aff:{rina:10},req:()=>intim("rina")>=4,goto:"rin_room_anal"},

]},
rin_room_ride:{ bg:"rina_room", art:"rin_ride", lines:[
 {who:"rina",expr:"blush",bg:"rina_room",text:"Okay this is my favourite, this is officially my favourite, I'm telling every—"},
 {who:"rina",expr:"surprise",text:"Not everyone! You know what I meant!"},
 {choices:[{text:"Finish.",aff:{rina:12},goto:"rin_room_end"}]}

rin_room_anal:{ bg:"rina_room", art:"rin_anal", lines:[
 {who:"rina",expr:"blush",bg:"rina_room",text:"Slow, slow, slow — okay. Okay!"},

rin_room_end:{ bg:"rina_room", lines:[
 {text:"She's quiet for a full minute, which you now understand is enormous."},
 {who:"rina",expr:"soft",text:"I'm not going to gossip about this one."},
 {who:"rina",expr:"blush",text:"From me that's basically a proposal. Just so you can calibrate."},

rina_hang2:{ bg:"rina_room", art:"rin_room1", lines:[

/* ---------------------------------------------------------------- Ayano */
ayano_shift0:{ bg:"counter", lines:[
 {who:"ayano",expr:"blush",text:"Sorry — sorry, I'm in your way. I'm always in the way, everyone says so."},

 {who:"ayano",expr:"neutral",text:"I've got exams in March. I keep telling my mum I'll drop hours and then I don't."},

ayano_hang1:{ bg:"ayano_room", art:"aya_room1", lines:[
 {text:"Her room's smaller than the break room and twice as tidy. Textbooks squared off on the desk."},
 {who:"ayano",expr:"blush",bg:"ayano_room",text:"I've never had anyone here. I practised what the room would look like. That's insane, sorry."},

aya_room_b:{ bg:"ayano_room", art:"aya_nude", lines:[

/* ---------------------------------------------------------------- Sana */
sana_shift0:{ bg:"counter", lines:[
 {text:"After eleven it stops being a shop and turns into a lit box people walk past."},
 {text:"Someone's already behind the counter. You've never seen her on a rota."},
 {who:"sana",expr:"neutral",text:"You're the one taking all the nights."},

sana_shift1:{ bg:"counter", lines:[
 {text:"Three in the morning. One customer in the last ninety minutes."},
 {who:"sana",expr:"soft",text:"I don't sleep. That's the answer to the thing you didn't ask again."},

 {text:"A bed, a lamp, nothing on the walls. It doesn't look temporary. It looks settled."},

san_room_b:{ bg:"sana_room", art:"san_nude", lines:[
 {text:"She turns the lamp down instead of off. Doesn't explain it."},

san_room_oral:{ bg:"sana_room", art:"san_oral", lines:[

san_room_sex:{ bg:"sana_room", art:"san_sex", lines:[

san_room_anal:{ bg:"sana_room", art:"san_anal", lines:[
 {who:"sana",expr:"blush",bg:"sana_room",text:"Slowly. I said slowly, I meant all of it."},

san_room_end:{ bg:"sana_room", lines:[
