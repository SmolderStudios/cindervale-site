 {who:"mei",expr:"soft",text:"Haruka thinks I hate this station. I've never said that. I've never said anything about it."},
 {choices:[{text:"\"You turn it down every time.\"",aff:{mei:4}},
  {text:"\"So you like it.\"",aff:{mei:5}},
  {text:"\"Tell her.\"",aff:{mei:3}}]},
 {who:"mei",expr:"neutral",text:"I turn it down because it's loud. Those are different facts and she's welded them together."},
 {text:"She turns it back up one click, glances at you, and dares you to comment."}
]},
mei_banter6:{ bg:"break", lines:[
 {text:"Break. She's eating something out of a container with a lid that clearly does not belong to the container."},
 {who:"mei",expr:"neutral",bg:"break",text:"Reiko put a second chair in her office eleven years ago and it has had a box of napkins on it for eleven years."},
 {who:"mei",expr:"soft",text:"I moved the box once, about year two. Sat down. She looked at me like I'd taken my shoes off."},
 {choices:[{text:"\"What did she say?\"",aff:{mei:4}},
  {text:"\"You tried, though.\"",aff:{mei:5}},
  {text:"\"Try again.\"",aff:{mei:6},flag:"mei_try_reiko"}]},
 {who:"mei",expr:"neutral",text:"She said 'napkins go on the floor, not the desk', and then she talked to me for an hour and a half about the fryer contract."},
 {who:"mei",expr:"soft",text:"...Which I now think was the point. It took me nine years to work that out."}
]},

/* ---------------- Haruka ---------------- */
haruka_banter3:{ bg:"kitchen", portRoom:"counter", lines:[
 {text:"The extractor fan is doing the noise. It has been doing the noise for eleven days."},
 {who:"haruka",expr:"annoyed",text:"Five entries. FIVE. 'Noted', 'noted', 'noted', 'noted', and last week she just drew a little tick."},
 {choices:[{text:"\"A tick is progress.\"",aff:{haruka:4}},
  {text:"\"Log it again.\"",aff:{haruka:5}},
  {text:"\"I'll say something to her.\"",aff:{haruka:6},flag:"har_fan_help"}]},
 {who:"haruka",expr:"surprise",text:"You'd — no. No, don't. She'll know I put you up to it, she's got a sense for it, she's like a dog with weather."},
 {text:"She logs it a sixth time. She writes it slightly bigger."}
]},
haruka_banter4:{ bg:"kitchen", portRoom:"counter", when:s=>s.flags.har_fan_help, lines:[
 {text:"There's a man on a stepladder in the kitchen with the extractor cover off."},
 {who:"haruka",expr:"surprise",text:"Okay so what did you SAY to her."},
 {choices:[{text:"\"I said the fan was broken.\"",aff:{haruka:5}},
  {text:"\"I said Haruka's logged it six times.\"",aff:{haruka:8}},
  {text:"\"Nothing. Must be the tick.\"",aff:{haruka:6}}]},
 {who:"haruka",expr:"blush",text:"You said my name. You went in there and said my name."},
 {who:"haruka",expr:"smile",text:"...Six weeks. Six weeks that thing's been screaming and it took one person saying my name in that office."},
 {text:"She is unbearable about it for the rest of the shift and you would not change a thing."}
]},
haruka_banter5:{ bg:"kitchen", portRoom:"counter", lines:[
 {who:"haruka",expr:"smile",text:"New plant. Look at it. Look at how alive it is."},
 {text:"It is on the shelf above the warmer, which is the hottest place in the building."},
 {choices:[{text:"\"That's going to die.\"",aff:{haruka:4}},
  {text:"\"It's beautiful.\"",aff:{haruka:5}},
  {text:"Move it somewhere it might live.",aff:{haruka:7},flag:"har_plant_moved"}]},
 {who:"haruka",expr:"blush",text:"...Oh. Yeah. That's — the heat. Obviously the heat."},
 {who:"haruka",expr:"soft",text:"That's why the last one died, isn't it. That's just why the last one died."}
]},
haruka_banter6:{ bg:"break", lines:[
 {text:"Break. She's got her feet on the second chair and she's gone quiet, which for her is a weather event."},
 {who:"haruka",expr:"neutral",bg:"break",text:"Mei's birthday's next month. Reiko does a card. Everyone signs it and nobody says anything and Mei takes it home."},
 {who:"haruka",expr:"soft",text:"I've signed four of those. Four years of writing 'happy birthday, Haruka' like a stranger."},
 {choices:[{text:"\"Say it out loud this year.\"",aff:{haruka:6},flag:"har_birthday"},
  {text:"\"Write something real in it.\"",aff:{haruka:5}},
  {text:"\"She'd hate that.\"",aff:{haruka:3}}]},
 {who:"haruka",expr:"smile",text:"She'd HATE it. She'd absolutely hate it."},
 {who:"haruka",expr:"soft",text:"...I'm going to do it anyway."}
]},

/* ---------------- Reiko ---------------- */
reiko_banter3:{ bg:"counter", lines:[
 {text:"Two o'clock. The floor walk. Rina is at the drinks station doing something with a nail file and a look of total concentration."},
 {text:"Reiko takes ninety seconds. Rina finishes with about four to spare."},
 {who:"reiko",expr:"neutral",text:"She thinks I don't know."},
 {choices:[{text:"\"You know?\"",aff:{reiko:5}},
  {text:"\"How long have you known?\"",aff:{reiko:6}},
  {text:"\"Then why ninety seconds?\"",aff:{reiko:8},flag:"rei_ninety"}]},
 {who:"reiko",expr:"soft",text:"Because ninety seconds is long enough for her to finish."},
 {text:"She walks off before you can say anything about it, which is a thing she does deliberately and which you are starting to be able to read."}
]},
reiko_banter4:{ bg:"office", portRoom:"office", art:"rei_office", lines:[
 {text:"The napkins are on the floor. The second chair is empty."},
 {who:"reiko",expr:"neutral",bg:"office",text:"Don't comment on the chair."},
 {choices:[{text:"Sit in it.",aff:{reiko:7},flag:"rei_chair"},
  {text:"\"Who moved the napkins?\"",aff:{reiko:5}},
  {text:"Not commenting on the chair.",aff:{reiko:4}}]},
 {who:"reiko",expr:"blush",text:"I moved them. Yesterday. At about four in the morning, which is when I make my worst decisions."},
 {who:"reiko",expr:"soft",text:"Mei sat in it once, in year two, and I made her feel like she'd broken into a house. I've thought about that more than I'd like."}
]},
reiko_banter5:{ bg:"counter", lines:[
 {text:"A delivery has come in wrong and there is a man at the back door being difficult about it."},
 {text:"She is out there for four minutes. When she comes back the delivery is right, the man is apologetic, and she has not raised her voice once."},
 {who:"reiko",expr:"annoyed",text:"Don't look impressed. It's a job."},
 {choices:[{text:"\"That was impressive.\"",aff:{reiko:5}},
  {text:"\"How do you do that?\"",aff:{reiko:6}},
  {text:"\"Does anyone ever tell you that?\"",aff:{reiko:8},flag:"rei_told_good"}]},
 {text:"She stops with the clipboard halfway to the shelf."},
 {who:"reiko",expr:"soft",text:"...No. That's not a complaint. It's the job. But no."}
]},
reiko_banter6:{ bg:"office", portRoom:"office", lines:[
 {who:"reiko",expr:"neutral",bg:"office",text:"I have been doing this rota by hand for eleven years. There is software. I have been told about the software."},
 {choices:[{text:"\"Why not use it?\"",aff:{reiko:4}},
  {text:"\"You like doing it.\"",aff:{reiko:7}},
  {text:"\"Show me. I'll learn it.\"",aff:{reiko:8},flag:"rei_rota_taught"}]},
 {who:"reiko",expr:"soft",text:"I like doing it. That's the answer and it's embarrassing, so we'll be moving on."},
 {who:"reiko",expr:"neutral",text:"It's the one hour where I decide what the next fortnight looks like for six people. Software would take that off me in about nine seconds."}
]},

/* ---------------- Rina ---------------- */
rina_banter3:{ bg:"counter", lines:[
 {who:"rina",expr:"smile",text:"Okay so I've been keeping a list of everything Reiko has ever said to me that wasn't about work."},
 {choices:[{text:"\"How long is the list?\"",aff:{rina:5}},
  {text:"\"Rina.\"",aff:{rina:3}},
  {text:"\"Read it to me.\"",aff:{rina:6}}]},
 {who:"rina",expr:"blush",text:"Four things. In six years. And one of them was 'mind the step'."},
 {who:"rina",expr:"soft",text:"...The other three are quite good though. I'm not going to tell you what they are."}
]},
rina_banter4:{ bg:"counter", lines:[
 {text:"She's got her chin on her hands watching Ayano try to explain something to a customer."},
 {who:"rina",expr:"soft",text:"She's got better. Have you noticed? She used to apologise before she'd said anything. Now she gets a whole sentence out first."},
 {choices:[{text:"\"You've been watching for it.\"",aff:{rina:6}},
  {text:"\"You're proud of her.\"",aff:{rina:7}},
  {text:"\"That's you, partly.\"",aff:{rina:8},flag:"rin_credit"}]},
 {who:"rina",expr:"blush",text:"It is NOT me. I just talk at her. Talking at people isn't a skill, it's a condition."},
 {text:"It is very much her, and she knows it, and she goes bright red and reorganises the sauce sachets."}
]},
rina_banter5:{ bg:"break", lines:[
 {text:"Break. She has been quiet for six minutes."},
 {who:"rina",expr:"neutral",bg:"break",text:"I've been thinking about the fish tank thing. That I said. About us being in here in the light."},
 {who:"rina",expr:"soft",text:"I think I like the fish tank. That's the update. Six weeks of thinking and the answer is 'actually the tank's fine'."},
 {choices:[{text:"\"That's a good update.\"",aff:{rina:6}},
  {text:"\"What changed?\"",aff:{rina:7}},
  {text:"\"I like the tank too.\"",aff:{rina:8}}]},
 {who:"rina",expr:"blush",text:"Don't ask what changed. You know what changed. Everyone in this building knows what changed."}
]},
rina_banter6:{ bg:"counter", lines:[
 {who:"rina",expr:"smile",text:"Right. Nails. Give me your hand, floor walk's not for eleven minutes."},
 {choices:[{text:"Give her your hand.",aff:{rina:6}},
  {text:"\"You've got four minutes of margin, not eleven.\"",aff:{rina:7}},
  {text:"\"I'll pass.\"",aff:{rina:2}}]},
 {who:"rina",expr:"surprise",text:"You've TIMED the floor walk. You've been timing the floor walk."},
 {who:"rina",expr:"smile",text:"Oh, we're the same. That's horrifying. Hand."}
]},

/* ---------------- Ayano ---------------- */
ayano_banter3:{ bg:"counter", lines:[
 {text:"She's back at the drinks machine, looking at the button she pressed."},
 {who:"ayano",expr:"blush",text:"I've pressed it four more times. It's soda water every time. I don't even want soda water."},
 {choices:[{text:"\"Then why press it?\"",aff:{ayano:5}},
  {text:"\"Press it again.\"",aff:{ayano:6}},
  {text:"\"Because you can.\"",aff:{ayano:8},flag:"aya_because"}]},
 {who:"ayano",expr:"surprise",text:"...Yes. That's it. That's exactly it and I couldn't have said it."},
 {text:"She presses it again. Soda water. She looks delighted about it in a way that is disproportionate and completely correct."}
]},
ayano_banter4:{ bg:"counter", lines:[
 {who:"ayano",expr:"neutral",text:"Sana walked me to the station. On Tuesday. She just — asked."},
 {who:"ayano",expr:"blush",text:"I said yes before she'd finished the sentence, which I've been thinking about since, because I've been thinking about it for two years."},
 {choices:[{text:"\"Two years?\"",aff:{ayano:5}},
  {text:"\"How was it?\"",aff:{ayano:6}},
  {text:"\"You'd have said yes any time.\"",aff:{ayano:7}}]},
 {who:"ayano",expr:"soft",text:"We didn't talk much. It was twelve minutes and we talked for maybe four of them and it was the best Tuesday I've had in a year."}
]},
ayano_banter5:{ bg:"counter", lines:[
 {text:"Somebody has spilled an entire tray and it is not her fault and she is apologising anyway."},
 {text:"Then she stops. Mid-word. You actually see her decide."},
 {who:"ayano",expr:"surprise",text:"...That wasn't me."},
 {choices:[{text:"\"No. It wasn't.\"",aff:{ayano:7}},
  {text:"\"Say it again.\"",aff:{ayano:8}},
  {text:"Hand her the mop anyway.",aff:{ayano:4}}]},
 {who:"ayano",expr:"blush",text:"That wasn't me! I'm going to clean it up because I'm nice, not because it was me."},
 {text:"She cleans it up. She says 'because I'm nice' twice more, quietly, apparently to herself."}
]},
ayano_banter6:{ bg:"break", lines:[
 {text:"Break. She's got the textbook out and she's reading it under her breath, which is new, and which she doesn't seem to have noticed she's doing."},
 {choices:[{text:"Don't mention it.",aff:{ayano:7},flag:"aya_unnoticed"},
  {text:"\"You're doing it out loud.\"",aff:{ayano:5}},
  {text:"\"Louder. I'll listen.\"",aff:{ayano:8}}]},
 {who:"ayano",expr:"blush",text:"Am I? Oh — I've been doing it on the train as well. A man moved seats."},
 {who:"ayano",expr:"smile",text:"He moved seats and I didn't apologise to him. I thought about it for four stops, but I didn't."}
]},

/* ---------------- Sana ---------------- */
sana_banter3:{ bg:"counter", lines:[
 {text:"Five in the morning. She goes out with the coffee. Ninety seconds. Comes back."},
 {who:"sana",expr:"neutral",text:"He wasn't there tonight."},
 {choices:[{text:"\"Where'd he go?\"",aff:{sana:5}},
  {text:"\"Is that good or bad?\"",aff:{sana:6}},
  {text:"\"You still went out.\"",aff:{sana:8},flag:"san_still_went"}]},
 {who:"sana",expr:"soft",text:"I still went out. I stood there for a bit with a coffee like an idiot and then I drank it myself."},
 {who:"sana",expr:"neutral",text:"I hope he's somewhere better. That's the whole thought. I've been having it for two hours."}
]},
sana_banter4:{ bg:"counter", lines:[
 {text:"Half three. She's got the radio on without being asked."},
 {who:"sana",expr:"soft",text:"I've started choosing things. Small ones. This station. A sandwich last week."},
 {choices:[{text:"\"That's not small.\"",aff:{sana:7}},
  {text:"\"What else?\"",aff:{sana:6}},
  {text:"\"Keep going.\"",aff:{sana:8}}]},
 {who:"sana",expr:"blush",text:"I bought a lamp. A different lamp. It's the same as the old lamp but I chose it, which is apparently the entire point."},
 {text:"She taps the counter twice on a beat and doesn't seem to notice she's done it."}
]},
sana_banter5:{ bg:"counter", lines:[
 {text:"Four in the morning. No customers since one. She's been looking at the same spot on the counter for a while."},
 {who:"sana",expr:"neutral",text:"Ask me something. Anything. I'd like to be asked something at four in the morning by a person."},
 {choices:[{text:"\"What did you want to be?\"",aff:{sana:7}},
  {text:"\"What's the postcard of?\"",aff:{sana:8}},
  {text:"\"Are you alright?\"",aff:{sana:6}}]},
 {who:"sana",expr:"soft",text:"...That's a better question than I was expecting. Give me a minute."},
 {text:"She takes the minute. She answers it properly. It takes about six minutes and neither of you serves a single customer during it."}
]},
sana_banter6:{ bg:"counter", lines:[
 {who:"sana",expr:"neutral",text:"Ayano's stopped apologising for things that aren't hers."},
 {who:"sana",expr:"soft",text:"I noticed it on the walk. She got interrupted and she just — carried on with her sentence. Two years ago she'd have folded."},
 {choices:[{text:"\"People change.\"",aff:{sana:4}},
  {text:"\"You noticed.\"",aff:{sana:6}},
  {text:"\"So did you.\"",aff:{sana:8},flag:"san_so_did_you"}]},
 {who:"sana",expr:"blush",text:"..."},
 {who:"sana",expr:"soft",text:"That's an unkind thing to say to someone at four in the morning and I'm going to be thinking about it until Thursday."}
]},

/* ---------------- ensemble ---------------- */
break_ensemble2:{ bg:"break", lines:[
 {text:"Break room. Haruka has brought in a cake for no stated reason and is defending it aggressively."},
 {who:"haruka",expr:"smile",bg:"break",text:"It's not for anything. It's a Tuesday cake. People can have a Tuesday cake."},
 {who:"rina",expr:"smile",text:"Nobody has ever brought a Tuesday cake in the history of this building."},
 {who:"ayano",expr:"blush",text:"I think it's nice."},
 {who:"rina",expr:"annoyed",text:"Ayano thinks EVERYTHING'S nice, Ayano's not a valid data point."},
 {who:"ayano",expr:"neutral",text:"I don't think the bins are nice."},
 {text:"There is a short silence in which Rina visibly recalculates."},
 {who:"rina",expr:"surprise",text:"...Okay. Okay, she's got range now. When did she get range."},
 {who:"haruka",expr:"smile",when:s=>!s.route,text:"Cake. Everyone. Now. Before Reiko does the floor."},
 {who:"haruka",expr:"blush",when:s=>s.route==="haruka",text:"...It's not a Tuesday cake. Obviously it's not a Tuesday cake. Everyone stop looking at me."},
 {who:"rina",expr:"smile",when:s=>s.route==="rina",text:"It's a Tuesday cake and I'm having two slices and nobody in this room is going to say anything about it."},
 {choices:[{text:"Have some cake.",aff:{haruka:4,rina:3,ayano:3}},
  {text:"\"What's the occasion, Haruka?\"",aff:{haruka:6,rina:4}},
  {text:"\"Ayano's got range.\"",aff:{ayano:7,rina:4}}]},
 {text:"Reiko does the floor at two. There is no cake anywhere. Nobody knows how Haruka did it."}
]},
break_ensemble3:{ bg:"break", lines:[
 {text:"The card is on the table. Reiko's signature is already in it, in the top corner, in handwriting like a fence."},
 {who:"rina",expr:"neutral",bg:"break",text:"Right. Everyone signs, nobody makes it weird, Mei takes it home. That's four years of protocol."},
 {who:"haruka",expr:"neutral",when:s=>s.flags.har_birthday,text:"I'm saying it out loud this year."},
 {who:"rina",expr:"surprise",when:s=>s.flags.har_birthday,text:"You're WHAT."},
 {who:"haruka",expr:"smile",when:s=>s.flags.har_birthday,text:"I'm saying happy birthday. Out loud. With my mouth. To her face."},
 {who:"ayano",expr:"blush",when:s=>s.flags.har_birthday,text:"...Can I say it too? After you. Slightly after you."},
 {who:"rina",expr:"soft",when:s=>!s.flags.har_birthday,text:"Four years and none of us has ever said it. That's mental when you say it out loud."},
 {choices:[{text:"Sign it and say nothing.",aff:{mei:3}},
  {text:"\"We're all saying it this year.\"",aff:{mei:6,haruka:5,rina:5,ayano:5},flag:"birthday_out_loud"},
  {text:"\"What did Reiko write?\"",aff:{rina:5}}]},
 {text:"Reiko wrote 'Reiko.' It is the least informative signature in Tokyo and everyone treasures it."}
]}

/* ==================================================== [JS-16] escalation

   Jordan: "when i did someone it just reverts to one explicit scene, none of
   the other positions, or building up, like oral should be first before going
   deeper".

   Two separate faults.

   1. NO PROGRESSION. Every act was available from the first night, so there
      was nothing to build toward. S.intim[who] counts nights together and the
      menu opens up across them: hands and mouth first, then her on her back,
      then letting her take over, then everything. A first night cannot reach
      the last of it no matter which choices you take.

   2. DEAD ENDS. The menu dropped you into one act, and ride/anal went straight
      to _end, so a later visit was one image and out. Every act now offers a
      way onward as well as a way to finish, so a night is a sequence you steer
      rather than a single pick.

   The pick menus below replace the flat ones. `req` hides an option until the
   intimacy level is there, which is also why the menu itself reads as
   progress -- there are visibly more things on it than there were. */
Object.assign(SCENES, {

/* ---------------- Mei ---------------- */
mei_room_pick:{ bg:"mei_room", art:"mei_nude", lines:[
 {who:"mei",expr:"soft",bg:"mei_room",when:s=>intim("mei")<2,text:"You're looking at me like you've got a question and you're not going to ask it."},
 {who:"mei",expr:"blush",bg:"mei_room",when:s=>intim("mei")>=2&&intim("mei")<4,text:"You can just say. I'm not going to be strange about it."},
 {who:"mei",expr:"soft",bg:"mei_room",when:s=>intim("mei")>=4,text:"Ask me for something. I've got quite used to you asking me for things."},
 {choices:[{prompt:"She's already got the blind down.",
   text:"Her mouth.",aff:{mei:5},goto:"mei_room_oral"},
  {text:"On her back.",aff:{mei:5},req:()=>intim("mei")>=2,goto:"mei_room_sex"},
  {text:"Let her ride.",aff:{mei:5},req:()=>intim("mei")>=3,goto:"mei_room_ride"},
  {text:"Turn her over.",aff:{mei:5},req:()=>intim("mei")>=4,goto:"mei_room_anal"},

 {choices:[{text:"Let her finish it.",aff:{mei:10},goto:"mei_room_end"},
  {text:"Turn her over.",aff:{mei:8},req:()=>intim("mei")>=4,goto:"mei_room_anal"},
  {text:"Get her on her back.",aff:{mei:8},req:()=>intim("mei")>=2,goto:"mei_room_sex"}]}

mei_room_anal:{ bg:"mei_room", art:"mei_anal", lines:[

/* ==================================================== build-up
   Jordan: "or not even explicit at first, just like catching someone getting
   dressed and stuff like that, making the shy and bringing it up later".

   These are non-explicit and they fire BEFORE anything happens — they live in
   the banter pool, so you hit them while you barely know her. Each one sets a
   flag, and the flag gets referenced later, which is the whole point: the
   thing you saw in week two comes back in week six. */
mei_banter7:{ bg:"locker", portRoom:"break", lines:[
 {text:"You come into the lockers to get your coat and Mei is halfway out of her work shirt with her back to the door."},
 {text:"You've got about a second to decide what to do about that."},
 {choices:[{text:"Back out. Say nothing.",aff:{mei:5},flag:"mei_backed_out"},
  {text:"\"Sorry — door.\"",aff:{mei:4},flag:"mei_said_door"},
  {text:"Don't move.",hint:"she'll notice",aff:{mei:3},flag:"mei_didnt_move"}]},
 {who:"mei",expr:"neutral",bg:"break",when:s=>s.flags.mei_backed_out,text:"You can come in. It's a locker room. I've got a vest on."},
 {who:"mei",expr:"annoyed",bg:"break",when:s=>s.flags.mei_said_door,text:"There is no door. There's a doorway. That's been the situation for four years."},
 {who:"mei",expr:"blush",bg:"break",when:s=>s.flags.mei_didnt_move,text:"...You're still there."},
 {text:"She gets her coat. She takes slightly longer over it than getting a coat requires."},
 {who:"mei",expr:"neutral",text:"Shutter."}
]},
haruka_banter7:{ bg:"locker", portRoom:"break", lines:[
 {text:"She's changing at the lockers with the door wide open, mid-sentence about something entirely unrelated."},
 {who:"haruka",expr:"smile",bg:"break",text:"—so anyway the delivery guy said it wasn't his van, which raises more questions than it—"},
 {who:"haruka",expr:"surprise",text:"Oh. Hi. Sorry, I forget the doorway situation."},
 {choices:[{text:"\"Carry on. The van.\"",aff:{haruka:6},flag:"har_van"},
  {text:"Look away.",aff:{haruka:4},flag:"har_looked_away"},
  {text:"\"You don't forget.\"",aff:{haruka:5},flag:"har_doesnt_forget"}]},
 {who:"haruka",expr:"smile",when:s=>s.flags.har_van,text:"RIGHT so it wasn't his van—"},
 {who:"haruka",expr:"blush",when:s=>s.flags.har_looked_away,text:"...You didn't have to do that. But — yeah. Okay. Thanks."},
 {who:"haruka",expr:"blush",when:s=>s.flags.har_doesnt_forget,text:"I absolutely forget! I have a documented history of forgetting!"},
 {text:"She talks about the van for another nine minutes. You do not learn whose van it was."}
]},
reiko_banter7:{ bg:"office", portRoom:"office", lines:[
 {text:"The curtain is pulled and you go through it without thinking, because you have been going through it every night for weeks."},
 {text:"She's got the shirt half unbuttoned and her hair down and she is very obviously between one version of herself and the other."},
 {who:"reiko",expr:"surprise",bg:"office",text:"—out. Out, please."},
 {choices:[{text:"Go.",aff:{reiko:6},flag:"rei_went"},
  {text:"\"Sorry.\"",aff:{reiko:4},flag:"rei_sorry"},
  {text:"\"You've got the curtain shut. That's the signal, is it?\"",aff:{reiko:5},flag:"rei_signal"}]},
 {text:"Ten minutes later she comes out with the tie on and the clip in and everything in its place."},
 {who:"reiko",expr:"neutral",when:s=>s.flags.rei_went,text:"Thank you. For going when I said."},
 {who:"reiko",expr:"annoyed",when:s=>s.flags.rei_sorry,text:"Don't apologise, I've never told anyone what the curtain means."},
 {who:"reiko",expr:"blush",when:s=>s.flags.rei_signal,text:"...It is the signal. Nobody has ever worked that out."},
 {who:"reiko",expr:"soft",text:"Cups. Front left."}
]},
rina_banter7:{ bg:"break", lines:[
 {text:"Break room. She's redoing her makeup with a compact and she's got about four minutes of it left."},
 {who:"rina",expr:"smile",bg:"break",text:"Don't watch. This is the ugly part. There's a whole ugly middle part nobody's supposed to see."},
 {choices:[{text:"Look away.",aff:{rina:5},flag:"rin_looked_away"},
  {text:"\"There's no ugly part.\"",aff:{rina:7},flag:"rin_no_ugly"},
  {text:"Keep watching.",aff:{rina:4},flag:"rin_watched"}]},
 {who:"rina",expr:"blush",when:s=>s.flags.rin_no_ugly,text:"...Okay you can't just SAY that, I've got a mirror in my hand."},
 {who:"rina",expr:"smile",when:s=>s.flags.rin_looked_away,text:"See, that's manners. Haruka once narrated it."},
 {who:"rina",expr:"blush",when:s=>s.flags.rin_watched,text:"You're still — okay. Fine. It's fine. I'm doing the eye now, don't put me off."},
 {text:"She snaps the compact shut. Whatever the ugly middle part was, you didn't see one."}
]},
ayano_banter7:{ bg:"locker", portRoom:"break", lines:[
 {text:"You hear her before you see her — the small panicked noise of someone who has just realised the doorway has no door."},
 {who:"ayano",expr:"surprise",bg:"break",text:"Occupied! Sorry! Occupied, sorry, I'm — sorry!"},
 {choices:[{text:"Back out immediately.",aff:{ayano:7},flag:"aya_backed_out"},
  {text:"\"You don't have to apologise for changing.\"",aff:{ayano:8},flag:"aya_no_sorry"},
  {text:"\"I'll wait outside.\"",aff:{ayano:6},flag:"aya_waited"}]},
 {text:"She comes out about two minutes later with her coat buttoned to the throat."},
 {who:"ayano",expr:"blush",when:s=>s.flags.aya_no_sorry,text:"I know. I know I don't. I've been apologising for existing in rooms since I was about eleven."},
 {who:"ayano",expr:"soft",when:s=>s.flags.aya_backed_out,text:"Thank you. For going straight away. Some people do a whole thing about it."},
 {who:"ayano",expr:"blush",when:s=>s.flags.aya_waited,text:"You waited outside. In the cold. For me to put a coat on."},
 {who:"ayano",expr:"soft",text:"...Anyway. Station?"}
]},
sana_banter7:{ bg:"locker", portRoom:"break", lines:[
 {text:"Seven in the morning. She's changing out of the uniform and she doesn't stop when you come in, and she doesn't hurry either."},
 {who:"sana",expr:"neutral",bg:"break",text:"It's fine. I've been doing nights for four years. Nobody's ever in this room at seven."},
 {choices:[{text:"Wait outside anyway.",aff:{sana:6},flag:"san_waited"},
  {text:"\"I'm in it.\"",aff:{sana:7},flag:"san_im_in_it"},
  {text:"Say nothing. Get your coat.",aff:{sana:8},flag:"san_coat"}]},
 {who:"sana",expr:"soft",when:s=>s.flags.san_im_in_it,text:"You are. That's the first time that sentence has been true."},
 {who:"sana",expr:"neutral",when:s=>s.flags.san_waited,text:"You didn't have to. But thank you for the shape of it."},
 {who:"sana",expr:"blush",when:s=>s.flags.san_coat,text:"...You just got your coat. Most people make it a whole event."},
 {text:"You walk out into the light together. She doesn't say anything else and she doesn't need to."}
]},

/* callbacks — these only exist if the locker scene happened, and they are the
   "bringing it up later" half of it */
mei_banter8:{ bg:"counter", when:s=>s.flags.mei_didnt_move||s.flags.mei_backed_out, lines:[
 {text:"Quiet hour. She's been building up to something for about ten minutes, which for her looks exactly like restocking cups."},
 {who:"mei",expr:"neutral",when:s=>s.flags.mei_didnt_move,text:"The lockers. Weeks ago. You didn't move."},
 {who:"mei",expr:"neutral",when:s=>s.flags.mei_backed_out&&!s.flags.mei_didnt_move,text:"The lockers. Weeks ago. You went straight back out."},
 {who:"mei",expr:"blush",text:"I've thought about it more than I'd like and I'd rather say that than keep thinking it."},
 {choices:[{text:"\"So had I.\"",aff:{mei:8}},
  {text:"\"You could have said something at the time.\"",aff:{mei:6}},
  {text:"\"What did you decide?\"",aff:{mei:9},flag:"mei_decided"}]},
 {who:"mei",expr:"soft",text:"I decided I'd stopped minding who was in the doorway. Which is not the same as nothing, and I'm aware of that."},
 {text:"She restocks the cups. The sleeve is already full."}
]},
ayano_banter8:{ bg:"break", when:s=>s.flags.aya_no_sorry, lines:[
 {who:"ayano",expr:"blush",bg:"break",text:"You said I don't have to apologise for changing. In the lockers. Weeks ago."},
 {who:"ayano",expr:"neutral",text:"I've thought about that more than the exams, which is a real problem, because the exams are in March."},
 {choices:[{text:"\"Sorry.\"",hint:"you hear it as you say it",aff:{ayano:5}},
  {text:"\"It's true, though.\"",aff:{ayano:8}},
  {text:"\"What did you decide?\"",aff:{ayano:9},flag:"aya_decided"}]},
 {who:"ayano",expr:"soft",text:"That there's a whole list of things I apologise for that nobody's ever asked me to. Existing in rooms was number one."},
 {who:"ayano",expr:"smile",text:"I've crossed it off. It's a real list, it's on the wall, I'm not going to show you the wall."}
]}

/* ==================================================== [JS-17] all thirty

   The <id>__<route> variants covered the three entangled pairs. That left
   picking Mei feeling identical to Ayano and to Sana, which is most of the
   grid. Writing thirty whole scenes for that would be absurd; what it actually
   needs is one honest LINE per (who, whoever-you-chose) pair.

   So each locked1 gets six conditional lines — one for each person you might
   have picked, plus a fallback — and the rest of the scene is shared. Same
   effect, a thirtieth of the writing, and every combination now has a line
   that could only be about those two specific people. */
Object.assign(SCENES, {

mei_locked1:{ bg:"counter", lines:[
 {text:"A week on. She's counting the drawer and doesn't stop when you come in, which is new, because she used to stop."},
 {who:"mei",expr:"neutral",text:"I'm fine. Before you ask, which you were about to."},
 {who:"mei",expr:"soft",when:s=>s.route==="haruka",text:"Haruka's been unbearable. Singing. Actual singing, in the kitchen, where I can hear it."},
 {who:"mei",expr:"neutral",when:s=>s.route==="haruka",text:"...Let her sing. Four years I've known her and I've never heard that."},
 {who:"mei",expr:"neutral",when:s=>s.route==="reiko",text:"Reiko changed the floor walk to four o'clock. Eleven years at two, and she moved it, and she thinks nobody noticed."},
 {who:"mei",expr:"soft",when:s=>s.route==="reiko",text:"I've watched that woman work herself hollow since I was twenty-two. Whatever you're doing, keep doing it."},
 {who:"mei",expr:"soft",when:s=>s.route==="rina",text:"Rina's stopped telling me things. Nine days. I've been keeping count and I don't know what to do with the quiet."},
 {who:"mei",expr:"neutral",when:s=>s.route==="rina",text:"She's happy though. She does this thing with her shoulders when she's happy. It's very obvious and nobody's ever told her."},
 {who:"mei",expr:"soft",when:s=>s.route==="ayano",text:"Ayano stopped apologising to a customer last Tuesday. Just — stopped, mid-word, and finished her sentence instead."},
 {who:"mei",expr:"neutral",when:s=>s.route==="ayano",text:"I've been trying to get her to do that for seven months. You did it in six weeks. I'm not sulking about it. I'm slightly sulking about it."},
 {who:"mei",expr:"soft",when:s=>s.route==="sana",text:"I've worked here four years and met Sana about nine times. She's a rumour with a rota line."},
 {who:"mei",expr:"neutral",when:s=>s.route==="sana",text:"She came in on a day shift last week. Just walked in, in daylight, and had a coffee. Reiko nearly dropped the clipboard."},
 {who:"mei",expr:"soft",when:s=>!s.route,text:"I had four years of locking up on my own. It's not a hard thing to go back to. It's just that I'd stopped."},
 {choices:[{text:"\"I'm sorry.\"",aff:{mei:3}},
  {text:"\"You're still the person I'd trust with the drawer.\"",aff:{mei:5}},
  {text:"Say nothing. Help her count.",aff:{mei:6},flag:"mei_counted"}]},
 {text:"You count it with her. She doesn't say thank you and she doesn't tell you to stop."},
 {who:"mei",expr:"neutral",text:"...It's four short. Do it again."}
]},

haruka_locked1:{ bg:"kitchen", portRoom:"counter", lines:[
 {text:"A fortnight. She's stopped doing the likeable voice, mostly. The kitchen's quieter but it isn't tense."},
 {who:"haruka",expr:"neutral",when:s=>s.route==="mei",text:"Mei laughed. Out loud, with sound, at something you said. I heard it from back here and I dropped a basket."},
 {who:"haruka",expr:"soft",when:s=>s.route==="mei",text:"Four years. I've been trying for four years. You got it in about six weeks and I'm going to be normal about that eventually."},
 {who:"haruka",expr:"surprise",when:s=>s.route==="reiko",text:"REIKO. You went for Reiko. I have so many questions and I'm not allowed to ask any of them."},
 {who:"haruka",expr:"soft",when:s=>s.route==="reiko",text:"...The extractor fan got fixed the week after. I'm not saying those are connected. I'm saying I noticed."},
 {who:"haruka",expr:"smile",when:s=>s.route==="rina",text:"Rina's gone quiet. RINA. She's been in a good mood for nine days and told nobody why, which for her is basically a coma."},
 {who:"haruka",expr:"soft",when:s=>s.route==="rina",text:"She deserves it. She talks like she's fine and she's been the loneliest person in this building for two years."},
 {who:"haruka",expr:"soft",when:s=>s.route==="ayano",text:"Ayano's different. Standing different. Have you seen it? She used to come in like she was hoping nobody'd notice she'd arrived."},
 {who:"haruka",expr:"smile",when:s=>s.route==="ayano",text:"Be careful with her, yeah? Not a warning. Just — she's nineteen and she's never had anyone be nice to her on purpose."},
 {who:"haruka",expr:"neutral",when:s=>s.route==="sana",text:"The night one. I've worked here two years and I've had maybe four conversations with her."},
 {who:"haruka",expr:"soft",when:s=>s.route==="sana",text:"She came in during the day last week. Nobody knew what to do. Rina offered her a chair like she was visiting royalty."},
 {who:"haruka",expr:"neutral",when:s=>!s.route,text:"I've been thinking about the leaving plan again. Not because of you, before you get a face on."},
 {choices:[{text:"\"Would you actually go?\"",aff:{haruka:4}},
  {text:"\"I'd miss you.\"",aff:{haruka:5}},
  {text:"\"You'd hate a place where nobody knew you.\"",aff:{haruka:6},flag:"har_stay"}]},
 {who:"haruka",expr:"smile",text:"Yeah. Yeah, I would. That's the problem with being likeable, you get attached to being liked."},
 {text:"She turns the fryer on with both hands, carefully, the way she does when she needs something ordinary to hold."}
]},

reiko_locked1:{ bg:"office", portRoom:"office", art:"rei_office", lines:[
 {text:"You bring the food anyway. You've done it every night for weeks and stopping felt like a statement."},
 {who:"reiko",expr:"surprise",bg:"office",text:"...You've still been doing that."},
 {who:"reiko",expr:"neutral",when:s=>s.route==="mei",text:"Mei has asked me for the rota. Asked. In eleven years she has never asked me for anything."},
 {who:"reiko",expr:"soft",when:s=>s.route==="mei",text:"I gave it to her. I should have given it to her three years ago and I have no defence for that."},
 {who:"reiko",expr:"annoyed",when:s=>s.route==="haruka",text:"Your kitchen colleague has logged the extractor fan six times and written the sixth one in larger handwriting."},
 {who:"reiko",expr:"soft",when:s=>s.route==="haruka",text:"I had it fixed. Don't tell her it was the handwriting. Tell her it was the sixth entry, she'd like that better."},
 {who:"reiko",expr:"neutral",when:s=>s.route==="rina",text:"Rina."},
 {who:"reiko",expr:"soft",when:s=>s.route==="rina",text:"I have kept that girl behind on a Friday for six years and called every one of them operational. You may draw your own conclusions; I've been avoiding mine."},
 {who:"reiko",expr:"neutral",when:s=>s.route==="ayano",text:"Ayano put in a request to reduce her hours. In pen, on the rota, without apologising in the margin."},
 {who:"reiko",expr:"soft",when:s=>s.route==="ayano",text:"She has worked here seven months and that is the first thing she has ever asked me for. I moved her off Saturdays as well. She hasn't noticed yet."},
 {who:"reiko",expr:"neutral",when:s=>s.route==="sana",text:"Sana came in during daylight last week. I have employed that woman for four years and I did not know she owned a coat."},
 {who:"reiko",expr:"soft",when:s=>s.route==="sana",text:"She sat down. In the break room. For eleven minutes. I put it in the book, which is not what the book is for."},
 {choices:[{text:"\"Habit.\"",aff:{reiko:4}},
  {text:"\"You still forget to eat.\"",aff:{reiko:6}},
  {text:"\"Do you want me to stop?\"",aff:{reiko:5}}]},
 {who:"reiko",expr:"soft",text:"No."},
 {text:"She says it immediately. Too fast for her, and she knows it, and she moves the payroll two inches left as though that fixes it."},
 {who:"reiko",expr:"neutral",text:"No. Don't stop. It isn't the same thing as the other thing. It can just be food."}
]},

rina_locked1:{ bg:"street", art:"rin_walk", lines:[
 {text:"The walk to the station. She's talking, but at about sixty percent of the usual output."},
 {who:"rina",expr:"smile",when:s=>s.route==="mei",text:"MEI. Okay. Okay! I have thoughts, I've had thoughts for about a week, I've been sitting on them like an egg."},
 {who:"rina",expr:"soft",when:s=>s.route==="mei",text:"She's been different. Softer round the edges. Four years I've been trying to get a full sentence out of her that wasn't about a drawer."},
 {who:"rina",expr:"smile",when:s=>s.route==="haruka",text:"Haruka told me herself. At volume. In the kitchen. She was so pleased with herself I thought she was going to combust."},
 {who:"rina",expr:"soft",when:s=>s.route==="haruka",text:"She's been talking about leaving for two years, you know. She hasn't mentioned it once since."},
 {who:"rina",expr:"neutral",when:s=>s.route==="reiko",text:"...Reiko. Yeah. I heard."},
 {who:"rina",expr:"soft",when:s=>s.route==="reiko",text:"She's happy. She's doing the thing where she pretends the rota's taking longer so she can stay later, and she's doing it badly, and I've never seen her do it badly before."},
 {who:"rina",expr:"smile",when:s=>s.route==="ayano",text:"Ayano CRIED when she told me. Happy crying! I had to give her the tissue I was pretending to need for my allergies!"},
 {who:"rina",expr:"soft",when:s=>s.route==="ayano",text:"She's my favourite person here and I'd have hurt anyone who was careless with her, so. Good. Good job. Keep going."},
 {who:"rina",expr:"neutral",when:s=>s.route==="sana",text:"The NIGHT one. I've been trying to get gossip out of that woman for three years and she has given me nothing. Nothing! Not one thing!"},
 {who:"rina",expr:"soft",when:s=>s.route==="sana",text:"And then she came in during the day and said hello to me by name. I nearly sat down."},
 {who:"rina",expr:"soft",when:s=>!s.route,text:"I've been doing the thing again. The knowing-everything thing. I did it to about four people this week."},
 {choices:[{text:"\"You're allowed.\"",aff:{rina:4}},
  {text:"\"You don't have to earn being here.\"",aff:{rina:7},flag:"rin_earn"},
  {text:"\"I noticed.\"",aff:{rina:5}}]},
 {who:"rina",expr:"blush",text:"Yeah. I know. It's just the tool I've got."},
 {text:"At the barrier she stops and turns round."},
 {who:"rina",expr:"soft",text:"Still walk me though. Twelve metres. Even now. Especially now, actually."}
