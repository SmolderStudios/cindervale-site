<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#03060b">
<meta name="description" content="Track your real MPG tank by tank. Scan the pump, see what every mile costs.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OCTANE">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>OCTANE &middot; Real MPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* =====================================================================
   OCTANE. One phone-first app frame: the top bar and the tab bar never
   scroll, #view is the only scroller. Body scroll fought the iOS URL bar
   in the Sweat Shop app, so this is the pattern that survived his phone.
   ===================================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:dark;
  --bg:#03060b;
  --surf:#0a1320;
  --edge:rgba(110,190,255,.14);
  --edge2:rgba(110,190,255,.28);
  --txt:#e9f5ff; --txt2:#a6bacd; --mute:#6c8298;
  --accent:#4be1ff;
  --s1:#22a0d0; --s2:#e0663a; --s3:#b061e6;
  --good:#34e8a0; --warn:#ffc043; --bad:#ff6273;
  --grid:#15253a; --axis:#22374e;
  --font:'Oxanium',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --glow:color-mix(in srgb,var(--accent) 50%,transparent);
  --tint:color-mix(in srgb,var(--accent) 13%,transparent);
  --line:color-mix(in srgb,var(--accent) 45%,transparent);
}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--txt);
  font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
a{color:var(--accent)}
svg.ic{width:20px;height:20px;flex:none;display:block}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--mute)} .dim{color:var(--txt2)}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.nowrap{white-space:nowrap}

/* ---------------------------------------------------------- backdrop --- */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(140% 60% at 50% -18%,#0d2a4b 0%,rgba(4,9,17,0) 62%),
             radial-gradient(70% 38% at 108% 6%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%),
             radial-gradient(60% 30% at -10% 40%,rgba(255,79,216,.07),transparent 70%),
             linear-gradient(180deg,#050b14,#03060b 55%,#020409)}
.bgfx .floor{position:absolute;left:-60%;right:-60%;bottom:-6%;height:52%;
  background-image:linear-gradient(color-mix(in srgb,var(--accent) 22%,transparent) 1px,transparent 1px),
                   linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,transparent) 1px,transparent 1px);
  background-size:56px 56px;transform:perspective(380px) rotateX(64deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.55),transparent 80%);mask-image:linear-gradient(to top,rgba(0,0,0,.55),transparent 80%);
  animation:floor 7s linear infinite;opacity:.55}
@keyframes floor{to{background-position:0 56px,0 0}}
.bgfx .scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.016) 0 1px,transparent 1px 3px)}

/* -------------------------------------------------------------- frame --- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}
.top{flex:none;display:flex;align-items:center;gap:8px;width:100%;max-width:600px;margin:0 auto;padding:calc(var(--st) + 10px) 14px 8px}
.brand{display:flex;align-items:center;gap:7px;font-weight:800;letter-spacing:.2em;font-size:13px;margin-right:4px}
.brand svg{width:24px;height:24px}
.vsel{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 12px;border:1px solid var(--edge2);border-radius:19px;
  background:rgba(8,17,30,.7);font-weight:700;font-size:14px;min-width:0;max-width:46vw}
.vsel .vn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vsel svg{width:16px;height:16px;color:var(--mute)}
.vdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.grow{flex:1}
.ibtn{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;border:1px solid var(--edge);background:rgba(8,17,30,.7);color:var(--txt2)}
.ibtn.on{color:var(--accent);border-color:var(--line)}
.sdot{position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:transparent}
.sdot.ok{background:var(--good);box-shadow:0 0 6px var(--good)}
.sdot.busy{background:var(--accent);animation:blink .9s infinite}
.sdot.err{background:var(--warn)}
@keyframes blink{50%{opacity:.25}}

#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:4px 14px calc(var(--sb) + 110px)}
.wrap{max-width:560px;margin:0 auto;animation:viewin .32s ease both}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ------------------------------------------------------------ tab bar --- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(var(--sb) + 10px);pointer-events:none}
.tabs .bar{pointer-events:auto;max-width:520px;margin:0 auto;height:66px;display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;align-items:stretch;
  background:rgba(5,11,20,.84);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--edge2);border-radius:22px;
  box-shadow:0 12px 40px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.05)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mute);font-size:11px;font-weight:700;letter-spacing:.06em}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.tab.on svg{filter:drop-shadow(0 0 6px var(--accent))}
.fab{position:relative;align-self:center;justify-self:center;width:64px;height:64px;margin-top:-30px;border-radius:50%;display:grid;place-items:center;color:#02121b;
  background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--accent) 35%,#fff),var(--accent) 58%,color-mix(in srgb,var(--accent) 60%,#000));
  box-shadow:0 0 0 5px #03070d,0 0 28px var(--glow),inset 0 -5px 12px rgba(0,0,0,.3)}
.fab svg{width:30px;height:30px;stroke-width:2.6}
.fab::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ping 2.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.9);opacity:.7}70%,100%{transform:scale(1.35);opacity:0}}

/* -------------------------------------------------------------- panels --- */
.pnl{position:relative;margin:0 0 12px;padding:14px;border:1px solid var(--edge);border-radius:6px;
  background:linear-gradient(180deg,rgba(14,28,46,.84),rgba(7,14,25,.9));box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 10px 30px rgba(0,0,0,.35)}
.pnl::before{content:'';position:absolute;inset:-1px;border-radius:6px;pointer-events:none;opacity:.8;
  background:linear-gradient(var(--accent),var(--accent)) 0 0/14px 2px no-repeat,linear-gradient(var(--accent),var(--accent)) 0 0/2px 14px no-repeat,
             linear-gradient(var(--accent),var(--accent)) 100% 100%/14px 2px no-repeat,linear-gradient(var(--accent),var(--accent)) 100% 100%/2px 14px no-repeat}
.ph{display:flex;align-items:center;gap:8px;margin:0 0 12px;min-height:20px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--txt2);display:flex;align-items:center}
.lbl::before{content:'';width:6px;height:6px;margin-right:9px;background:var(--accent);box-shadow:0 0 8px var(--accent);transform:rotate(45deg)}
.ph .tag{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mute)}
.ph .lnk{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;display:flex;align-items:center;gap:2px}
.ph .lnk svg{width:15px;height:15px}
.note{font-family:var(--body);font-size:13px;color:var(--txt2);line-height:1.5}
.note b{color:var(--txt)}
.sep{height:1px;background:var(--edge);margin:12px 0}
h1.pg{font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin:10px 2px 14px;color:var(--txt2);display:flex;align-items:center;gap:10px}
h1.pg .act{margin-left:auto}

/* ---------------------------------------------------------------- hero --- */
.hero{padding-bottom:10px}
.dial{position:relative;width:100%;max-width:300px;margin:-4px auto 0}
.dial svg{display:block;width:100%;height:auto;overflow:visible}
.dial .ctr{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none}
.bignum{font-size:66px;font-weight:700;line-height:.95;letter-spacing:-.01em;text-shadow:0 0 26px var(--glow)}
.bigunit{font-size:12px;font-weight:700;letter-spacing:.3em;color:var(--accent);margin-top:6px}
.bigsub{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:4px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.hs{text-align:center;padding:8px 4px;border-radius:8px;background:rgba(2,6,12,.45);border:1px solid var(--edge)}
.hs small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.hs b{display:block;font-size:19px;margin-top:3px}
.hs i{font-style:normal;font-family:var(--mono);font-size:11px}

/* ---------------------------------------------------------------- fuel --- */
.fuelhd{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.fuelhd b{font-size:30px;font-weight:700}
.fuelhd span{color:var(--txt2);font-size:13px}
.fuelhd .pct{margin-left:auto;font-family:var(--mono);font-size:13px}
.meter{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;height:24px}
.meter i{border-radius:2px;background:rgba(120,170,220,.08);border:1px solid rgba(120,170,220,.08)}
.meter i.on{background:var(--mc);border-color:transparent;box-shadow:0 0 8px color-mix(in srgb,var(--mc) 60%,transparent);animation:segon .5s both}
@keyframes segon{from{opacity:0}}
.meterlab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:5px}
.fuelrow{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:13px;color:var(--txt2)}
.fuelrow svg{width:18px;height:18px;color:var(--accent)}
.fuelrow b{color:var(--txt)}
.lowtag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.1em}
.lowtag svg{width:13px;height:13px}

/* ---------------------------------------------------------------- kpis --- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.kpi{position:relative;overflow:hidden;min-height:96px;padding:12px;border:1px solid var(--edge);border-radius:6px;background:linear-gradient(180deg,rgba(12,24,40,.84),rgba(6,13,23,.9))}
.kpi .kl{font-size:12px;font-weight:600;color:var(--txt2)}
.kpi .kr{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:5px}
.kpi .kv{font-size:26px;font-weight:700;line-height:1.05;white-space:nowrap}
.kpi .kv small{font-size:13px;color:var(--txt2);font-weight:600;margin-left:2px}
.kpi .kd{font-family:var(--mono);font-size:11px;margin-top:6px;color:var(--mute)}
.kpi svg.spark{flex:none;margin-bottom:3px}
.hs small .key{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.codebox{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:.06em;text-align:center;padding:14px 10px;margin:12px 0;border-radius:10px;
  border:1px solid var(--line);background:rgba(2,6,12,.6);color:var(--accent);-webkit-user-select:all;user-select:all;word-break:break-all;text-shadow:0 0 12px var(--glow)}
.vrow{display:flex;align-items:center;gap:12px}
.vrow .vdot{width:12px;height:12px}
.vt{flex:1;min-width:0}
.vt b{display:block;font-size:17px}
.vt small{display:block;color:var(--mute);font-size:12px;font-family:var(--body);margin-top:2px}
.lnkb{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.inp.hasbtn input{padding-right:54px}
.locbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;display:grid;place-items:center;border-radius:9px;color:var(--accent)}
.locbtn svg{width:22px;height:22px}
.dlt{display:inline-flex;align-items:center;gap:3px}
.dlt svg{width:11px;height:11px}

/* ----------------------------------------------------------- last fill --- */
.lf{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.lf .t{font-weight:700;font-size:16px}
.lf .s{font-family:var(--mono);font-size:12px;color:var(--txt2)}
.lf .m{grid-row:1/3;grid-column:2;text-align:right}
.lf .m b{font-size:28px;display:block;line-height:1}
.lf .m small{font-size:10px;letter-spacing:.16em;color:var(--mute);font-weight:700}

/* ------------------------------------------------------------- buttons --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;
  border:1px solid var(--line);background:var(--tint);color:var(--accent);font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:13px}
.btn svg{width:19px;height:19px}
.btn.pri{background:var(--accent);color:#02121b;border-color:transparent;box-shadow:0 0 24px var(--glow)}
.btn.ghost{background:rgba(2,6,12,.35);border-color:var(--edge2);color:var(--txt2)}
.btn.danger{color:var(--bad);border-color:rgba(255,98,115,.45);background:rgba(255,98,115,.08)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:12px;border-radius:10px}
.btn:active,.chip:active,.scanbtn:active,.frow:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.brow{display:flex;gap:10px;flex-wrap:wrap}
.brow>.btn{flex:1}

/* --------------------------------------------------------------- forms --- */
.fgrid{display:grid;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fld{display:block;min-width:0}
.fld>span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--txt2);margin:0 0 6px 2px;letter-spacing:.02em}
.fld>span em{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.12em;padding:1px 5px;border-radius:4px;color:var(--accent);border:1px solid var(--line)}
.inp{position:relative}
.inp input,.inp select,.inp textarea{width:100%;height:54px;padding:0 14px;border-radius:10px;border:1px solid var(--edge2);background:rgba(2,6,12,.6);
  font-size:19px;font-weight:600;color:var(--txt);outline:none;-webkit-appearance:none;appearance:none;min-width:0}
.inp textarea{height:auto;min-height:74px;padding:12px 14px;font-size:16px;font-weight:500;font-family:var(--body);resize:vertical}
.inp input[type=datetime-local]{font-size:16px}
.inp input:focus,.inp textarea:focus,.inp select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.inp .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--mute);font-family:var(--mono);pointer-events:none}
.inp .pre{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:17px;color:var(--mute);pointer-events:none;font-weight:600}
.inp.hasp input{padding-left:26px}
.g3 .inp input{padding:0 10px;font-size:18px}
.g3 .inp.hasp input{padding-left:22px}
.g3 .inp .pre{left:9px}
.fld.auto input{color:var(--txt2);background:rgba(2,6,12,.3)}
.fld.scanned input{border-color:var(--accent);animation:scanflash 1.4s ease both}
@keyframes scanflash{0%{background:color-mix(in srgb,var(--accent) 40%,transparent);box-shadow:0 0 22px var(--glow)}100%{background:rgba(2,6,12,.6)}}
.hint{font-family:var(--mono);font-size:11px;color:var(--mute);margin:6px 2px 0;min-height:14px}
.hint b{color:var(--txt2);font-weight:600}
.err{color:var(--bad)} .hint.err b{color:var(--bad)}
.seg{display:flex;padding:3px;border-radius:12px;background:rgba(2,6,12,.55);border:1px solid var(--edge)}
.seg button{flex:1;height:38px;border-radius:9px;font-weight:700;font-size:13px;color:var(--txt2);letter-spacing:.04em}
.seg button.on{background:var(--tint);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:42px;min-width:54px;padding:0 14px;border-radius:10px;border:1px solid var(--edge2);background:rgba(2,6,12,.45);font-weight:700;color:var(--txt2);font-size:14px}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--tint);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 22%,transparent)}
.tog{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--edge);background:rgba(2,6,12,.4);text-align:left}
.tog .tt{flex:1;min-width:0}
.tog b{display:block;font-size:15px}
.tog small{display:block;color:var(--mute);font-family:var(--body);font-size:12px;margin-top:2px;line-height:1.35}
.sw{position:relative;width:50px;height:30px;flex:none;border-radius:15px;background:#18283b;transition:background .15s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#7f95ab;transition:left .15s,background .15s}
.tog.on .sw{background:color-mix(in srgb,var(--accent) 65%,#000)}
.tog.on .sw::after{left:23px;background:#fff;box-shadow:0 0 10px var(--accent)}
details.more{border:1px solid var(--edge);border-radius:10px;background:rgba(2,6,12,.3)}
details.more>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:13px 14px;font-weight:700;font-size:14px;color:var(--txt2);cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary svg{width:16px;height:16px;margin-left:auto;transition:transform .2s}
details.more[open]>summary svg{transform:rotate(180deg)}
details.more>.in{padding:0 14px 14px;display:grid;gap:12px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:40px;height:40px;border-radius:12px;border:2px solid transparent;box-shadow:inset 0 0 0 3px #050b14}
.swatch.on{border-color:#fff}

/* --------------------------------------------------------------- sheet --- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:rgba(1,4,9,.66);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fade .2s ease both}
.sheet .sh{margin:auto auto 0;width:100%;max-width:600px;height:calc(100% - var(--st) - 12px);display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0b1627,#050b14 40%);border:1px solid var(--edge2);border-bottom:0;border-radius:20px 20px 0 0;
  box-shadow:0 -20px 60px rgba(0,0,0,.6);animation:up .34s cubic-bezier(.2,.8,.2,1) both}
.sheet.small .sh{height:auto;max-height:calc(100% - var(--st) - 12px)}
.sh-h{flex:none;display:flex;align-items:center;gap:10px;padding:14px 14px 12px;border-bottom:1px solid var(--edge)}
.sh-h h2{margin:0;font-size:15px;letter-spacing:.14em;text-transform:uppercase;flex:1}
.sh-b{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 14px 24px}
.sh-f{flex:none;padding:10px 14px calc(var(--sb) + 12px);border-top:1px solid var(--edge);background:rgba(3,7,13,.94)}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}

/* live preview above the save button */
.pv{display:flex;align-items:center;gap:12px;min-height:46px;margin-bottom:10px;padding:8px 12px;border-radius:10px;border:1px solid var(--edge);background:rgba(2,6,12,.5)}
.pv .pl{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.pv .pm{font-size:26px;font-weight:700;line-height:1}
.pv .pm small{font-size:11px;letter-spacing:.2em;color:var(--accent);margin-left:4px}
.pv .ps{margin-left:auto;text-align:right;font-family:var(--mono);font-size:11px;color:var(--txt2);line-height:1.5}
.pv .pt{font-family:var(--body);font-size:13px;color:var(--txt2);line-height:1.35}
.pv .pt svg{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-right:6px}
.pv.pv-err{border-color:rgba(255,98,115,.55);background:rgba(255,98,115,.07)} .pv.pv-err .pt{color:#ffc4cb}
.pv.pv-warn{border-color:rgba(255,192,67,.55);background:rgba(255,192,67,.07)} .pv.pv-warn .pt{color:#ffe4ad}

/* ---------------------------------------------------------------- scan --- */
.scanrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scanbtn{position:relative;overflow:hidden;height:92px;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 20%,transparent),rgba(2,6,12,.55));color:var(--accent);font-weight:800;letter-spacing:.08em;font-size:13px}
.scanbtn svg{width:30px;height:30px}
.scanbtn small{color:var(--txt2);font-weight:500;letter-spacing:0;font-size:11px;font-family:var(--body)}
.scanbtn::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transform:skewX(-20deg);animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
.pickln{display:block;margin:8px auto 0;font-size:12px;font-weight:600;color:var(--txt2);text-decoration:underline;text-underline-offset:3px}
.scanbox{position:relative;height:200px;border-radius:14px;overflow:hidden;border:1px solid var(--accent);background:#000;box-shadow:0 0 30px var(--tint)}
.scanbox img{width:100%;height:100%;object-fit:cover;opacity:.85;filter:saturate(.7) contrast(1.1)}
.scanbox .grd{position:absolute;inset:0;opacity:.3;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:26px 26px}
.scanbox .laser{position:absolute;left:0;right:0;top:8%;height:3px;background:linear-gradient(90deg,transparent,var(--accent),#fff,var(--accent),transparent);box-shadow:0 0 18px 5px var(--glow);animation:laser 1.5s ease-in-out infinite alternate}
@keyframes laser{from{top:8%}to{top:90%}}
.scanbox .brk{position:absolute;inset:12px;pointer-events:none;
  background:linear-gradient(var(--accent),var(--accent)) 0 0/22px 3px no-repeat,linear-gradient(var(--accent),var(--accent)) 0 0/3px 22px no-repeat,
             linear-gradient(var(--accent),var(--accent)) 100% 0/22px 3px no-repeat,linear-gradient(var(--accent),var(--accent)) 100% 0/3px 22px no-repeat,
             linear-gradient(var(--accent),var(--accent)) 0 100%/22px 3px no-repeat,linear-gradient(var(--accent),var(--accent)) 0 100%/3px 22px no-repeat,
             linear-gradient(var(--accent),var(--accent)) 100% 100%/22px 3px no-repeat,linear-gradient(var(--accent),var(--accent)) 100% 100%/3px 22px no-repeat}
.scanbox .st{position:absolute;left:14px;right:14px;bottom:12px;font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;text-shadow:0 0 10px var(--accent),0 1px 2px #000}
.scanbox.done .laser,.scanbox.done .grd{display:none}
.scanbox.done{height:120px}
.scanres{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13px;font-family:var(--body);line-height:1.4}
.scanres svg{width:18px;height:18px;flex:none;margin-top:1px}
.scanres.ok{background:rgba(52,232,160,.08);border:1px solid rgba(52,232,160,.35);color:#bff5de}
.scanres.chk{background:rgba(255,192,67,.08);border:1px solid rgba(255,192,67,.4);color:#ffe4ad}
.scanres.no{background:rgba(255,98,115,.08);border:1px solid rgba(255,98,115,.4);color:#ffc4cb}

/* ----------------------------------------------------------------- log --- */
.mhead{display:flex;align-items:baseline;gap:10px;margin:18px 2px 8px;font-family:var(--mono);font-size:11px;color:var(--mute)}
.mhead b{font-family:var(--font);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--txt2);margin-right:auto}
.frow{display:grid;grid-template-columns:1fr auto;gap:3px 12px;align-items:center;width:100%;padding:13px 14px;margin:0 0 8px;text-align:left;
  border:1px solid var(--edge);border-radius:8px;background:linear-gradient(180deg,rgba(12,24,40,.8),rgba(6,13,23,.86))}
.frow .ft{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.frow .ft span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fs{font-family:var(--mono);font-size:12px;color:var(--txt2)}
.frow .fm{grid-row:1/3;grid-column:2;text-align:right}
.frow .fm b{display:block;font-size:24px;line-height:1}
.frow .fm small{display:block;font-size:10px;letter-spacing:.14em;color:var(--mute);font-weight:700;margin-top:2px}
.frow.open{border-color:var(--line);box-shadow:0 0 18px var(--tint)}
.fdet{grid-column:1/3;margin-top:10px;padding-top:10px;border-top:1px solid var(--edge);display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:12px}
.fdet div small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}
.fdet div b{font-size:14px}
.fdet .full{grid-column:1/3}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.12em;border:1px solid var(--edge2);color:var(--txt2);white-space:nowrap}
.badge.acc{color:var(--accent);border-color:var(--line)}
.badge.warn{color:var(--warn);border-color:rgba(255,192,67,.45)}
.badge.bad{color:var(--bad);border-color:rgba(255,98,115,.45)}
.badge.good{color:var(--good);border-color:rgba(52,232,160,.45)}

/* -------------------------------------------------------------- charts --- */
.chart{display:block;width:100%;height:auto;touch-action:pan-y;-webkit-user-select:none;user-select:none;outline:none}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--mute)}
.chart .gl{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.chart .base{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.glow{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--s1) 70%,transparent))}
.chart .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .dot{stroke:var(--surf);stroke-width:2}
.chart .xh{stroke:rgba(210,235,255,.4);stroke-width:1}
.chart .ref{stroke:rgba(210,235,255,.3);stroke-width:1;shape-rendering:crispEdges}
.chart .lab{fill:var(--txt2);font-size:10.5px}
.chart .labv{fill:var(--txt);font-size:11px;font-weight:600}
.chart .bar{transition:filter .12s}
.chart .bar.hl{filter:brightness(1.4) drop-shadow(0 0 6px var(--s1))}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes rise{from{transform:scaleY(0)}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--txt2);margin:-4px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:16px;height:2px;border-radius:1px}
.legend i.dk{width:8px;height:8px;border-radius:50%}
.nodata{padding:26px 10px;text-align:center;color:var(--mute);font-family:var(--body);font-size:13px}
.hb{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:10px;margin:8px 0}
.hb .hl{font-size:13px;font-weight:600;color:var(--txt2)}
.hb .ht{height:20px;position:relative}
.hb .ht i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1);animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:0 50%}
@keyframes grow{from{transform:scaleX(0)}}
.hb b{font-size:15px;min-width:52px;text-align:right}
.hb b small{display:block;font-family:var(--mono);font-size:10px;color:var(--mute);font-weight:400}
details.tbl{margin-top:10px}
details.tbl>summary{list-style:none;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.06em;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
details.tbl>summary::-webkit-details-marker{display:none}
details.tbl>summary svg{width:14px;height:14px}
.tw{overflow-x:auto;margin-top:8px;border:1px solid var(--edge);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:rgba(2,6,12,.5);font-weight:700}
td{font-family:var(--mono);color:var(--txt2);border-top:1px solid var(--edge)}
th:first-child,td:first-child{text-align:left}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec{padding:11px 12px;border-radius:8px;border:1px solid var(--edge);background:rgba(2,6,12,.4)}
.rec small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}
.rec b{display:block;font-size:20px;margin-top:3px}
.rec span{display:block;font-family:var(--mono);font-size:11px;color:var(--txt2);margin-top:2px}

/* ---------------------------------------------------------------- trip --- */
.trip-out{text-align:center;padding:6px 0 4px}
.trip-out .bignum{font-size:60px}
.route{position:relative;height:70px;margin:18px 6px 6px}
.route .rl{position:absolute;left:0;right:0;top:30px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--s3));box-shadow:0 0 12px var(--glow)}
.route .ep{position:absolute;top:22px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.route .ep.end{border-color:var(--s3)}
.route .st{position:absolute;top:18px;margin-left:-13px;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#1a1204;border:1px solid var(--warn);color:var(--warn);box-shadow:0 0 12px rgba(255,192,67,.4);animation:pop .4s both}
.route .st svg{width:16px;height:16px}
.route .rt{position:absolute;top:50px;font-family:var(--mono);font-size:10px;color:var(--mute);transform:translateX(-50%);white-space:nowrap}
@keyframes pop{from{transform:scale(0)}}
.sugg{margin-top:6px;border:1px solid var(--edge2);border-radius:10px;overflow:hidden;background:#07101c}
.sugg button{display:block;width:100%;text-align:left;padding:11px 12px;border-top:1px solid var(--edge);font-size:14px}
.sugg button:first-child{border-top:0}
.sugg button small{display:block;color:var(--mute);font-family:var(--body);font-size:12px;margin-top:1px}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--edge2);border-radius:10px;overflow:hidden;height:54px}
.stepper button{width:54px;height:100%;font-size:22px;font-weight:700;color:var(--accent);background:rgba(2,6,12,.5)}
.stepper b{flex:1;text-align:center;font-size:20px}

/* ------------------------------------------------------------- welcome --- */
.welcome{text-align:center;padding:26px 4px 6px}
.welcome .logo{width:112px;height:112px;margin:0 auto 14px;filter:drop-shadow(0 0 22px var(--glow));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.welcome h2{margin:0;font-size:34px;letter-spacing:.3em;font-weight:800;padding-left:.3em}
.welcome p.tag{margin:6px 0 22px;color:var(--txt2);font-size:15px}
.steps{display:grid;gap:10px;text-align:left;margin-top:6px}
.stp{display:flex;gap:12px;align-items:flex-start}
.stp i{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;color:var(--accent);border:1px solid var(--line);background:var(--tint)}
.stp span{font-family:var(--body);font-size:13px;color:var(--txt2);line-height:1.45;padding-top:3px}

/* ----------------------------------------------------- result overlay --- */
.res{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(var(--st) + 20px) 24px calc(var(--sb) + 24px);background:radial-gradient(circle at 50% 38%,#0a243c,#02050a 70%);animation:fade .25s both}
.res .ring{position:relative;width:236px;height:236px}
.res .ring svg{width:100%;height:100%;overflow:visible}
.res .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.res .rv{font-size:70px;font-weight:800;line-height:.9;text-shadow:0 0 30px var(--glow)}
.res .ru{font-size:12px;letter-spacing:.34em;color:var(--accent);font-weight:800;margin-top:8px;padding-left:.34em}
.res h3{margin:22px 0 6px;font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--txt2)}
.res .rl{font-family:var(--mono);font-size:13px;color:var(--txt2);line-height:1.7}
.res .rb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 4px}
.res .rb span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--tint);color:var(--accent);animation:pop .45s both}
.res .rb span svg{width:16px;height:16px}
.res .rb span.gold{color:#ffd76a;border-color:rgba(255,215,106,.5);background:rgba(255,215,106,.1)}
.res .btn{margin-top:26px;min-width:220px}
.res .burst{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);opacity:0;animation:burst 1.1s ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)))}}
.res .icoBig{width:90px;height:90px;color:var(--accent);filter:drop-shadow(0 0 16px var(--glow))}

/* --------------------------------------------------------- toast + tip --- */
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 96px);z-index:90;transform:translateX(-50%);display:flex;align-items:center;gap:12px;
  width:max-content;max-width:calc(100vw - 28px);padding:12px 16px;border-radius:12px;background:#0c1a2c;border:1px solid var(--edge2);box-shadow:0 12px 34px rgba(0,0,0,.6);
  font-weight:600;font-size:14px;animation:toastin .25s both}
#toast button{color:var(--accent);font-weight:800;letter-spacing:.08em;font-size:13px;text-transform:uppercase}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}}
#tip{position:fixed;left:0;top:0;z-index:95;pointer-events:none;min-width:128px;max-width:230px;padding:9px 11px;border-radius:8px;
  background:rgba(4,10,18,.97);border:1px solid var(--edge2);box-shadow:0 10px 26px rgba(0,0,0,.65);font-size:12px}
#tip .th{font-family:var(--mono);font-size:11px;color:var(--mute);margin-bottom:4px}
#tip .tr{display:flex;align-items:center;gap:8px;margin-top:3px}
#tip .tr i{flex:none;width:12px;height:2px;border-radius:1px}
#tip .tr b{font-size:15px}
#tip .tr span{color:var(--txt2)}

@media (min-width:700px){ #view{padding-left:24px;padding-right:24px} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}
  .bgfx .floor{animation:none}
}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"><div class="floor"></div><div class="scan"></div></div>
<div id="app">
  <header class="top" id="top"></header>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabs" id="tabs"></nav>
<div id="tip" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="picIn" accept="image/*" hidden>
<input type="file" id="impIn" accept=".json,application/json" hidden>
<datalist id="stations"></datalist>
<script src="js/core.js?v=1"></script>
<script src="js/charts.js?v=1"></script>
<script src="js/sample.js?v=1"></script>
<script src="js/views.js?v=1"></script>
<script src="js/stats.js?v=1"></script>
<script src="js/form.js?v=1"></script>
<script src="js/ui.js?v=1"></script>
</body>
</html>
