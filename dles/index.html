<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DLES — 1v1 Daily Games</title>
<meta name="description" content="A dozen classic daily puzzle games, rebuilt for head-to-head duels. Same puzzle, both players, one score.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23140d0a'/><rect x='10' y='10' width='18' height='18' rx='4' fill='%23c8892f'/><rect x='36' y='10' width='18' height='18' rx='4' fill='%233b4a52'/><rect x='10' y='36' width='18' height='18' rx='4' fill='%233b4a52'/><rect x='36' y='36' width='18' height='18' rx='4' fill='%236f9c62'/></svg>">
<style>
/* ═══ [CSS-01] TOKENS ═══════════════════════════════════════════════ */
:root{
  --bg:#0c0908; --bg2:#140f0d; --panel:#191311; --panel2:#211917;
  --line:#33251f; --line2:#452f26;
  --ink:#f1e6dc; --ink2:#b9a698; --ink3:#7d6d63;
  --ember:#e0873a; --ember2:#f0ab5c; --emberDim:#7a4a1c;
  --good:#5fa663; --goodDim:#2c4a2e;
  --warn:#c9a227; --warnDim:#4a3c10;
  --bad:#b4483f; --badDim:#4a1f1b;
  --cool:#5b8ea6; --coolDim:#25404c;
  --purple:#8a6bb0;
  --r:10px; --rl:16px;
  --sh:0 2px 0 rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.9);
  --fs:16px;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
/* the top bar is sticky, so anything scrolled into view must clear it */
html{scrollbar-gutter:stable;scroll-padding-top:70px}
body{
  margin:0; background:
    radial-gradient(1200px 700px at 50% -10%, #1d1310 0%, transparent 60%),
    radial-gradient(900px 600px at 90% 100%, #16100e 0%, transparent 55%),
    var(--bg);
  color:var(--ink); font:var(--fs)/1.5 var(--sans);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--ember2)}
::selection{background:var(--emberDim);color:#fff}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ═══ [CSS-02] CHROME ═══════════════════════════════════════════════ */
#app{min-height:100%;display:flex;flex-direction:column}
#top{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:rgba(12,9,8,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
#brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:15px}
#brand .bmark{width:26px;height:26px;flex:0 0 26px}
#brand span{background:linear-gradient(180deg,#fff,var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent}
#topMid{flex:1;display:flex;justify-content:center;min-width:0}
#topRight{display:flex;align-items:center;gap:10px}

.roomchip{
  display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line2);font-size:13px;color:var(--ink2)
}
.roomchip b{font:600 15px/1 var(--mono);letter-spacing:.22em;color:var(--ember2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:0 0 8px}
.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.dot.off{background:var(--bad)}
.dot.wait{background:var(--warn);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.25}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:var(--r);font-weight:600;font-size:15px;
  background:linear-gradient(180deg,var(--panel2),#160f0d);
  border:1px solid var(--line2);color:var(--ink);box-shadow:var(--sh);
  transition:transform .07s, border-color .15s, background .15s;
}
.btn:hover{border-color:var(--ember);background:linear-gradient(180deg,#2a1f1a,#1a1210)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;border-color:var(--line)}
.btn.pri{background:linear-gradient(180deg,var(--ember),#a75f22);border-color:#f0b06a;color:#1a0f06;text-shadow:0 1px 0 rgba(255,255,255,.25)}
.btn.pri:hover{background:linear-gradient(180deg,var(--ember2),#b96c26)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.gho{background:transparent;border-color:var(--line2);color:var(--ink2)}
.btn.gho:hover{color:var(--ink);border-color:var(--ember)}
.btn.dan:hover{border-color:var(--bad)}

.card{background:linear-gradient(180deg,var(--panel),#150f0d);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--sh)}
.pad{padding:20px}
.muted{color:var(--ink2)}
.dim{color:var(--ink3)}
.tiny{font-size:12px}
.mono{font-family:var(--mono)}

/* ═══ [CSS-03] VIEWS ════════════════════════════════════════════════ */
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* login */
#vLogin .hero{text-align:center;padding:52px 20px 34px}
#vLogin h1{font-size:clamp(38px,8vw,72px);letter-spacing:.16em;
  background:linear-gradient(180deg,#fff 10%,var(--ember) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
#vLogin .tag{color:var(--ink2);font-size:17px;margin-top:10px}
.loginbox{max-width:430px;margin:0 auto}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;font-weight:600}
.field input{
  width:100%;padding:12px 14px;border-radius:var(--r);background:#0d0908;
  border:1px solid var(--line2);outline:none;font-size:16px;transition:border-color .15s
}
.field input:focus{border-color:var(--ember)}
.field input.code{font:700 22px/1 var(--mono);letter-spacing:.4em;text-transform:uppercase;text-align:center}
.orline{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:12px;margin:18px 0;letter-spacing:.14em}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}

/* lobby */
.lgrid{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
@media(max-width:900px){.lgrid{grid-template-columns:1fr}}
.seats{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:16px}
.seat{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--rl);background:var(--panel2);border:1px solid var(--line)}
.seat.me{border-color:var(--emberDim)}
.seat.empty{border-style:dashed;color:var(--ink3)}
.av{width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:19px;
  background:linear-gradient(160deg,#2b201b,#150f0d);border:1px solid var(--line2)}
.seat .nm{font-weight:700;font-size:16px;display:flex;align-items:center;gap:7px}
.seat .el{font:600 12px/1 var(--mono);color:var(--ember2);letter-spacing:.06em}
.vs{font:800 14px/1 var(--mono);color:var(--ink3);letter-spacing:.1em}

.gsel{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.gtile{
  position:relative;text-align:left;padding:12px;border-radius:12px;
  background:linear-gradient(180deg,var(--panel2),#160f0d);border:1px solid var(--line);
  transition:border-color .14s, transform .07s; overflow:hidden;
}
.gtile:hover{border-color:var(--line2);transform:translateY(-1px)}
.gtile.sel{border-color:var(--ember);background:linear-gradient(180deg,#2a1d14,#1a120e)}
.gtile.sel::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--emberDim);border-radius:12px;pointer-events:none}
.gtile .gh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.gtile .gi{width:24px;height:24px;flex:0 0 24px}
.gtile .gn{font-weight:700;font-size:14px}
.gtile .gb{font-size:11.5px;color:var(--ink3);line-height:1.4}
.gtile .gk{position:absolute;top:9px;right:9px;font:700 10px/1 var(--mono);color:var(--ember);opacity:0;transition:opacity .14s}
.gtile.sel .gk{opacity:1}
.gtile .gtag{display:inline-block;margin-top:7px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);border:1px solid var(--line);border-radius:99px;padding:1px 7px}

.rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:#0d0908;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink3)}
.seg button.on{background:var(--emberDim);color:#fff}

/* game view */
#gameBar{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
#gameBar .gt{font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px}
#gameBar .gt svg{width:24px;height:24px}
.pill{padding:4px 11px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font:600 13px/1.4 var(--mono);color:var(--ink2)}
.pill.hot{border-color:var(--emberDim);color:var(--ember2)}
#clock{font:700 17px/1 var(--mono);color:var(--ember2);min-width:62px;text-align:right}
#gameWrap{display:grid;grid-template-columns:1fr 232px;gap:18px;align-items:start}
@media(max-width:880px){#gameWrap{grid-template-columns:1fr}}
#gameHost{min-height:340px}
#oppPanel{position:sticky;top:70px}
.opphead{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.bar{height:8px;border-radius:99px;background:#0d0908;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--emberDim),var(--ember));transition:width .3s}
.bar.you i{background:linear-gradient(90deg,var(--goodDim),var(--good))}

/* results */
.rescard{max-width:660px;margin:0 auto}
.resrow{display:grid;grid-template-columns:1fr 96px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.resrow:last-child{border-bottom:0}
.resrow .who{display:flex;align-items:center;gap:11px;font-weight:700}
.resrow .sc{font:800 26px/1 var(--mono);text-align:right}
.resrow.win .sc{color:var(--good)}
.resrow.lose .sc{color:var(--ink3)}
.badge{font:700 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px}
.badge.w{background:var(--goodDim);color:#a8dfa9}
.badge.l{background:#221a18;color:var(--ink3)}
.badge.d{background:var(--warnDim);color:#e8d489}
.metrics{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.metrics span{font-size:11.5px;color:var(--ink3);background:#0f0b09;border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.scorebreak{display:flex;gap:6px;margin-top:6px;font-size:11px;color:var(--ink3)}
.scorebreak i{font-style:normal;padding:2px 7px;border-radius:5px;background:#0f0b09;border:1px solid var(--line)}

.tally{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 20px}
.tally .n{font:800 46px/1 var(--mono)}
.tally .n.lead{color:var(--ember2)}
.tally .mid{color:var(--ink3);font-size:13px;letter-spacing:.16em}
.pips{display:flex;gap:5px;justify-content:center;margin-bottom:16px}
.pip{width:26px;height:6px;border-radius:99px;background:#231a17;border:1px solid var(--line)}
.pip.a{background:var(--ember)}
.pip.b{background:var(--cool)}
.pip.d{background:var(--ink3)}
.pip.cur{box-shadow:0 0 0 2px var(--emberDim)}

/* stats */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--line2)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-family:var(--mono)}
.elo{font-family:var(--mono);font-weight:700;color:var(--ember2)}
.delta.up{color:var(--good)} .delta.dn{color:var(--bad)}

/* toasts + overlay */
#toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 18px;border-radius:99px;background:#241a16;border:1px solid var(--line2);box-shadow:var(--sh);font-size:14px;animation:tin .2s}
.toast.bad{border-color:var(--bad)} .toast.good{border-color:var(--good)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
#ov{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(6,4,3,.78);backdrop-filter:blur(4px);padding:20px}
#ov.on{display:grid}
#ovBox{max-width:520px;width:100%;animation:fade .2s}
#count{position:fixed;inset:0;z-index:85;display:none;place-items:center;background:rgba(6,4,3,.9)}
#count.on{display:grid}
#count b{font:800 clamp(80px,22vw,190px)/1 var(--mono);color:var(--ember);text-shadow:0 0 60px rgba(224,135,58,.5);animation:pop .9s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}}

/* ═══ [CSS-04] SHARED GAME WIDGETS ══════════════════════════════════ */
.gpanel{background:linear-gradient(180deg,var(--panel),#150f0d);border:1px solid var(--line);border-radius:var(--rl);padding:18px;box-shadow:var(--sh)}
.ghint{font-size:13px;color:var(--ink3);text-align:center;margin-bottom:14px}

/* letter tiles (wordle family) */
.tgrid{display:grid;gap:5px;justify-content:center;margin:0 auto}
.trow{display:grid;grid-auto-flow:column;gap:5px;justify-content:center}
.tile{
  width:var(--ts,54px);height:var(--ts,54px);display:grid;place-items:center;
  font:800 clamp(18px,4.4vw,26px)/1 var(--sans);text-transform:uppercase;
  border:2px solid var(--line2);border-radius:6px;background:#0d0908;color:var(--ink);
  transition:transform .1s;
}
.tile.fill{border-color:#61463a;animation:bump .1s}
@keyframes bump{50%{transform:scale(1.08)}}
.tile.g{background:var(--good);border-color:var(--good);color:#0b1a0c}
.tile.y{background:var(--warn);border-color:var(--warn);color:#1d1704}
.tile.b{background:#2a201c;border-color:#2a201c;color:var(--ink3)}
.tile.flip{animation:flip .5s ease forwards}
@keyframes flip{0%{transform:rotateX(0)}45%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.trow.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.trow.win .tile{animation:hop .5s ease}
@keyframes hop{40%{transform:translateY(-12px)}70%{transform:translateY(3px)}}

/* keyboard */
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:18px;user-select:none}
.kbr{display:flex;gap:5px}
.key{
  min-width:36px;height:50px;padding:0 9px;border-radius:6px;background:#3a2c25;color:var(--ink);
  font-weight:700;font-size:14px;text-transform:uppercase;display:grid;place-items:center;
  transition:background .15s,transform .06s
}
.key:hover{background:#4a382f}
.key:active{transform:translateY(1px)}
.key.wide{min-width:58px;font-size:12px}
.key.g{background:var(--good);color:#0b1a0c}
.key.y{background:var(--warn);color:#1d1704}
.key.b{background:#1a1412;color:#54463f}
@media(max-width:520px){.key{min-width:30px;height:46px;padding:0 5px;font-size:13px}.key.wide{min-width:46px;font-size:11px}}

/* generic option buttons */
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.opt{padding:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600;text-align:center;transition:border-color .13s}
.opt:hover:not(:disabled){border-color:var(--ember)}
.opt.g{background:var(--goodDim);border-color:var(--good)}
.opt.r{background:var(--badDim);border-color:var(--bad)}
.opt:disabled{opacity:.55}

.inline-in{display:flex;gap:8px;justify-content:center;margin-top:4px}
.inline-in input{flex:1;max-width:340px;padding:11px 13px;border-radius:9px;background:#0d0908;border:1px solid var(--line2);outline:none}
.inline-in input:focus{border-color:var(--ember)}

.log{max-height:290px;overflow:auto;margin-top:14px;display:flex;flex-direction:column;gap:5px}
.log::-webkit-scrollbar{width:8px}
.log::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.logrow{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;background:#0f0b09;border:1px solid var(--line);font-size:14px}
.logrow .nm{flex:1;font-weight:600}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="brand">
      <svg class="bmark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#170f0c"/>
        <rect x="9" y="9" width="19" height="19" rx="5" fill="#c8892f"/>
        <rect x="36" y="9" width="19" height="19" rx="5" fill="#3b4a52"/>
        <rect x="9" y="36" width="19" height="19" rx="5" fill="#3b4a52"/>
        <rect x="36" y="36" width="19" height="19" rx="5" fill="#6f9c62"/>
      </svg>
      <span>DLES</span>
    </div>
    <div id="topMid"><div id="roomChip" class="roomchip hide">Room <b id="roomCode">----</b><i class="dot" id="netDot"></i></div></div>
    <div id="topRight">
      <button class="btn sm gho" id="btnStats">Stats</button>
      <button class="btn sm gho hide" id="btnLeave">Leave</button>
    </div>
  </header>

  <main>
    <!-- ══ LOGIN ══ -->
    <section class="view on" id="vLogin">
      <div class="hero">
        <h1>DLES</h1>
        <p class="tag">Fourteen daily puzzle games. One friend. Same puzzle, both clocks running.</p>
      </div>
      <div class="loginbox card pad">
        <label class="field"><span>Your name</span><input id="inName" maxlength="14" placeholder="Jordan" autocomplete="off"></label>
        <button class="btn pri" id="btnCreate" style="width:100%">Create a room</button>
        <div class="orline">OR JOIN</div>
        <label class="field"><span>Room code</span><input id="inCode" class="code" maxlength="4" placeholder="ABCD" autocomplete="off"></label>
        <button class="btn" id="btnJoin" style="width:100%">Join room</button>
        <div class="orline">OR</div>
        <button class="btn gho" id="btnSolo" style="width:100%">Practice solo</button>
      </div>
    </section>

    <!-- ══ LOBBY ══ -->
    <section class="view" id="vLobby">
      <div class="lgrid">
        <div>
          <div class="card pad" style="margin-bottom:16px">
            <div class="seats" id="seats"></div>
            <div id="lobbyMsg" class="muted tiny" style="text-align:center"></div>
          </div>
          <div class="card pad">
            <div class="rowbtns" style="justify-content:space-between;margin-bottom:14px">
              <h3>Choose the games</h3>
              <div class="rowbtns">
                <button class="btn sm gho" data-pick="all">All</button>
                <button class="btn sm gho" data-pick="none">None</button>
                <button class="btn sm gho" data-pick="r3">Random 3</button>
                <button class="btn sm gho" data-pick="r5">Random 5</button>
              </div>
            </div>
            <div class="gsel" id="gameSel"></div>
          </div>
        </div>
        <aside>
          <div class="card pad" style="margin-bottom:14px">
            <h3 style="margin-bottom:12px">Match</h3>
            <div class="tiny dim" style="margin-bottom:6px">SELECTED</div>
            <div id="selCount" style="font:800 32px/1 var(--mono);margin-bottom:14px">0</div>
            <div class="tiny dim" style="margin-bottom:6px">ORDER</div>
            <div class="seg" id="orderSeg" style="margin-bottom:16px">
              <button data-order="pick" class="on">As picked</button>
              <button data-order="shuffle">Shuffled</button>
            </div>
            <button class="btn pri" id="btnStart" style="width:100%">Start match</button>
            <div class="tiny dim" id="startHint" style="margin-top:9px;text-align:center"></div>
          </div>
          <div class="card pad">
            <h3 style="margin-bottom:10px;font-size:15px">Head to head</h3>
            <div id="h2h" class="tiny muted">—</div>
          </div>
        </aside>
      </div>
    </section>

    <!-- ══ GAME ══ -->
    <section class="view" id="vGame">
      <div id="gameBar">
        <div class="gt" id="gTitle"></div>
        <div class="pill" id="gRound"></div>
        <div style="flex:1"></div>
        <div class="pill hot" id="gPar"></div>
        <div id="clock">0:00</div>
      </div>
      <div id="gameWrap">
        <div id="gameHost"></div>
        <aside id="oppPanel">
          <div class="card pad">
            <div class="opphead"><i class="dot on"></i><b id="youName" style="font-size:14px">You</b></div>
            <div class="bar you" style="margin-bottom:4px"><i id="youBar" style="width:0"></i></div>
            <div class="tiny dim" id="youNote">—</div>
            <div style="height:1px;background:var(--line);margin:15px 0"></div>
            <div class="opphead"><i class="dot" id="oppDot"></i><b id="oppName" style="font-size:14px">Opponent</b></div>
            <div class="bar" style="margin-bottom:4px"><i id="oppBar" style="width:0"></i></div>
            <div class="tiny dim" id="oppNote">—</div>
          </div>
          <div class="card pad" style="margin-top:14px">
            <div class="tiny dim" style="margin-bottom:8px">MATCH</div>
            <div class="pips" id="gPips" style="margin-bottom:10px"></div>
            <div class="tiny muted" id="gTally"></div>
          </div>
          <button class="btn sm gho" id="btnGiveUp" style="width:100%;margin-top:12px">Give up</button>
        </aside>
      </div>
    </section>

    <!-- ══ ROUND RESULT ══ -->
    <section class="view" id="vRound">
      <div class="rescard card pad">
        <div style="text-align:center;margin-bottom:6px" class="tiny dim" id="rTitle"></div>
        <h2 style="text-align:center;font-size:26px;margin-bottom:16px" id="rVerdict"></h2>
        <div id="rRows"></div>
        <div id="rAnswer" class="tiny muted" style="text-align:center;margin:16px 0 0"></div>
        <div class="pips" id="rPips" style="margin-top:20px"></div>
        <div style="display:flex;gap:10px;margin-top:16px">
          <button class="btn pri" id="btnNext" style="flex:1">Next game</button>
        </div>
        <div class="tiny dim" style="text-align:center;margin-top:9px" id="rWait"></div>
      </div>
    </section>

    <!-- ══ MATCH RESULT ══ -->
    <section class="view" id="vMatch">
      <div class="rescard card pad">
        <h2 style="text-align:center;font-size:30px" id="mVerdict"></h2>
        <div class="tally" id="mTally"></div>
        <div id="mElo" style="text-align:center;margin-bottom:18px"></div>
        <table class="tbl" id="mTable"></table>
        <div style="display:flex;gap:10px;margin-top:20px">
          <button class="btn pri" id="btnRematch" style="flex:1">Rematch</button>
          <button class="btn" id="btnLobby" style="flex:1">Back to lobby</button>
        </div>
        <div class="tiny dim" style="text-align:center;margin-top:9px" id="mWait"></div>
      </div>
    </section>

    <!-- ══ STATS ══ -->
    <section class="view" id="vStats">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
        <h2 style="flex:1">Standings</h2>
        <button class="btn sm gho" id="btnStatsBack">Back</button>
      </div>
      <div class="card pad" style="margin-bottom:16px">
        <h3 style="font-size:15px;margin-bottom:10px">Ladder</h3>
        <table class="tbl" id="ladder"></table>
      </div>
      <div class="card pad" style="margin-bottom:16px">
        <h3 style="font-size:15px;margin-bottom:10px">Recent matches</h3>
        <table class="tbl" id="history"></table>
      </div>
      <div class="card pad">
        <h3 style="font-size:15px;margin-bottom:10px">Per-game bests</h3>
        <table class="tbl" id="gstats"></table>
      </div>
    </section>
  </main>
</div>

<div id="toasts"></div>
<div id="ov"><div id="ovBox" class="card pad"></div></div>
<div id="count"><b id="countN">3</b></div>
