/* ==================================================== [JS-11] more scenes
   Added after SCENES and merged over it, so anything defined here REPLACES the
   original of the same id. That keeps the rewrite in one block instead of
   scattered surgery through the file.

   What this block is for, in Jordan's words: "we get a lot of the same text",
   "it still sounds so robot like", "no heartfelt emotion in anything, even if
   they are mean or demanding etc we dont feel it".

   Three things changed in how these are written:

   1. THE PLAYER HAS A BODY. The old scenes were a camera on a tripod. Feet go
      numb, hands shake after a rush, you notice you've been staring. Emotion
      the reader is supposed to feel has to land on someone.

   2. EMOTION IS PHYSICAL, NOT STATED. Nobody announces what they feel and the
      narration never explains it either. A voice goes thin. A hand stops
      halfway. Someone laughs a beat too long at nothing. Reiko being demanding
      has to have actual weight behind it -- she signs your hours -- or it is
      just a woman being brisk.

   3. EVERYONE HAS THEIR OWN RHYTHM. They were all writing in my voice before:
      clipped, dry, faintly clever. Now Rina sprawls and doubles back, Ayano
      restarts sentences, Reiko is clipped until the clip cracks, Sana leaves
      gaps and lets them sit, Mei says less than she means, Haruka overshoots
      and then hears herself.

   banter0..N rotate on how many shifts you have worked with that person, so a
   fourth shift is a new conversation. <who>_at_<loc> fires when you find her
   somewhere that isn't work, and the place does the work in the scene. */
Object.assign(SCENES, {

/* ---------------------------------------------------------------- intro */
intro:{ bg:"storefront", portRoom:"counter", lines:[
 {text:"The ad said staff wanted, nights included, no experience necessary. It didn't mention that the place is four seats wide and wedged between a laundromat and somebody's stairwell, or that you can smell the fryer from the end of the street."},
 {text:"You've been standing outside it for two minutes. The door's propped open with a crate."},
 {who:"mei",expr:"neutral",bg:"counter",text:"You're the new one."},
 {text:"She's already got an apron out, holding it at arm's length like she's done this enough times not to bother with the introduction first."},
 {who:"mei",expr:"neutral",text:"Mei. Tie it at the back, not the side. It catches on the fryer handle and you'll go over."},
 {text:"Something clatters in the kitchen. Something else swears."},
 {who:"haruka",expr:"smile",text:"Oh thank god. Thank GOD. I've been back here on my own for three weeks and I was starting to have full conversations with the fry basket."},
 {who:"haruka",expr:"smile",text:"Haruka. Ignore her face, she's like that with everyone, it's not you."},
 {who:"mei",expr:"annoyed",text:"My face is doing nothing."},
 {who:"haruka",expr:"smile",text:"That! That's the thing! You just did it!"},
 {text:"Mei looks at her for slightly too long. Haruka grins like she's won something."},
 {choices:[{prompt:"They're both waiting on you now, and the crate's still holding the door open behind you.",
   text:"\"I'll try to keep up.\"",hint:"safe",aff:{mei:2,haruka:2}},
  {text:"\"Three weeks on your own? That's rough.\"",hint:"Haruka",aff:{haruka:5}},
  {text:"\"Back, not the side. Got it.\"",hint:"Mei",aff:{mei:5}}]},
 {who:"mei",expr:"soft",text:"Eleven to seven. Don't be late."},
 {text:"She's already turned away. Somewhere behind you Haruka drops something else and says it's fine, it's fine, it's fine."},
 {text:"That's the whole training."}
]},

/* ---------------------------------------------------------------- Mei */
mei_shift0:{ bg:"counter", lines:[
 {text:"The rush comes in one lump at half twelve and is gone by ten past one. After that the room goes so quiet you can hear the drinks fridge cycling."},
 {text:"Your feet have gone numb somewhere around the fourth hour. Nobody warned you about that part."},
 {who:"mei",expr:"neutral",text:"Count it twice. Once for the till, once for you."},
 {text:"She doesn't look up. Her hands go through the notes like they're doing it without her, thumb, thumb, thumb, and she doesn't lose her place once."},
 {who:"mei",expr:"neutral",text:"Short drawer comes off your pay. Not mine. Not hers. Yours."},
 {choices:[{text:"\"Has it ever come up short?\"",aff:{mei:3}},
  {text:"\"Understood.\"",aff:{mei:1}},
  {text:"\"So that's a no on trusting me.\"",hint:"blunt",aff:{mei:4},flag:"mei_blunt"}]},
 {who:"mei",expr:"soft",text:"Once."},
 {text:"The counting stops. Just for a second — she loses the thumb rhythm and has to start the last bundle again."},
 {who:"mei",expr:"neutral",text:"Wasn't me."},
 {text:"You wait. She doesn't give you anything else, and after a while it stops feeling like she's being rude and starts feeling like she's being careful."}
]},
mei_shift1:{ bg:"counter", lines:[
 {who:"mei",expr:"neutral",text:"You're quicker than last week."},
 {text:"You nearly drop the tray. From her that's a bouquet."},
 {who:"mei",expr:"soft",text:"Reiko'll notice. She notices the ones who are useful, and then she uses them, and then one day they're doing four jobs for one wage and can't remember agreeing to any of it."},
 {text:"She says it flatly, wiping down a rail that's already clean, and you get the very clear sense you're being told something rather than warned."},
 {choices:[{text:"\"Is that a warning?\"",aff:{mei:4}},
  {text:"\"Is that what she did to you?\"",hint:"pushing",aff:{mei:6},flag:"mei_reiko"},
  {text:"\"I don't mind being useful.\"",aff:{mei:2}}]},
 {who:"mei",expr:"annoyed",text:"Four years I've been on this counter. Work it out."},
 {text:"The cloth goes back and forth over the same six inches of steel for a lot longer than the steel needs."}
]},
mei_shift2:{ bg:"counter", lines:[
 {text:"Twenty to close. She's stopped inventing things to do, which in the four weeks you've known her has never once happened."},
 {text:"She's just standing there with her hands flat on the counter, looking out at a street with nobody on it."},
 {who:"mei",expr:"soft",text:"You can go. I'll lock up."},
 {text:"A beat. The fridge cycles. She doesn't turn round."},
 {who:"mei",expr:"blush",text:"Or don't. Either one's fine."},
 {text:"It is very obviously not either one."},
 {choices:[{text:"\"I'll stay.\"",hint:"+Mei",aff:{mei:8},flag:"mei_stayed"},
  {text:"\"You always say it like that. Like it'd cost you something to just ask.\"",aff:{mei:10},flag:"mei_called_out"},
  {text:"\"Next time.\"",aff:{mei:1}}]},
 {who:"mei",expr:"soft",text:"...Fine."},
 {text:"She still doesn't turn round. But her shoulders come down about an inch, and she says it again, quieter, mostly to the window."},
 {who:"mei",expr:"soft",text:"Fine. Get the shutter."}
]},
mei_banter0:{ bg:"counter", lines:[
 {text:"Slow hour. She's restocking cups one sleeve at a time, which takes about four times longer than doing it properly."},
 {who:"mei",expr:"neutral",text:"There's a man who comes in every Thursday and orders the same thing and I've never once got it right first time."},
 {who:"mei",expr:"soft",text:"He's stopped correcting me. That's worse."},
 {choices:[{text:"\"What does he order?\"",aff:{mei:3}},
  {text:"\"Ask him.\"",aff:{mei:2}},
  {text:"\"So he likes you.\"",aff:{mei:4}}]},
 {who:"mei",expr:"annoyed",text:"He does not like me. Nobody likes anybody at half four on a Thursday."},
 {text:"She sleeves another cup. Her mouth does something that isn't a smile but is in the same family."}
]},
mei_banter1:{ bg:"counter", lines:[
 {text:"Someone's left the radio on the kitchen station and neither of you has moved to change it in about forty minutes."},
 {who:"mei",expr:"soft",text:"I used to want to do something else. I can't remember what it was, which I think tells you how much I wanted it."},
 {choices:[{text:"\"You'll remember.\"",aff:{mei:3}},
  {text:"\"Does it bother you?\"",aff:{mei:5}},
  {text:"\"You're good at this one.\"",aff:{mei:4}}]},
 {who:"mei",expr:"neutral",text:"Not really. Some days. Not today."},
 {text:"She turns the radio down two clicks instead of off, and leaves it there."}
]},
mei_banter2:{ bg:"counter", lines:[
 {text:"You burn the side of your wrist on the tray rail. It's not bad. It's bad enough to make a noise about."},
 {who:"mei",expr:"surprise",text:"Cold water. Now, not in a minute."},
 {text:"She's got your arm under the tap before you've finished deciding whether to make a thing of it. Her hand is around your wrist and her thumb is on the inside of it and she is looking at the burn, not at you."},
 {who:"mei",expr:"neutral",text:"Two minutes. Properly."},
 {choices:[{text:"\"It's fine.\"",aff:{mei:2}},
  {text:"\"You've done this before.\"",aff:{mei:5}},
  {text:"Don't say anything.",hint:"she doesn't let go",aff:{mei:6}}]},
 {text:"She holds on for the whole two minutes. When she lets go she does it quickly, like she's put something down."},
 {who:"mei",expr:"soft",text:"Tray rail gets everyone once. Now it's done."}
]},
mei_at_konbini:{ bg:"konbini", portRoom:"konbini", lines:[
 {text:"Half one in the morning. The konbini light is that white that makes everyone look ill, and Mei is standing in front of the hot case in a coat you've never seen, not buying anything."},
 {who:"mei",expr:"surprise",bg:"konbini",text:"...Oh."},
 {text:"She actually startles. You've never seen her do that at work — someone could set the fryer on fire and she'd deal with it like it was on the rota."},
 {who:"mei",expr:"neutral",text:"I'm not following you. Before you say it."},
 {choices:[{text:"\"I wasn't going to.\"",aff:{mei:5}},
  {text:"\"You're here every night, aren't you.\"",aff:{mei:7},flag:"mei_konbini"},
  {text:"\"You're allowed to be hungry.\"",aff:{mei:4}}]},
 {who:"mei",expr:"soft",text:"I'm not hungry. I just don't like the ceiling in my flat."},
 {text:"She says it like it's nothing. Then she hears it, and her jaw does something, and she picks up a rice ball she clearly does not want."},
 {who:"mei",expr:"blush",text:"That came out strange. Forget it."},
 {choices:[{text:"\"I've got a ceiling too. It's not great either.\"",aff:{mei:8}},
  {text:"\"Sit outside with me for ten minutes.\"",aff:{mei:9},flag:"mei_sat"},
  {text:"\"Forgotten.\"",aff:{mei:4}}]},
 {who:"mei",expr:"soft",text:"...Ten minutes."},
 {text:"You end up on the kerb outside with two coffees neither of you finishes. She doesn't say much. She also doesn't leave."}
]},
mei_at_station:{ bg:"street", lines:[
 {text:"She's on the far platform bench with her bag on her knees, not looking at her phone, not looking at anything."},
 {text:"Three trains go past on the other side before she notices you."},
 {who:"mei",expr:"surprise",bg:"street",text:"How long have you been standing there."},
 {choices:[{text:"\"Two trains.\"",aff:{mei:4}},
  {text:"\"Long enough to work out you're not waiting for one.\"",aff:{mei:7}},
  {text:"\"Just got here.\"",aff:{mei:2}}]},
 {who:"mei",expr:"soft",text:"I like the noise. It's the only place I can sit where nobody thinks it's strange that I'm sitting."},
 {text:"Another one goes through. The bench shakes slightly. She closes her eyes for the length of it, and you understand you're being shown something she hasn't decided to show you."},
 {who:"mei",expr:"neutral",text:"Don't tell Haruka. She'd make it a whole thing."},
 {choices:[{text:"\"I won't.\"",aff:{mei:6}},
  {text:"\"She'd sit with you.\"",aff:{mei:5}},
  {text:"Sit down next to her.",hint:"+Mei",aff:{mei:8},flag:"mei_bench"}]},
 {who:"mei",expr:"blush",text:"...Right. Okay."}
]},

/* ---------------------------------------------------------------- Haruka */
haruka_shift0:{ bg:"kitchen", portRoom:"counter", lines:[
 {text:"The kitchen is about the size of a bathroom and roughly eleven degrees hotter than the front. Within ten minutes your shirt is stuck to your back."},
 {who:"haruka",expr:"smile",text:"Rule one — basket goes in SLOW. Slow. You drop it in and the oil comes up and you'll be picking blisters off your forearm for a week, ask me how I know."},
 {who:"haruka",expr:"smile",text:"Rule two, if Reiko asks, we're on schedule. Always. Doesn't matter what's actually happening. We're on schedule."},
 {choices:[{text:"\"What's rule three?\"",aff:{haruka:4}},
  {text:"\"You're going to get me fired.\"",aff:{haruka:3}},
  {text:"\"Show me the forearm.\"",hint:"playing along",aff:{haruka:5}}]},
 {who:"haruka",expr:"smile",text:"Rule three, I get first pick of whatever's left at close. That one's not negotiable, that one's basically in my contract."},
 {text:"She says it like a joke. She then immediately writes her name on a bag of chicken and puts it in the back of the warmer, so it is not a joke."},
 {who:"haruka",expr:"smile",text:"Don't look at me like that. Three weeks alone in here. I've earned it."}
]},
haruka_shift1:{ bg:"kitchen", portRoom:"counter", lines:[
 {text:"Two hours in, both of you sweating, and she's been talking more or less continuously since eleven."},
 {who:"haruka",expr:"smile",text:"Is it weird we know each other because of a fryer? Like — that's the reason. That's the whole reason."},
 {who:"haruka",expr:"neutral",text:"If you'd gone for the place by the station we'd just never have happened. You'd be somebody I walked past."},
 {text:"She's not looking at you. She's very deliberately doing something to the oil filter that does not need doing."},
 {choices:[{text:"\"That's heavy for a Tuesday.\"",aff:{haruka:3}},
  {text:"\"Glad I didn't, then.\"",hint:"+Haruka",aff:{haruka:7}},
  {text:"\"You think about this a lot?\"",aff:{haruka:5},flag:"har_thinks"}]},
 {who:"haruka",expr:"blush",text:"Shut UP. It's like ninety degrees back here, that's all that is, that's a heat thing."},
 {text:"She laughs about a second and a half too long, and then goes and checks something in the walk-in for no reason at all."}
]},
haruka_shift2:{ bg:"kitchen", portRoom:"counter", lines:[
 {text:"She's quiet for once. It's louder than the talking."},
 {who:"haruka",expr:"neutral",text:"Can I ask you something and you don't be weird."},
 {who:"haruka",expr:"neutral",text:"Mei told you about me. Right? She tells everyone eventually. She thinks it's a kindness, doing it before I have to."},
 {text:"She's got both hands on the edge of the counter. Her knuckles have gone pale."},
 {choices:[{text:"\"She hasn't told me anything.\"",hint:"true",aff:{haruka:8},flag:"har_trust"},
  {text:"\"She did. It didn't change anything.\"",aff:{haruka:6}},
  {text:"\"Tell me yourself.\"",hint:"+Haruka",aff:{haruka:10},flag:"har_told_me"}]},
 {who:"haruka",expr:"soft",text:"...Huh."},
 {text:"She lets go of the counter. Shakes her hands out like they've gone to sleep."},
 {who:"haruka",expr:"smile",text:"Okay. Okay! Not now, there's a queue and you've got sauce on your face. But okay."}
]},
haruka_banter0:{ bg:"kitchen", portRoom:"counter", lines:[
 {who:"haruka",expr:"smile",text:"Right, hypothetical. You've got one meal left, ever, and it has to be something we sell here."},
 {choices:[{text:"\"Nothing. I'd rather starve.\"",aff:{haruka:4}},
  {text:"\"The chicken. Obviously the chicken.\"",aff:{haruka:5}},
  {text:"\"Why is this hypothetical so bleak?\"",aff:{haruka:3}}]},
 {who:"haruka",expr:"smile",text:"See, that's the right answer and I'm going to tell everyone you said it."},
 {text:"She doesn't tell anyone. She does bring you the chicken at close, though, without saying anything about it."}
]},
haruka_banter1:{ bg:"kitchen", portRoom:"counter", lines:[
 {text:"The extractor fan's been making a noise like a dying animal since Tuesday."},
 {who:"haruka",expr:"annoyed",text:"I've put it in the book four times. FOUR. Reiko keeps writing 'noted' under it."},
 {who:"haruka",expr:"smile",text:"One day I'm going to write 'noted' under something of hers and see how she likes it."},
 {choices:[{text:"\"You absolutely will not.\"",aff:{haruka:4}},
  {text:"\"I'll do it.\"",aff:{haruka:6}},
  {text:"\"She'd respect it, honestly.\"",aff:{haruka:5}}]},
 {who:"haruka",expr:"blush",text:"...Okay don't actually. I take it back. She'd know it was me, she always knows it was me."}
]},
haruka_banter2:{ bg:"kitchen", portRoom:"counter", lines:[
 {text:"She's got her sleeve pushed up and she's showing you a scar on the inside of her elbow like it's a holiday photo."},
 {who:"haruka",expr:"smile",text:"First month. Basket. Straight in, no slow, exactly what I tell you not to do."},
 {who:"haruka",expr:"soft",text:"Mei drove me to the clinic. She didn't say one word the whole way there and then she waited outside for two hours."},
 {choices:[{text:"\"That sounds like her.\"",aff:{haruka:5}},
  {text:"\"Did you thank her?\"",aff:{haruka:4}},
  {text:"\"Two hours.\"",aff:{haruka:6}}]},
 {who:"haruka",expr:"smile",text:"I know. I KNOW. She'd deny it if you asked her, she'd say she was parked badly."},
 {text:"She pulls the sleeve back down. She's smiling at nothing in particular."}
]},
haruka_at_arcade:{ bg:"arcade", portRoom:"arcade", lines:[
 {text:"You hear her before you find her. Second floor, back wall, shouting at a rhythm machine that is very clearly beating her."},
 {who:"haruka",expr:"surprise",bg:"arcade",text:"NO — no no no, that was ON, that was on the line, that machine is a LIAR—"},
 {text:"She turns round mid-sentence and sees you and her whole face changes, and she doesn't quite manage to put it back."},
 {who:"haruka",expr:"blush",text:"Oh. Hi. How long have you—"},
 {choices:[{text:"\"Long enough to hear you call a machine a liar.\"",aff:{haruka:6}},
  {text:"\"You come here every night?\"",aff:{haruka:4}},
  {text:"\"Play me.\"",hint:"+Haruka",aff:{haruka:8},flag:"har_played"}]},
 {who:"haruka",expr:"smile",text:"I'm going to destroy you. I want you to know that going in. I'm not going to be gracious about it."},
 {text:"She destroys you. Four times. She is not gracious about it."},
 {text:"On the fifth she stops halfway through and just watches you play instead, arms folded, and when you finish she's got a look on her face she doesn't cover fast enough."},
 {who:"haruka",expr:"soft",text:"You're getting better."},
 {choices:[{text:"\"I'm getting worse, actually.\"",aff:{haruka:5}},
  {text:"\"You stopped playing.\"",aff:{haruka:8}},
  {text:"\"Again.\"",aff:{haruka:6}}]},
 {who:"haruka",expr:"blush",text:"Yeah. Yeah, I did. Anyway — one more, and then I'm getting food, and you're coming."}
]},
haruka_at_station:{ bg:"street", lines:[
 {text:"She's leaning on the barrier by the ticket gates eating something out of a paper bag, and she's still in her work shirt with the apron balled under one arm."},
 {who:"haruka",expr:"smile",bg:"street",text:"Don't say anything about the shirt. I know about the shirt."},
 {choices:[{text:"\"I wasn't going to say anything about the shirt.\"",aff:{haruka:4}},
  {text:"\"Long day?\"",aff:{haruka:5}},
  {text:"\"You waited.\"",hint:"she did",aff:{haruka:8},flag:"har_waited"}]},
 {who:"haruka",expr:"blush",text:"I did not wait. I got food. The food is right here, this is food."},
 {text:"The bag is empty. It has clearly been empty for some time."},
 {who:"haruka",expr:"soft",text:"...Okay I waited about twenty minutes. It's fine. It's a nice barrier."},
 {text:"She offers you the empty bag, realises, and puts it in the bin with real dignity."}
]},

/* ---------------------------------------------------------------- Reiko */
reiko_shift0:{ bg:"counter", lines:[
 {text:"She does the floor at two. Always two. You can hear her coming because everyone else stops talking about six seconds before she appears."},
 {text:"She doesn't raise her voice. In eleven years she has never once had to."},
 {who:"reiko",expr:"neutral",text:"You covered Tuesday."},
 {who:"reiko",expr:"annoyed",text:"I didn't ask you to. I don't like things I didn't ask for — it means I've read someone wrong, and I'm not often wrong about people."},
 {text:"The clipboard stays at her side. Somehow that's worse than if she'd written something down."},
 {choices:[{text:"\"Someone had to.\"",aff:{reiko:4}},
  {text:"\"You're welcome.\"",hint:"risky",aff:{reiko:6},flag:"rei_cheek"},
  {text:"\"I needed the money.\"",hint:"honest",aff:{reiko:5}}]},
 {who:"reiko",expr:"soft",text:"...That one I believe."},
 {text:"She writes something. It takes about two seconds and she doesn't let you see it, and you spend the rest of the shift thinking about it, which you suspect is the point."}

reiko_shift1:{ bg:"counter", lines:[
 {who:"reiko",expr:"neutral",text:"Mei says you're competent."},
 {text:"She lets that sit for a moment, the way you'd put something heavy down on a table to see if the table holds."},
 {who:"reiko",expr:"neutral",text:"Mei has not said that about anyone since I hired her. So now I have to decide whether that means more hours or fewer."},
 {choices:[{text:"\"Why would it be fewer?\"",aff:{reiko:5}},
  {text:"\"More. Obviously.\"",aff:{reiko:4}},
  {text:"\"Because you give the good ones more until they quit.\"",hint:"sharp",aff:{reiko:9},flag:"rei_saw"}]},
 {who:"reiko",expr:"surprise",text:"..."},
 {text:"Her expression doesn't change. Her hand does — the pen comes up off the clipboard about an inch and stays there."},
 {who:"reiko",expr:"soft",text:"Go and do the cups."},
 {text:"You go and do the cups. She's still standing in the same spot four minutes later."}
]},
reiko_shift2:{ bg:"office", portRoom:"office", art:"rei_office", lines:[
 {text:"The office is a desk behind a curtain that doesn't close, under a strip light that buzzes at a pitch you can feel in your teeth."},
 {text:"It's ten past one in the morning and she's still in it."},
 {who:"reiko",expr:"neutral",bg:"office",text:"Rota. Payroll. The tax thing. Sit down or go, but don't hover, it's the worst of both."},
 {text:"There's a second chair. It's got a box of napkins on it. She's had a second chair in here for eleven years and it has never once been empty."},
 {choices:[{text:"Move the box. Sit down.",aff:{reiko:6}},
  {text:"\"When do you actually sleep?\"",aff:{reiko:8},flag:"rei_sleep"},
  {text:"\"Want a hand with any of it?\"",hint:"+Reiko",aff:{reiko:10}}]},
 {text:"She stops writing."},
 {who:"reiko",expr:"soft",text:"Nobody has offered me that in eleven years."},
 {text:"It comes out wrong — too fast, and about a third too quiet — and she hears it land and immediately puts the manager back on like a coat."},
 {who:"reiko",expr:"annoyed",text:"Don't make it a thing. Napkins go on the floor, not the desk."}
]},
reiko_banter0:{ bg:"counter", lines:[
 {who:"reiko",expr:"annoyed",text:"Who put the large cups in the medium sleeve."},
 {text:"Nobody answers. Nobody ever answers. She looks at the sleeve for slightly longer than a person should look at a sleeve."},
 {choices:[{text:"\"Me.\"",hint:"it wasn't",aff:{reiko:7}},
  {text:"\"Not me.\"",aff:{reiko:2}},
  {text:"\"Does it matter?\"",hint:"brave",aff:{reiko:4}}]},
 {who:"reiko",expr:"soft",text:"It wasn't you. You weren't on Thursday."},
 {text:"She fixes the sleeve herself. She doesn't say anything else about it, but she's in a noticeably better mood for the rest of the shift."}
]},
reiko_banter1:{ bg:"counter", lines:[
 {text:"She's behind the counter doing a job that is two grades below her, because the person who should be doing it has gone home ill."},
 {who:"reiko",expr:"neutral",text:"Rina's off. Before you ask, she's genuinely ill, she's not skiving, and if you repeat that I'll deny it."},
 {choices:[{text:"\"Why would you deny it?\"",aff:{reiko:5}},
  {text:"\"You covered her shift.\"",aff:{reiko:7}},
  {text:"\"I wasn't going to ask.\"",aff:{reiko:3}}]},
 {who:"reiko",expr:"annoyed",text:"Because if it gets out that I'll cover, everyone will need covering."},
 {text:"She restocks the straws. She's fast at it in a way that means she's done it ten thousand times."},
 {who:"reiko",expr:"soft",text:"...I'd cover anyway. That is also not repeatable."}
]},
reiko_banter2:{ bg:"counter", lines:[
 {text:"A customer is rude to you. Properly rude, the kind where you have to keep your face still and count backwards."},
 {text:"Reiko is at the other end of the counter and does not appear to be listening."},
 {text:"She is beside you in about four seconds, and she does not raise her voice, and the man leaves without his change."},
 {who:"reiko",expr:"neutral",text:"You don't have to take that. Take the order, not that."},
 {choices:[{text:"\"I could've handled it.\"",aff:{reiko:4}},
  {text:"\"Thanks.\"",aff:{reiko:6}},
  {text:"\"What did you say to him?\"",aff:{reiko:7}}]},
 {who:"reiko",expr:"soft",text:"I told him the truth, which is that I remember faces."},
 {text:"She goes back to the other end of the counter. Your hands are still shaking a bit. Hers are completely steady."}
]},
reiko_at_bar:{ bg:"bar", portRoom:"bar", lines:[
 {text:"Six people fit in here if nobody moves. There are four, and one of them is your manager, and she is not wearing the tie."},
 {text:"It takes you a second to place her without it. That's the thing you'll think about later — that she was harder to recognise out of the uniform than she should have been."},
 {who:"reiko",expr:"surprise",bg:"bar",text:"...Of all the places."},
 {choices:[{text:"\"I'll go somewhere else.\"",aff:{reiko:2}},
  {text:"\"I didn't know you drank.\"",aff:{reiko:4}},
  {text:"Sit down anyway.",hint:"+Reiko",aff:{reiko:8},flag:"rei_bar"}]},
 {who:"reiko",expr:"annoyed",text:"I come here because nobody in it has ever asked me a single question."},
 {text:"She turns the glass a quarter turn on the bar. Then another quarter. She's not drinking it so much as holding onto it."},
 {who:"reiko",expr:"soft",text:"You're going to ask me one now, aren't you."},
 {choices:[{text:"\"No.\"",hint:"just sit",aff:{reiko:9},flag:"rei_noq"},
  {text:"\"One. You can pass.\"",aff:{reiko:7}},
  {text:"\"Eleven years. Why here?\"",aff:{reiko:5}}]},
 {who:"reiko",expr:"blush",text:"..."},
 {text:"The owner puts a second glass down in front of you without being asked, which means she's been coming here long enough that he knows what she does and doesn't want to explain."},
 {who:"reiko",expr:"soft",text:"Don't do this at work. Whatever this is. I need one place where I'm just the manager and one where I'm not, and I've only got the two."}
]},
reiko_at_office:{ bg:"office", portRoom:"office", art:"rei_office", lines:[
 {text:"The curtain's pulled across. You can see the strip light flickering through the gap in it."},
 {who:"reiko",expr:"neutral",bg:"office",text:"If it's the extractor fan, I've noted it."},
 {choices:[{text:"\"It's not the fan.\"",aff:{reiko:4}},
  {text:"\"Haruka says you always write 'noted'.\"",aff:{reiko:6}},
  {text:"\"I brought you something to eat.\"",hint:"+Reiko",aff:{reiko:9},flag:"rei_fed"}]},
 {who:"reiko",expr:"surprise",text:"..."},
 {text:"She looks at it for long enough that you start to feel stupid. Then she moves the payroll to one side — actually moves it, which you have not seen her do for anything — and eats it right there in front of you without a word."},
 {who:"reiko",expr:"soft",text:"I hadn't. Since about eleven this morning. I forget."},
 {who:"reiko",expr:"annoyed",text:"That's not a complaint, and it's not a hint, so don't start doing it every night."},
 {text:"You do start doing it every night. She never once tells you to stop."}
]},

/* ---------------------------------------------------------------- Rina */
rina_shift0:{ bg:"counter", lines:[
 {who:"rina",expr:"smile",text:"Okay so you've met everyone now right? Right. Sit down — you can't sit down, obviously, we're on. Stand there and receive this."},
 {who:"rina",expr:"smile",text:"Mei's not cold, she's just tired in a way that's been going on for years. Haruka is a golden retriever in a person costume. Ayano would apologise to a door if she walked into it, I've seen her do it, I've SEEN it."},
 {who:"rina",expr:"neutral",text:"And Reiko is the single most terrifying woman in Shinjuku and I would genuinely take a bullet for her."},
 {choices:[{text:"\"What's mine?\"",aff:{rina:6}},
  {text:"\"That's a lot of opinions for a Tuesday.\"",aff:{rina:3}},
  {text:"\"You skipped yourself.\"",hint:"noticed",aff:{rina:8},flag:"rin_noticed"}]},
 {who:"rina",expr:"blush",text:"Mine's boring! Mine's like — girl talks too much, girl works here, girl has strong opinions about everyone else so she doesn't have to have any about herself. Next!"},
 {text:"She says the last part fast enough that you nearly miss it, and then she's already three sentences into something about the drinks fridge."}
]},
rina_shift1:{ bg:"counter", lines:[
 {who:"rina",expr:"smile",text:"Guess who got kept behind on Friday. Go on. Guess."},
 {who:"rina",expr:"annoyed",text:"Me! It's always me! Twenty minutes about cup sleeves. TWENTY. She thinks I don't take it seriously."},
 {text:"She's polishing the same section of counter you watched her polish four minutes ago."},
 {choices:[{text:"\"Do you?\"",aff:{rina:4}},
  {text:"\"You take it more seriously than any of us.\"",aff:{rina:9},flag:"rin_seen"},
  {text:"\"She keeps everyone behind.\"",aff:{rina:3}}]},
 {text:"The cloth stops."},
 {who:"rina",expr:"blush",text:"...Okay. You can't just say something like that during a lunch rush and then walk off to the drinks station."},
 {who:"rina",expr:"blush",text:"Come BACK. I'm not done being normal about it."}
]},
rina_shift2:{ bg:"break", lines:[
 {text:"Break room. She's got her feet up on the other chair and she's gone quiet, which in four weeks you have never seen last longer than about eight seconds."},
 {text:"This one's been going about two minutes."},
 {who:"rina",expr:"neutral",bg:"break",text:"Can I say a real thing? Not a gossip thing. A real one."},
 {who:"rina",expr:"soft",text:"I know everything about everyone in here because it's how I check I'm still part of it. If I know what's going on with all of them then I'm — you know. In it."},
 {who:"rina",expr:"soft",text:"Nobody knows anything about me and that's not an accident, that's a whole strategy, and I only just noticed I was doing it."},
 {choices:[{text:"\"You are part of it.\"",aff:{rina:10}},
  {text:"\"That sounds exhausting.\"",aff:{rina:8}},
  {text:"\"Then tell me something. Just one.\"",hint:"+Rina",aff:{rina:12},flag:"rin_you"}]},
 {who:"rina",expr:"blush",text:"Ugh."},
 {who:"rina",expr:"blush",text:"You're going to be a problem. I can feel it. I can feel it happening."}
]},
rina_banter0:{ bg:"counter", lines:[
 {who:"rina",expr:"smile",text:"Okay, unrelated, completely unrelated — do you think Mei has ever laughed? Out loud? With sound?"},
 {choices:[{text:"\"Once. I've seen it.\"",aff:{rina:5}},
  {text:"\"No. Physically incapable.\"",aff:{rina:4}},
  {text:"\"Ask her.\"",aff:{rina:3}}]},
 {who:"rina",expr:"surprise",text:"You have NOT seen it. When. What did she— no, don't tell me, actually tell me, tell me everything."}
]},
rina_banter1:{ bg:"counter", lines:[
 {text:"She's redoing her nails behind the drinks station, which is a sackable offence, and she's doing it at a speed that suggests she knows exactly how long Reiko's floor walk takes."},
 {who:"rina",expr:"smile",text:"Ninety seconds. She's on the floor for ninety seconds. You could set a clock by that woman."},
 {choices:[{text:"\"You've timed her.\"",aff:{rina:5}},
  {text:"\"She's going to catch you.\"",aff:{rina:4}},
  {text:"\"Do mine after.\"",aff:{rina:7}}]},
 {who:"rina",expr:"blush",text:"Wait, seriously? Sit down — no, stand there — give me your hand, oh my god, okay."},
 {text:"She does one nail before the floor walk starts. You wear it for four days."}
]},
rina_banter2:{ bg:"counter", lines:[
 {text:"Dead hour. She's got her chin on her hands on the counter and she's watching the street."},
 {who:"rina",expr:"soft",text:"You ever think about how everyone out there has a whole entire thing going on and we're just in here, in the light, like a fish tank."},
 {choices:[{text:"\"That's bleak, Rina.\"",aff:{rina:4}},
  {text:"\"I'd rather be in here.\"",aff:{rina:7}},
  {text:"\"You'd hate being out there. No one to talk to.\"",aff:{rina:6}}]},
 {who:"rina",expr:"blush",text:"...Yeah. Yeah, okay, that's true and I resent it."},
 {text:"She stays there with her chin on her hands for another few minutes anyway."}
]},
rina_at_bar:{ bg:"bar", portRoom:"bar", lines:[
 {text:"She's at the end of the bar with a drink she's not drinking, talking to the owner, who is nodding in the specific way of a man who has been nodding for some time."},
 {text:"She spots you mid-sentence and her whole posture changes — brighter, faster, louder — and you notice the change, which you don't think you were supposed to."},
 {who:"rina",expr:"smile",bg:"bar",text:"HEY. Hey! Okay, good, come here, I'm rescuing him, he's been very patient."},
 {choices:[{text:"\"How long have you been here?\"",aff:{rina:4}},
  {text:"\"You didn't have to switch on for me.\"",hint:"+Rina",aff:{rina:9},flag:"rin_switch"},
  {text:"\"Poor guy.\"",aff:{rina:3}}]},
 {who:"rina",expr:"surprise",text:"...Switch on?"},
 {text:"She holds the smile for another second and a half and then it just comes off, all at once, and underneath it she looks tired in a way she has never once looked at work."},
 {who:"rina",expr:"soft",text:"Nobody's ever said that out loud before. I do it without noticing. I've done it since school."},
 {choices:[{text:"\"You don't have to do it with me.\"",aff:{rina:10}},
  {text:"\"It's a good switch. It's just not the only one.\"",aff:{rina:9}},
  {text:"\"Sorry. Forget it.\"",aff:{rina:3}}]},
 {who:"rina",expr:"blush",text:"Okay. Okay, we're — we're not doing this in a bar, I've got a whole face on, this is not the venue."},
 {text:"She stays for two more hours. She's quiet for most of it, and she doesn't leave, and at the end she says thank you for something neither of you names."}
]},
rina_at_station:{ bg:"street", lines:[
 {text:"She's by the gates with her phone out, not looking at it, doing that thing people do where the phone is a reason to be standing somewhere."},
 {who:"rina",expr:"smile",bg:"street",text:"Oh good, a person. I've been standing here for ten minutes looking like I'm waiting for someone."},
 {choices:[{text:"\"Are you?\"",aff:{rina:5}},
  {text:"\"Who are you waiting for?\"",aff:{rina:4}},
  {text:"\"You could just go home.\"",aff:{rina:6}}]},
 {who:"rina",expr:"blush",text:"Yeah, see, home's — it's fine. It's just quiet. It's very, very quiet."},
 {text:"She puts the phone away, which somehow makes her look more exposed rather than less."},
 {who:"rina",expr:"soft",text:"Walk me to the barrier? It's twelve metres. It's a stupid ask."},
 {choices:[{text:"\"It's not a stupid ask.\"",aff:{rina:8}},
  {text:"\"I'll walk you the whole way.\"",aff:{rina:10},flag:"rin_walked"},
  {text:"\"Twelve metres. Big commitment.\"",aff:{rina:6}}]},
 {who:"rina",expr:"blush",text:"Shut up. Come on."}
]},

/* ---------------------------------------------------------------- Ayano */
ayano_shift0:{ bg:"counter", lines:[
 {who:"ayano",expr:"blush",text:"Sorry — sorry, I'm in your way, I'm always in the way, everyone says—"},
 {text:"She stops. Nobody has ever said that. You'd have heard."},
 {who:"ayano",expr:"blush",text:"...Sorry."},
 {choices:[{text:"\"Nobody says that.\"",aff:{ayano:7}},
  {text:"\"You're fine.\"",aff:{ayano:4}},
  {text:"Just go round her without making it a thing.",aff:{ayano:5},flag:"aya_easy"}]},
 {who:"ayano",expr:"surprise",text:"Oh. Um. Thank you."},
 {text:"She spends the next hour glancing over at you every few minutes, quick, like she's checking her answer against yours, and every time you catch it she looks back down so fast her hair swings."}
]},
ayano_shift1:{ bg:"counter", lines:[
 {who:"ayano",expr:"neutral",text:"I've got exams in March. I keep telling my mum I'll drop hours and then the rota goes up and I just — don't."},
 {who:"ayano",expr:"blush",text:"Because it's nice here. Which is a stupid thing to say about a burger shop, I know it is, I hear it as I'm saying it."},
 {text:"She's folding boxes. She's very good at folding boxes. It's the only thing she does without hesitating first."},
 {choices:[{text:"\"It's not stupid.\"",aff:{ayano:8}},
  {text:"\"What's not nice at home?\"",hint:"careful",aff:{ayano:6},flag:"aya_home"},
  {text:"\"Drop the hours. Pass the exams.\"",hint:"kind, not warm",aff:{ayano:9},flag:"aya_real"}]},
 {who:"ayano",expr:"surprise",text:"...You're the first person who's said the second one."},
 {who:"ayano",expr:"soft",text:"Everyone else says stay. It's nice that they say stay. It's just not — it's not actually for me, when they say it."},
 {text:"She folds another box. Her hands are steady. The rest of her isn't, quite."}
]},
ayano_shift2:{ bg:"break", lines:[
 {who:"ayano",expr:"blush",bg:"break",text:"Can I sit here? You can say no. Genuinely, I'd honestly rather you said no than sat there wishing I hadn't—"},
 {choices:[{text:"\"Sit down, Ayano.\"",aff:{ayano:10}},
  {text:"\"You never have to ask me that.\"",aff:{ayano:8}}]},
 {who:"ayano",expr:"soft",text:"Okay."},
 {text:"She sits. She gets a textbook out and doesn't open it."},
 {text:"For ten minutes neither of you says anything, and by minute four she's stopped sitting like she's about to be asked to leave."},
 {who:"ayano",expr:"soft",text:"...This is the best part of my week. I'm aware of how that sounds."},
 {text:"It doesn't sound like anything. It sounds true."}
]},
ayano_banter0:{ bg:"counter", lines:[
 {text:"She's been staring at the drinks machine for a while."},
 {who:"ayano",expr:"blush",text:"There's a button on here I've never pressed. In seven months."},
 {choices:[{text:"\"Press it.\"",aff:{ayano:6}},
  {text:"\"What do you think it does?\"",aff:{ayano:5}},
  {text:"\"Don't press it.\"",aff:{ayano:4}}]},
 {who:"ayano",expr:"surprise",text:"I can't just — okay. Okay, I'm doing it. I'm doing it!"},
 {text:"It dispenses soda water. She looks so genuinely delighted that you have to look away for a second."}
]},
ayano_banter1:{ bg:"counter", lines:[
 {who:"ayano",expr:"neutral",text:"Rina says you're nice. She said it in the tone she uses when she means something else as well, but she wouldn't tell me what."},
 {choices:[{text:"\"What tone?\"",aff:{ayano:5}},
  {text:"\"She's making it up.\"",aff:{ayano:3}},
  {text:"\"What do you think?\"",aff:{ayano:7}}]},
 {who:"ayano",expr:"blush",text:"I think — um. I think she's right. About the nice."},
 {who:"ayano",expr:"blush",text:"I don't know about the other bit. I've been trying to work out the other bit for two days."}
]},
ayano_banter2:{ bg:"counter", lines:[
 {text:"Her hands are shaking slightly. It's been a bad rush and somebody shouted."},
 {who:"ayano",expr:"blush",text:"I'm fine. I'm fine, it's fine, I just — I get like this after and then it goes."},
 {choices:[{text:"\"Take five. I'll cover.\"",aff:{ayano:9}},
  {text:"\"He was out of order.\"",aff:{ayano:7}},
  {text:"Stand next to her and do nothing.",hint:"just be there",aff:{ayano:8}}]},
 {text:"She doesn't take the five. She does stand about six inches closer to you for the rest of the hour, and her hands stop."},
 {who:"ayano",expr:"soft",text:"...It went quicker than usual. This time."}
]},
ayano_at_park:{ bg:"park", portRoom:"park", lines:[
 {text:"Three benches and a vending machine. She's on the middle one with a textbook open on her knees and a highlighter she isn't using."},
 {text:"She's not reading. She's watching a pigeon."},
 {who:"ayano",expr:"surprise",bg:"park",text:"Oh! Oh — hi. Hello. I'm studying."},
 {choices:[{text:"\"You're watching a pigeon.\"",aff:{ayano:6}},
  {text:"\"How's it going?\"",aff:{ayano:4}},
  {text:"\"Mind if I sit?\"",aff:{ayano:7}}]},
 {who:"ayano",expr:"blush",text:"I'm — okay, I've read the same paragraph about eleven times, so the pigeon is arguably a better use of the afternoon."},
 {text:"You sit. She moves the bag off the bench with the speed of someone who was very much hoping to be asked."},
 {who:"ayano",expr:"soft",text:"I come here because my flat's got one window and it faces a wall, and if I study in there I start feeling like I've been put away somewhere."},
 {text:"She says it lightly. She's picked all the label off the highlighter."},
 {choices:[{text:"\"Then don't study in there.\"",aff:{ayano:8}},
  {text:"\"That's a horrible way to feel.\"",aff:{ayano:9}},
  {text:"\"Read it to me. The paragraph.\"",hint:"+Ayano",aff:{ayano:11},flag:"aya_read"}]},
 {who:"ayano",expr:"surprise",text:"...Out loud?"},
 {text:"She reads it out loud. She gets through it on the first try, and when she finishes she sits there looking at the page like it did something to her."},
 {who:"ayano",expr:"soft",text:"Huh. It's not even hard."}
]},

/* ---------------------------------------------------------------- Sana */
sana_shift0:{ bg:"counter", lines:[
 {text:"After eleven it stops being a shop. The street empties, the light stays on, and the place turns into a lit box that people walk past on their way to somewhere with people in it."},
 {text:"Someone's already behind the counter. You have never seen her on a rota."},
 {who:"sana",expr:"neutral",text:"You're the one taking all the nights."},
 {text:"She doesn't say it like a question, or an accusation, or a greeting. She says it the way you'd note the weather."},
 {who:"sana",expr:"neutral",text:"Sana. Tuesday to Saturday, eleven to seven. You won't see me otherwise."},
 {choices:[{text:"\"Why nights?\"",aff:{sana:5}},
  {text:"\"How long have you been here?\"",aff:{sana:4}},
  {text:"Say nothing. Start restocking.",hint:"she notices",aff:{sana:8},flag:"san_quiet"}]},
 {text:"There's a long pause. Not an awkward one — she just doesn't seem to think a pause needs filling."},
 {who:"sana",expr:"soft",text:"...Good. Most people fill it."}
]},
sana_shift1:{ bg:"counter", lines:[
 {text:"Three in the morning. One customer in ninety minutes and he didn't say a word either."},
 {who:"sana",expr:"soft",text:"I don't sleep. That's the answer to the thing you didn't ask again."},
 {who:"sana",expr:"neutral",text:"Not insomnia in the way people mean it. I sleep about two hours and then I'm just — up. Have been for years. So I might as well be somewhere with the lights on and something to do with my hands."},
 {text:"She's been wiping the same tray for a while. Not nervously. Just steadily, the way you'd stir something."},
 {choices:[{text:"\"Since when?\"",aff:{sana:6}},
  {text:"\"That sounds lonely.\"",aff:{sana:5}},
  {text:"\"I'm glad the lights are on.\"",aff:{sana:9},flag:"san_glad"}]},
 {who:"sana",expr:"blush",text:"...Hm."},
 {text:"That's all you get. But the tray goes down, and she stands there for a second with her hands flat on the counter, and it is very clearly a large reaction."}
]},
sana_shift2:{ bg:"counter", lines:[
 {who:"sana",expr:"neutral",text:"Ayano asked me to walk her to the station once. Two years ago, about."},
 {who:"sana",expr:"soft",text:"I said no. I was being careful. I'm always being careful, it's the only setting I've got left."},
 {text:"Outside, a taxi goes past and doesn't stop."},
 {who:"sana",expr:"soft",text:"She never asked again. And I think about that more than a person should think about a station."},
 {choices:[{text:"\"Ask her.\"",aff:{sana:8},flag:"san_ayano"},
  {text:"\"Being careful isn't free.\"",aff:{sana:10},flag:"san_careful"},
  {text:"\"You could ask me instead.\"",hint:"+Sana",aff:{sana:9}}]},
 {text:"She looks at you properly for the first time all night. It's not a long look. It's just a real one."},
 {who:"sana",expr:"blush",text:"...I could."}
]},
sana_banter0:{ bg:"counter", lines:[
 {text:"Four in the morning. She's put the radio on for the first time since you started nights."},
 {who:"sana",expr:"soft",text:"You can turn it off. I put it on for you, not for me."},
 {choices:[{text:"\"Leave it on.\"",aff:{sana:6}},
  {text:"\"What do you usually listen to?\"",aff:{sana:5}},
  {text:"\"Put on what you want.\"",aff:{sana:7}}]},
 {who:"sana",expr:"neutral",text:"Nothing. That's not a sad answer, it's just true. I stopped choosing things at some point."},
 {text:"She leaves it on. Two songs later you catch her tapping the counter, once, on a beat."}
]},
sana_banter1:{ bg:"counter", lines:[
 {text:"A drunk man is asleep against the window outside. Neither of you has mentioned him in about an hour."},
 {who:"sana",expr:"neutral",text:"He'll go when it gets light. They always do."},
 {choices:[{text:"\"Should we check on him?\"",aff:{sana:6}},
  {text:"\"You've seen a lot of them.\"",aff:{sana:5}},
  {text:"\"That's grim.\"",aff:{sana:3}}]},
 {who:"sana",expr:"soft",text:"I take him a coffee at five. Don't make it a thing, he'd hate that."},
 {text:"At five she takes him a coffee. She's gone about ninety seconds. She doesn't mention it when she comes back."}
]},
sana_banter2:{ bg:"counter", lines:[
 {text:"You fall asleep standing up for approximately two seconds and nearly go into the drinks fridge."},
 {who:"sana",expr:"surprise",text:"Sit down."},
 {who:"sana",expr:"neutral",text:"There's a crate in the back. Twenty minutes. I'll wake you if anyone comes in, which they won't."},
 {choices:[{text:"\"I'm fine.\"",aff:{sana:2}},
  {text:"\"Twenty minutes.\"",aff:{sana:6}},
  {text:"\"You've never once sat down.\"",aff:{sana:8}}]},
 {who:"sana",expr:"soft",text:"No. I haven't."},
 {text:"You take the twenty minutes. When you come back she's exactly where you left her, and there's a coffee on the counter that's still hot, so she made it recently, so she was counting."}
]},
sana_at_konbini:{ bg:"konbini", portRoom:"konbini", lines:[
 {text:"Seven twenty in the morning. Shift's been over for twenty minutes and she's in the konbini two doors down, standing in front of the sandwiches."},
 {text:"She isn't choosing. She's just standing there with the cold coming off the case."},
 {who:"sana",expr:"neutral",bg:"konbini",text:"I do this most mornings. Stand here a while. It's the gap between having somewhere to be and not."},
 {choices:[{text:"\"How long a while?\"",aff:{sana:5}},
  {text:"\"That sounds like the worst part of the day.\"",aff:{sana:7}},
  {text:"Stand there with her.",hint:"say nothing",aff:{sana:9},flag:"san_stood"}]},
 {text:"You stand there with her. A delivery van goes past. The case hums."},
 {text:"After a couple of minutes she picks up a sandwich, looks at it, and puts it back."},
 {who:"sana",expr:"soft",text:"Four years I've been doing that on my own. It's different with someone next to you. I didn't expect it to be different."},
 {choices:[{text:"\"I'll be here tomorrow.\"",aff:{sana:10},flag:"san_tomorrow"},
  {text:"\"Buy the sandwich, Sana.\"",aff:{sana:7}},
  {text:"\"Different how?\"",aff:{sana:6}}]},
 {who:"sana",expr:"blush",text:"...Shorter."}
]},
sana_at_station:{ bg:"street", lines:[
 {text:"First train. She's on the platform in her coat with her hands in the pockets, watching the board change."},
 {who:"sana",expr:"soft",bg:"street",text:"I don't take this one. I just like to see it go."},
 {choices:[{text:"\"That's a bit much, Sana.\"",aff:{sana:4}},
  {text:"\"Where does it go?\"",aff:{sana:6}},
  {text:"Wait and watch it with her.",aff:{sana:9},flag:"san_train"}]},
 {text:"It comes in, sits for forty seconds, and goes. She watches all of it."},

 {text:"She pulls the payroll back out of the drawer and starts it again from the top, and it is the most efficient way anyone has ever told you to leave."}

reiko_after0:{ bg:"reiko_room", art:"rei_room1", lines:[
 {who:"reiko",expr:"soft",bg:"reiko_room",text:"I've put you on closings. So we finish at the same time."},
 {who:"reiko",expr:"annoyed",text:"That is an operational decision and I will defend it as one if anyone asks, which they won't, because nobody has ever asked me about the rota in eleven years."},
 {choices:[{text:"\"Sure it is.\"",aff:{reiko:8},goto:"reiko_room_pick"},
  {text:"\"Thank you.\"",aff:{reiko:10},goto:"reiko_room_pick"},
  {text:"\"Rina's going to notice.\"",aff:{reiko:7}}]},
 {who:"reiko",expr:"blush",text:"Rina noticed in about nine minutes. She hasn't said anything, she's just been humming."},
 {choices:[{text:"Come here.",aff:{reiko:8},goto:"reiko_room_pick"}]}
]},
reiko_after1:{ bg:"counter", lines:[
 {text:"Two o'clock. The floor walk. She does it exactly the same as always, and everyone goes quiet six seconds before she appears, same as always."},
 {text:"She gets to you and says nothing at all about anything, checks the sleeve stock, and moves on."},
 {text:"About twenty minutes later there's a coffee on the shelf under the till. Nobody put it there in front of you."},
 {choices:[{text:"Say nothing about it.",aff:{reiko:9},flag:"rei_coffee"},
  {text:"Catch her eye.",aff:{reiko:7}},
  {text:"\"Reiko.\"",aff:{reiko:4}}]},
 {who:"reiko",expr:"neutral",text:"Cups. Front left. They've been like that since Tuesday."},
 {text:"She doesn't look at you when she says it. She does it again the next day, and every day after."}
]},
reiko_after2:{ bg:"reiko_room", art:"rei_room1", lines:[
 {text:"Her flat, on a Sunday, and she has not once looked at her phone."},
 {who:"reiko",expr:"soft",bg:"reiko_room",text:"I bought this place at thirty-four because I'd decided I was going to be the sort of person who had somewhere nice. Then I never came home to it."},
 {who:"reiko",expr:"neutral",text:"Eleven years of sleeping four hours in a flat I bought to be happy in. If one of my staff told me that I'd send them home for a week."},
 {choices:[{text:"\"So send yourself home.\"",aff:{reiko:9}},
  {text:"\"You're here now.\"",aff:{reiko:8}},
  {text:"\"Who'd do the rota?\"",aff:{reiko:6}}]},
 {who:"reiko",expr:"blush",text:"Mei could do the rota. Mei could have done the rota for three years and I've never once asked her, and I don't have a good reason, I just—"},
 {text:"She stops. She looks genuinely thrown, which on her is roughly a shout."},
 {who:"reiko",expr:"soft",text:"...I'll ask her Monday. Don't be smug about it."}
]},
reiko_after3:{ bg:"reiko_room", art:"rei_nude", lines:[
 {text:"Half four in the morning and she's awake, because of course she is."},
 {who:"reiko",expr:"neutral",text:"I've been lying here for an hour doing next month's rota in my head."},
 {choices:[{text:"\"Do it out loud. I'll stay awake.\"",aff:{reiko:10}},
  {text:"\"Stop doing the rota.\"",aff:{reiko:7}},
  {text:"Pull her back down.",aff:{reiko:9},goto:"reiko_room_pick"}]},
 {who:"reiko",expr:"surprise",text:"...You'd actually listen to me do the rota."},
 {who:"reiko",expr:"blush",text:"That's the strangest thing anyone has ever offered me and I'm going to take it, so sit up."},
 {text:"She does the whole of next month out loud. It takes forty minutes. You are asleep for about half of it and she carries on anyway."}
]},
reiko_locked0:{ bg:"counter", lines:[
 {text:"She knows before anyone tells her. She always knows before anyone tells her; it's most of what makes her frightening."},
 {who:"reiko",expr:"neutral",text:"Congratulations. I mean that without any edge on it, which I appreciate is not my usual delivery."},
 {choices:[{text:"\"Reiko—\"",aff:{reiko:2}},
  {text:"\"Thank you.\"",aff:{reiko:4}},

 {who:"reiko",expr:"soft",text:"I'm forty-one and I have been the manager for eleven years. I am extremely practised at not being allowed things."},

 {who:"reiko",expr:"annoyed",text:"Cups. Front left."}
]},
reiko_locked1:{ bg:"office", portRoom:"office", art:"rei_office", lines:[

reiko_locked2:{ bg:"office", portRoom:"office", lines:[

/* ================= Rina ================= */
rina_hang1:{ bg:"rina_room", art:"rin_room1", lines:[
 {text:"Bright, cluttered, every surface covered in things she clearly loves and can name the story of."},
 {who:"rina",expr:"smile",bg:"rina_room",text:"Don't say it's a lot. I know it's a lot. It's on purpose, it's a whole strategy."},
 {who:"rina",expr:"soft",text:"Empty rooms make me weird. I get in one and after about ten minutes I start feeling like I've been left somewhere."},
 {choices:[{text:"\"It suits you.\"",aff:{rina:8}},
  {text:"\"You don't have to fill the quiet with me.\"",hint:"+Rina",aff:{rina:12},flag:"rin_quiet"},
  {text:"\"Left somewhere by who?\"",aff:{rina:10},flag:"rin_left"}]},
 {who:"rina",expr:"blush",text:"Okay that one got me, that's not — you can't just ask the follow-up, nobody asks the follow-up."},
 {text:"She reorganises three things on the shelf that did not need reorganising."},
 {who:"rina",expr:"soft",text:"Not tonight. I'll tell you, I will, I just need it to not be the first thing that ever happens in here."}
]},
rina_hang2:{ bg:"street", art:"rin_walk", lines:[
 {text:"She's talked for eleven minutes straight and then just stops mid-sentence, halfway across the crossing, and has to be pulled the rest of the way."},
 {who:"rina",expr:"neutral",bg:"street",text:"Sorry. Sorry. I do that."},
 {who:"rina",expr:"soft",text:"Okay, the follow-up. You asked left by who. It's not a big tragic thing, that's the annoying part, I don't even get a good story out of it."},
 {who:"rina",expr:"soft",text:"My mum moved, and I stayed, because I had a job and a flat and friends. And then everyone else moved too, one at a time, over about two years, and nobody did anything wrong."},
 {who:"rina",expr:"blush",text:"So now I'm just — extremely good at being around people. Because I got a lot of practice at the alternative."},
 {choices:[{text:"\"I'm not moving.\"",aff:{rina:9}},
  {text:"\"That is a big thing, Rina.\"",aff:{rina:10},flag:"rin_big"},
  {text:"\"You're not around people. You're around me.\"",aff:{rina:11},flag:"rin_me"}]},
 {who:"rina",expr:"blush",text:"...Okay. Okay, I'm going to need to not say anything for about a minute, which — you know how big that is."},
 {text:"You walk the rest of the way to her corner in silence and she holds onto your sleeve for most of it."}
]},
rina_hang3:{ bg:"rina_room", art:"rin_room1", lines:[
 {text:"She's tidied. Not much — but the shelf is straight and there's a clear space on the table, and for her that's a bouquet and a string quartet."},
 {who:"rina",expr:"blush",bg:"rina_room",text:"Don't look at the table. I made a space. It's a whole thing, don't look at it."},
 {who:"rina",expr:"soft",text:"I said I didn't want the first thing that ever happens in here to be me crying about my mum. So I've had a week to think of a better first thing."},
 {choices:[{prompt:"She has cleared a space on a table for you. That is the entire message.",
   text:"\"Tell me the better first thing.\"",hint:"commits to Rina",aff:{rina:12},commit:"rina",
   lockWarn:true,req:()=>canCommit("rina"),goto:"rin_room_a"},
  {text:"Kiss her.",hint:"commits to Rina",aff:{rina:12},commit:"rina",
   lockWarn:true,req:()=>canCommit("rina"),goto:"rin_room_a"},
  {text:"\"Not yet.\"",aff:{rina:4}}]},
 {who:"rina",expr:"smile",text:"Yep! No, that's — totally. Totally fine. I'll just put the shelf back how it was."},
 {text:"She does not put the shelf back how it was."}
]},
rina_after0:{ bg:"rina_room", art:"rin_room1", lines:[
 {who:"rina",expr:"smile",bg:"rina_room",text:"Ayano asked why I've been weird. I said allergies. She believed me instantly and then offered me a tissue and I nearly died."},
 {choices:[{text:"\"You should tell her.\"",aff:{rina:6}},
  {text:"\"Come here.\"",aff:{rina:8},goto:"rina_room_pick"},
  {text:"\"You're a monster.\"",aff:{rina:5}}]},
 {who:"rina",expr:"blush",text:"I'm going to tell her! I'm building up to it. There's a right moment and I'm going to find it and then absolutely botch it."},
 {choices:[{text:"Come here.",aff:{rina:8},goto:"rina_room_pick"}]}
]},
rina_after1:{ bg:"counter", lines:[
 {text:"She has not gossiped about anything in nine days. Nine. Ayano has commented. Haruka has commented twice."},
 {who:"rina",expr:"smile",text:"I'm being MYSTERIOUS. It's a new brand. People are responding really badly to it."},
 {choices:[{text:"\"You're allowed to tell them.\"",aff:{rina:7}},
  {text:"\"I like it.\"",aff:{rina:6}},
  {text:"\"Nine days is a personal best.\"",aff:{rina:8}}]},
 {who:"rina",expr:"blush",text:"It IS a personal best. Thank you for noticing my growth."},
 {who:"rina",expr:"soft",text:"...It's not that I don't want to say it. It's that if I say it out loud it becomes something everyone else has an opinion on, and I want it to be mine for a bit longer."}
]},
rina_after2:{ bg:"rina_room", art:"rin_room1", lines:[
 {text:"She's been quiet for about forty minutes, which is no longer alarming, which is itself the thing that's changed."},
 {who:"rina",expr:"soft",bg:"rina_room",text:"I've been thinking about the flat. About how much stuff is in it."},
 {who:"rina",expr:"neutral",text:"I don't think I need all of it any more. That's — I'm not going to throw it out, I'm not having a whole moment, I just noticed I hadn't looked at any of it in a fortnight."},
 {choices:[{text:"\"Keep the shelf.\"",aff:{rina:8}},
  {text:"\"That's a good thing, Rina.\"",aff:{rina:9}},
  {text:"\"What changed?\"",hint:"you know",aff:{rina:10}}]},
 {who:"rina",expr:"blush",text:"You KNOW what changed. Don't make me say it, it's smug, it's a smug thing to make someone say."},
 {text:"She says it about an hour later anyway, into your shoulder, and immediately denies having said it."}
]},
rina_after3:{ bg:"bar", portRoom:"bar", lines:[
 {text:"The standing bar, and she's brought you, which given who else drinks here is a statement she is fully aware of."},
 {who:"rina",expr:"smile",bg:"bar",text:"Okay, listen. Reiko's in on Thursdays. It's Thursday."},
 {choices:[{text:"\"You planned this.\"",aff:{rina:8}},
  {text:"\"Let's go somewhere else.\"",aff:{rina:5}},
  {text:"\"Good.\"",aff:{rina:9},flag:"rin_public"}]},
 {who:"rina",expr:"blush",text:"I did plan it. I planned it for four days. I've told the owner and everything, he's very invested."},
 {text:"Reiko comes in at half nine, sees the two of you, and orders without breaking stride."},
 {who:"rina",expr:"surprise",text:"She's not saying anything. She's not going to say anything, is she. SHE'S NOT GOING TO SAY ANYTHING."},
 {text:"Reiko says nothing whatsoever. On the way out she puts a hand on Rina's shoulder for about a second, and Rina does not speak for a full four minutes afterwards."}
]},
rina_locked0:{ bg:"counter", lines:[
 {text:"She knows first. Obviously she knows first. She's known since before you did, probably."},
 {who:"rina",expr:"smile",text:"Okay so! Congratulations, genuinely, no notes, she's great, you've got excellent taste which I have been saying for weeks."},
 {text:"It is a flawless performance. It is so flawless that you can see the effort in it, which is how you know."},

rina_locked1:{ bg:"street", art:"rin_walk", lines:[
 {text:"The walk to the station. She's talking, but at about sixty percent of the usual output."},
 {who:"rina",expr:"soft",bg:"street",text:"I've been doing the thing again. The knowing-everything thing. I did it to about four people this week."},
 {choices:[{text:"\"You're allowed.\"",aff:{rina:4}},
  {text:"\"You don't have to earn being here.\"",aff:{rina:7},flag:"rin_earn"},
  {text:"\"I noticed.\"",aff:{rina:5}}]},
 {who:"rina",expr:"blush",text:"Yeah. Yeah, I know. It's just — it's the tool I've got."},

 {who:"rina",expr:"soft",text:"Still walk me though. Twelve metres. Even now. Especially now, actually."}

rina_locked2:{ bg:"break", lines:[
 {who:"rina",expr:"smile",bg:"break",text:"Told Ayano. About the allergies thing. About all of it, actually, the whole embarrassing lot."},
 {choices:[{text:"\"How'd she take it?\"",aff:{rina:5}},
  {text:"\"That's big.\"",aff:{rina:6}},
  {text:"\"Proud of you.\"",aff:{rina:7}}]},
 {who:"rina",expr:"blush",text:"She cried! SHE cried! I was the one with the thing and she cried and then I had to comfort HER, it was a shambles, it was great."},
 {who:"rina",expr:"soft",text:"Turns out you can just tell people. Who knew. Not me, for twenty-four years."}
]},

/* ================= Ayano ================= */
ayano_hang1:{ bg:"ayano_room", art:"aya_room1", lines:[
 {text:"Her room is smaller than the break room and twice as tidy. The textbooks are squared off. There is one poster and it is level."},
 {who:"ayano",expr:"blush",bg:"ayano_room",text:"I've never had anyone here. I practised what the room would look like. Which is an insane thing to admit and I've admitted it, so."},
 {choices:[{text:"\"It looks nice.\"",aff:{ayano:8}},
  {text:"\"Ayano. Breathe.\"",aff:{ayano:10},flag:"aya_breathe"},
  {text:"\"You don't have to perform for me.\"",hint:"+Ayano",aff:{ayano:12}}]},
 {who:"ayano",expr:"soft",text:"...I don't know how to do that yet. Not performing. I don't have a version of me that isn't checking."},
 {text:"She's sitting on the very edge of her own bed, in her own room, like a guest."},
 {who:"ayano",expr:"soft",text:"But I'd like to learn it. Here. If that's — if that's a thing you'd be around for."},
 {choices:[{text:"\"I'd be around for that.\"",aff:{ayano:10},flag:"aya_around"},
  {text:"\"Take as long as you need.\"",aff:{ayano:8}}]},
 {text:"She moves back about four inches on the bed. It takes her the rest of the evening."}
]},
ayano_hang2:{ bg:"park", portRoom:"park", lines:[
 {text:"The park, late afternoon, and she's got the textbook shut on her lap which is new."},
 {who:"ayano",expr:"neutral",bg:"park",text:"I told my mum about dropping the hours."},
 {who:"ayano",expr:"blush",text:"She said 'if that's what you want' in the voice. You know the voice. Where it's a yes but you're carrying it."},
 {choices:[{text:"\"That's still a yes.\"",aff:{ayano:7}},
  {text:"\"You did it though. You told her.\"",aff:{ayano:10},flag:"aya_told_mum"},
  {text:"\"What do you want?\"",aff:{ayano:11},flag:"aya_want"}]},
 {text:"She looks at you like you've asked her something in another language."},
 {who:"ayano",expr:"surprise",text:"...Nobody's asked me that in a way where they were going to wait for the answer."},
 {text:"You wait for the answer. It takes about ninety seconds and she picks the label off another highlighter while she does it."},
 {who:"ayano",expr:"soft",text:"I want to pass. And I want to keep the closings. And I want—"},
 {text:"She stops. Goes red to the ears. Opens the textbook again at completely the wrong page."},
 {who:"ayano",expr:"blush",text:"That's two out of three. That's plenty for a Tuesday."}
]},
ayano_hang3:{ bg:"ayano_room", art:"aya_room1", lines:[
 {text:"She asked you to come. Actually asked — out loud, at work, in front of the drinks machine, and then stood there going crimson while you said yes."},
 {who:"ayano",expr:"blush",bg:"ayano_room",text:"I've been practising the third one. The third thing I want. I've done it about forty times in the mirror and it's gone well maybe six."},
 {text:"She's not on the edge of the bed this time. That's the whole thing, really."},
 {choices:[{prompt:"She asked you here out loud, in front of everyone, and she has practised this forty times.",
   text:"\"Say it. I'll wait.\"",hint:"commits to Ayano",aff:{ayano:12},commit:"ayano",
   lockWarn:true,req:()=>canCommit("ayano"),goto:"aya_room_a"},
  {text:"\"You don't have to say it.\"",hint:"commits to Ayano",aff:{ayano:12},commit:"ayano",
   lockWarn:true,req:()=>canCommit("ayano"),goto:"aya_room_a"},
  {text:"\"Not tonight, Ayano.\"",aff:{ayano:4}}]},
 {who:"ayano",expr:"soft",text:"Okay. Okay! That's — that's fine, that's a normal thing, people say that."},
 {text:"She sees you out very politely and you hear the door shut and then nothing at all, which is worse."}
]},
ayano_after0:{ bg:"ayano_room", art:"aya_room1", lines:[
 {who:"ayano",expr:"smile",bg:"ayano_room",text:"I dropped the hours. Properly, on the rota, in pen. Reiko said 'noted'."},
 {who:"ayano",expr:"blush",text:"I kept the closings. Obviously I kept the closings."},
 {choices:[{text:"\"Obviously.\"",aff:{ayano:8},goto:"ayano_room_pick"},
  {text:"\"How do the exams look?\"",aff:{ayano:7}},
  {text:"\"Reiko said 'noted'?\"",aff:{ayano:6}}]},
 {who:"ayano",expr:"smile",text:"She said 'noted' and then she moved me off Saturdays without me asking. She's terrifying and I love her."},
 {choices:[{text:"Come here.",aff:{ayano:8},goto:"ayano_room_pick"}]}
]},
ayano_after1:{ bg:"counter", lines:[
 {text:"A customer is short with her. Not shouting — just short, and impatient, and looking past her while she talks."},
 {text:"She doesn't apologise. She takes the order, corrects him once, politely, and does not apologise."},
 {text:"You have known her four months. You have never seen this."},
 {choices:[{text:"\"Ayano.\"",aff:{ayano:7}},
  {text:"Say nothing. Let her have it.",aff:{ayano:10},flag:"aya_held"},
  {text:"\"That was great.\"",aff:{ayano:8}}]},
 {who:"ayano",expr:"surprise",text:"My hands are shaking. My hands are shaking and I didn't say sorry."},
 {who:"ayano",expr:"smile",text:"...I'm going to think about that all week."}
]},
ayano_after2:{ bg:"park", portRoom:"park", lines:[
 {text:"The park. She's reading out loud without being asked, which started as a joke and has quietly become how she studies."},
 {who:"ayano",expr:"soft",bg:"park",text:"I've worked out why this helps. It's because when I read it in my head I hear it in my mum's voice."},
 {who:"ayano",expr:"neutral",text:"And when I read it out loud it's just mine."},
 {choices:[{text:"\"Then read it out loud.\"",aff:{ayano:9}},
  {text:"\"That's not a small thing.\"",aff:{ayano:10}},
  {text:"\"I'll listen as long as you want.\"",aff:{ayano:11},flag:"aya_listen"}]},
 {who:"ayano",expr:"blush",text:"You say things like they're easy. They're not easy. You just say them like they are and then they sort of become it."},
 {text:"She reads for another hour. You do not understand one word of it and you stay for all of it."}
]},
ayano_after3:{ bg:"ayano_room", art:"aya_nude", lines:[
 {text:"Results day is in eleven days and she has a wall chart. Of course she has a wall chart."},
 {who:"ayano",expr:"blush",text:"Don't look at the chart."},
 {choices:[{text:"Look at the chart.",aff:{ayano:8}},
  {text:"\"You're going to pass.\"",aff:{ayano:9}},
  {text:"\"Come away from the chart.\"",aff:{ayano:10},goto:"ayano_room_pick"}]},
 {who:"ayano",expr:"soft",text:"You don't know that. You can't know that, you haven't seen the statistics module."},
 {who:"ayano",expr:"blush",text:"...Say it again anyway."},
 {choices:[{text:"\"You're going to pass.\"",aff:{ayano:10},goto:"ayano_room_pick"}]}
]},
ayano_locked0:{ bg:"counter", lines:[
 {text:"She finds out from Rina, who tells her gently, which is somehow worse than if it had got round the usual way."},
 {who:"ayano",expr:"smile",text:"Oh — I know! I heard. That's really lovely, I'm really pleased, she's so—"},

ayano_locked1:{ bg:"break", lines:[
 {who:"ayano",expr:"blush",bg:"break",text:"Can I sit here? You can say—"},
 {text:"She stops herself. Visibly. You can watch her decide not to finish it."},
 {who:"ayano",expr:"neutral",text:"I'm going to sit here."},
 {choices:[{text:"\"Good.\"",aff:{ayano:7}},
  {text:"Move your bag off the chair.",aff:{ayano:6}},
  {text:"\"That was different.\"",aff:{ayano:8},flag:"aya_different"}]},
 {who:"ayano",expr:"soft",text:"I've been practising it. Not for you, actually — for the exams. For the room where they ask you things."},

ayano_locked2:{ bg:"park", portRoom:"park", lines:[
 {text:"You find her in the park. She's got the textbook open and she's reading out loud to nobody."},
 {who:"ayano",expr:"surprise",bg:"park",text:"Oh! I — I kept doing it. The out-loud thing. It still works when you're not here, it turns out."},
 {choices:[{text:"\"Of course it does.\"",aff:{ayano:6}},
  {text:"\"That's the best thing I've heard all week.\"",aff:{ayano:8}},
  {text:"\"Read me the next bit.\"",aff:{ayano:7}}]},

 {text:"She reads you the next bit anyway."}
]},

/* ================= Sana ================= */
sana_hang1:{ bg:"sana_room", art:"san_room1", lines:[
 {text:"A bed, a lamp, and nothing on the walls. It doesn't look temporary. It looks decided."},
 {who:"sana",expr:"neutral",bg:"sana_room",text:"I know how it looks. I stopped putting things up about four years ago and never started again."},
 {choices:[{text:"\"What happened four years ago?\"",aff:{sana:6}},
  {text:"\"It's yours. It doesn't have to look like anything.\"",aff:{sana:10}},
  {text:"\"Let's put something up, then.\"",hint:"+Sana",aff:{sana:12},flag:"san_up"}]},
 {who:"sana",expr:"blush",text:"..."},
 {who:"sana",expr:"soft",text:"You say things like they're small."},
 {text:"She doesn't move to do anything about it. She stands in the middle of her own bare room with her coat still on."},
 {who:"sana",expr:"neutral",text:"I'd like you to go home now. Not because of anything. Because if you stay I'll want you to stay again, and I'd rather find out slowly whether I can hold that."},
 {choices:[{text:"\"Then I'll go.\"",aff:{sana:9},flag:"san_went"},
  {text:"\"You can hold it.\"",aff:{sana:7}}]},
 {text:"She watches you all the way down the stairs from the window. You look up. She doesn't move."}
]},
sana_hang2:{ bg:"konbini", portRoom:"konbini", lines:[
 {text:"The konbini, ten past seven, the cold coming off the sandwich case."},
