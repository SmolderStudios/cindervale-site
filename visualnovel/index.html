<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="rating" content="adult">
<title>Eleven Days — a Cindervale visual novel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%2308070a%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%279%27 fill=%27none%27 stroke=%27%23d9a441%27 stroke-width=%272%27/%3E%3Cpath d=%27M16 10v6l4 3%27 stroke=%27%23d9a441%27 stroke-width=%272%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<style>
/* ============================================================ [CSS-01] base */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08070a; --panel:#12101a; --panel2:#1a1724;
  --ink:#e8e4ef; --dim:#9a93ad; --faint:#6d6683;
  --line:#2a2536; --line2:#3a3348;
  --gold:#d9a441; --blood:#8f2f3a;
  --jas:#a78bfa; --ama:#f0663f; --misa:#7fd8a8; --ela:#5fa8d3;
  --sera:#c9ccd6; --wren:#e0925f; --roa:#c4574f; --kesst:#8fd14f;
  --bex:#d8c25a; --ilya:#b98fe0;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font:16px/1.65 "Georgia","Iowan Old Style",serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100%;height:100%;
  max-width:calc(100vh * 1.6);max-height:calc(100vw / 1.6);
  background:#000;overflow:hidden;box-shadow:0 0 90px rgba(0,0,0,.9)}

/* ========================================================== [CSS-02] scene */
#art{position:absolute;inset:0;background:#0a0910 center/cover no-repeat;
  transition:opacity .45s ease,transform 9s linear}
#art.ken{transform:scale(1.055)}
#artFade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;
  transition:opacity .35s ease}
#artFade.on{opacity:1}
#vignette{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(120% 90% at 50% 40%,transparent 45%,rgba(0,0,0,.55) 100%),
  linear-gradient(to bottom,rgba(0,0,0,.5) 0%,transparent 20%,transparent 44%,rgba(0,0,0,.93) 92%)}

/* ========================================================== [CSS-03] topbar */
#top{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;
  align-items:center;gap:13px;padding:10px 16px;
  background:linear-gradient(to bottom,rgba(6,5,9,.9),transparent);
  font-family:system-ui,sans-serif;font-size:12.5px;letter-spacing:.05em}
#dayTag{color:var(--gold);text-transform:uppercase;font-weight:600;white-space:nowrap}
#locTag{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .sp{flex:1}
#top button{color:var(--dim);padding:5px 10px;border-radius:5px;
  border:1px solid transparent;transition:.15s;white-space:nowrap}
#top button:hover{color:var(--ink);border-color:var(--line2);background:rgba(255,255,255,.05)}

/* ============================================================ [CSS-04] text */
#box{position:absolute;left:0;right:0;bottom:0;z-index:15;
  padding:0 clamp(20px,5vw,70px) clamp(18px,3.4vh,34px)}
#who{display:inline-block;font-family:system-ui,sans-serif;font-size:13px;
  font-weight:650;letter-spacing:.14em;text-transform:uppercase;
  padding:4px 13px;margin-bottom:9px;border-radius:3px;
  background:rgba(10,8,14,.85);border-left:3px solid var(--gold);color:var(--gold)}
#who.hide{visibility:hidden}
#txt{min-height:5.4em;font-size:clamp(16px,1.95vh,20px);line-height:1.72;
  text-shadow:0 2px 14px rgba(0,0,0,.95),0 0 40px rgba(0,0,0,.85);max-width:64ch}
#txt em{color:var(--gold);font-style:italic}
#txt i.th{color:var(--dim);font-style:italic}
#cursor{display:inline-block;width:.5em;color:var(--gold);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#hint{position:absolute;right:clamp(20px,5vw,70px);bottom:clamp(8px,1.4vh,14px);
  font-family:system-ui,sans-serif;font-size:11px;color:var(--faint);letter-spacing:.08em}

/* ========================================================= [CSS-05] choices */
#choices{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:11px;
  padding:6vh clamp(20px,8vw,120px);
  background:linear-gradient(to bottom,rgba(4,3,7,.35),rgba(4,3,7,.85))}
#choices.on{display:flex}
#chPrompt{max-width:680px;width:100%;font-size:15px;color:var(--dim);
  font-style:italic;margin-bottom:2px;text-shadow:0 2px 10px #000}
.ch{width:100%;max-width:680px;text-align:left;padding:14px 20px;border-radius:7px;
  background:linear-gradient(to right,rgba(26,23,36,.96),rgba(18,16,26,.96));
  border:1px solid var(--line2);border-left:3px solid var(--line2);
  font-size:15.5px;line-height:1.5;transition:.16s}
.ch:hover{border-left-color:var(--gold);transform:translateX(4px);
  background:linear-gradient(to right,rgba(42,36,58,.98),rgba(24,21,34,.98))}
.ch .tag{display:block;margin-top:5px;font-family:system-ui,sans-serif;
  font-size:11px;letter-spacing:.06em;color:var(--faint)}
.ch.locked{opacity:.4;cursor:not-allowed}
.ch.locked:hover{transform:none;border-left-color:var(--line2)}
.ch .lk{color:var(--blood)}
.ch.big{border-left-color:var(--gold);background:
  linear-gradient(to right,rgba(48,38,22,.96),rgba(20,17,27,.96))}

/* ========================================================== [CSS-06] panels */
.ov{position:absolute;inset:0;z-index:40;display:none;background:rgba(6,5,9,.965);
  padding:clamp(16px,3vh,32px) clamp(18px,6vw,80px);overflow-y:auto;
  font-family:system-ui,sans-serif}
.ov.on{display:block}
.ov h2{font-family:Georgia,serif;font-size:23px;color:var(--gold);
  font-weight:500;margin-bottom:14px}
.ov .close{position:absolute;top:14px;right:18px;font-size:24px;color:var(--dim);
  line-height:1;padding:4px 10px;border-radius:5px}
.ov .close:hover{color:var(--ink);background:rgba(255,255,255,.08)}
.rel{border:1px solid var(--line);border-radius:9px;padding:13px 15px;
  margin-bottom:10px;background:var(--panel)}
.rel .hd{display:flex;align-items:baseline;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.rel .hd b{font-family:Georgia,serif;font-size:17px;font-weight:500;color:var(--c)}
.rel .hd span{font-size:11.5px;color:var(--faint);letter-spacing:.05em}
.rel .hd .st{margin-left:auto;font-size:12px;color:var(--dim);font-style:italic}
.mrow{display:grid;grid-template-columns:66px 1fr 34px;gap:9px;align-items:center;
  font-size:11.5px;color:var(--dim);margin-bottom:5px}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--gold));transition:width .5s}
.bar.t i{background:var(--dim)}
.mrow b{text-align:right;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--faint);line-height:1.55;margin-top:8px;
  padding-top:8px;border-top:1px solid var(--line);font-style:italic}
.bonds{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.bond{border:1px solid var(--line);border-radius:7px;padding:9px 12px;
  background:var(--panel);font-size:12.5px}
.bond .bn{display:flex;justify-content:space-between;margin-bottom:6px;color:var(--dim);gap:8px}
.bond .bn i{font-style:normal;color:var(--faint);font-size:11px;white-space:nowrap}
#logList p{margin-bottom:11px;font-family:Georgia,serif;font-size:14.5px;
  line-height:1.6;color:var(--dim)}
#logList p b{color:var(--gold);font-weight:500;font-size:12px;
  font-family:system-ui,sans-serif;letter-spacing:.08em;display:block;margin-bottom:2px}
.slots{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.slot{border:1px solid var(--line);border-radius:8px;padding:13px;background:var(--panel);
  text-align:left;transition:.15s}
.slot:hover{border-color:var(--gold);background:var(--panel2)}
.slot b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}
.slot span{font-size:11.5px;color:var(--faint)}
.gal{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.gal figure{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.gal img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;cursor:pointer}
.gal figcaption{padding:7px 10px;font-size:11.5px;color:var(--faint)}
.gal .lockbox{aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;
  color:var(--faint);font-size:26px;background:#0d0b12}
.set label{display:flex;align-items:center;gap:11px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:13.5px;color:var(--dim)}
.set input[type=range]{flex:1;accent-color:var(--gold)}
.set input[type=checkbox]{width:17px;height:17px;accent-color:var(--gold)}
#lightbox{position:absolute;inset:0;z-index:70;display:none;background:rgba(0,0,0,.95);
  align-items:center;justify-content:center;cursor:zoom-out}
#lightbox.on{display:flex}
#lightbox img{max-width:94%;max-height:94%;object-fit:contain}

/* ========================================================== [CSS-07] title */
#title{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:7px;
  background:radial-gradient(120% 100% at 50% 45%,#1b1526,#06050a 72%)}
#title.off{display:none}
#title h1{font-size:clamp(38px,7.4vh,74px);font-weight:400;letter-spacing:.15em;
  color:var(--ink);text-shadow:0 0 60px rgba(217,164,65,.35)}
#title .tl{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.42em;
  color:var(--gold);text-transform:uppercase;margin-bottom:24px}
#title .mn{display:flex;flex-direction:column;gap:3px;margin-top:22px}
#title .mn button{font-family:system-ui,sans-serif;font-size:13.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);padding:9px 40px;border-radius:5px;transition:.15s}
#title .mn button:hover{color:var(--gold);background:rgba(217,164,65,.09)}
#title .cr{position:absolute;bottom:20px;font-family:system-ui,sans-serif;
  font-size:11px;color:var(--faint);letter-spacing:.06em}

/* ========================================================== [CSS-08] extras */
#floats{position:absolute;right:24px;top:64px;z-index:35;display:flex;
  flex-direction:column;gap:5px;align-items:flex-end;pointer-events:none}
.fl{font-family:system-ui,sans-serif;font-size:12.5px;letter-spacing:.04em;
  padding:4px 11px;border-radius:4px;background:rgba(10,8,14,.9);
  border-right:3px solid var(--c);animation:flin 2.6s ease forwards}
@keyframes flin{0%{opacity:0;transform:translateX(14px)}14%{opacity:1;transform:none}
  72%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#flash{position:absolute;inset:0;z-index:50;background:#fff;opacity:0;
  pointer-events:none;transition:opacity .5s}
#flash.on{opacity:.8;transition:opacity .06s}
#chapCard{position:absolute;inset:0;z-index:45;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;background:#06050a;
  animation:cardin .8s ease}
#chapCard.on{display:flex}
@keyframes cardin{from{opacity:0}to{opacity:1}}
#chapCard .k{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.4em;
  color:var(--gold);text-transform:uppercase}
#chapCard .t{font-size:clamp(24px,4.4vh,40px);font-weight:400;letter-spacing:.05em}
#chapCard .s{font-size:14px;color:var(--dim);font-style:italic;max-width:44ch;text-align:center}

/* ========================================================== [CSS-10] mobile
   The desktop stage is pinned to 16:10 and letterboxes to fit. On a portrait
   phone that is a disaster: a 390x844 screen got a 390x244 strip of game with
   600px of dead black around it, and the six top-bar buttons overflowed the
   width. So portrait phones get a different layout entirely rather than a
   squeezed version of the desktop one -- art on top, a solid text panel below,
   which is the standard mobile VN shape and what the text actually needs.   */
@media (max-width:820px) and (orientation:portrait){
  #stage{max-width:none;max-height:none;width:100%;height:100%}

  /* art becomes a pane, not a full-bleed backdrop.
     The source images are landscape (1216x832) and the pane is roughly square,
     so `cover` crops the sides and — with the default centre anchor — lands the
     crop on the middle of the body. Biasing the anchor upward keeps the face in
     frame, which is the only part that has to survive the crop. */
  #art{bottom:auto;height:46vh;background-position:center 22%}
  #artFade{bottom:auto;height:46vh}
  #vignette{bottom:auto;height:46vh;background:
    radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.4) 100%),
    linear-gradient(to bottom,rgba(0,0,0,.55) 0%,transparent 26%,
                    transparent 76%,rgba(8,7,10,.96) 100%)}

  /* text is a real panel with its own ground, so it never fights the art */
  #box{top:46vh;bottom:0;display:flex;flex-direction:column;
    background:linear-gradient(to bottom,#0b0a10,#08070a);
    border-top:1px solid var(--line);
    padding:14px 18px 26px}
  #txt{min-height:0;flex:1;overflow-y:auto;font-size:17px;line-height:1.66;
    max-width:none;text-shadow:none;-webkit-overflow-scrolling:touch}
  #who{margin-bottom:8px}
  #hint{right:18px;bottom:8px}

  /* the top bar could not fit six labels -- let it scroll sideways, and give
     every control a 44px touch target */
  #top{gap:4px;padding:8px 10px;overflow-x:auto;scrollbar-width:none;
    background:rgba(6,5,9,.92)}
  #top::-webkit-scrollbar{display:none}
  #top .sp{flex:0 0 8px}
  #top button{padding:11px 12px;font-size:12px;min-height:44px;
    border:1px solid var(--line);border-radius:6px;flex:0 0 auto}
  #dayTag,#locTag{flex:0 0 auto}
  #locTag{max-width:38vw}

  /* choices: full width, thumb-sized, and scrollable if a scene offers four */
  #choices{padding:0;justify-content:flex-end;gap:9px;
    background:linear-gradient(to bottom,rgba(4,3,7,.5),rgba(4,3,7,.94))}
  #chPrompt{padding:0 16px;margin-bottom:6px;font-size:14px}
  .ch{max-width:none;border-radius:0;padding:15px 18px;min-height:56px;font-size:15px}
  .ch:hover{transform:none}
  .ch:active{background:linear-gradient(to right,rgba(48,40,66,.99),rgba(28,24,40,.99))}

  /* overlays get room and bigger hit areas */
  .ov{padding:16px 14px 40px}
  .ov .close{font-size:30px;padding:8px 14px;top:8px;right:8px}
  .bonds,.slots,.gal{grid-template-columns:1fr}
  #floats{right:12px;top:58px}
  #title h1{font-size:44px}
  #title .mn button{padding:14px 46px;font-size:15px}
}

/* Landscape phones are close enough to the desktop shape to keep it, but the
   top bar still needs touch-sized controls. */
@media (max-height:520px) and (orientation:landscape){
  #top button{padding:9px 10px;min-height:38px}
  #txt{min-height:4em;font-size:15px}
  .ch{padding:11px 16px;font-size:14.5px}
}
</style>
</head>
<body>
<div id="app"><div id="stage">
  <div id="art"></div><div id="artFade"></div><div id="vignette"></div>

  <div id="top">
    <span id="dayTag">Day One</span><span id="locTag"></span><span class="sp"></span>
    <button id="bRel">Bonds</button><button id="bLog">Log</button>
    <button id="bGal">Gallery</button><button id="bSave">Save</button>
    <button id="bSet">Settings</button><button id="bMenu">Menu</button>
  </div>

  <div id="floats"></div>

  <div id="box">
    <span id="who"></span>
    <div id="txt"></div>
    <div id="hint">click / space</div>
  </div>

  <div id="choices"></div>

  <div class="ov" id="ovRel"><button class="close" data-x="ovRel">&times;</button>
    <h2>Bonds</h2><div id="relList"></div>
    <h2 style="margin-top:20px">Between them</h2><div class="bonds" id="bondList"></div></div>
  <div class="ov" id="ovLog"><button class="close" data-x="ovLog">&times;</button>
    <h2>Log</h2><div id="logList"></div></div>
  <div class="ov" id="ovGal"><button class="close" data-x="ovGal">&times;</button>
    <h2>Gallery</h2><div class="gal" id="galList"></div></div>
  <div class="ov" id="ovSave"><button class="close" data-x="ovSave">&times;</button>
    <h2 id="saveTitle">Save</h2><div class="slots" id="saveList"></div></div>
  <div class="ov" id="ovSet"><button class="close" data-x="ovSet">&times;</button>
    <h2>Settings</h2><div class="set" id="setList"></div></div>

  <div id="lightbox"><img alt=""></div>
  <div id="flash"></div>
  <div id="chapCard"><div class="k"></div><div class="t"></div><div class="s"></div></div>

  <div id="title">
    <div class="tl">A Cindervale story</div>
    <h1>ELEVEN DAYS</h1>
    <div class="mn">
      <button id="mNew">New game</button>
      <button id="mCont">Continue</button>
      <button id="mLoad">Load</button>
      <button id="mGal">Gallery</button>
    </div>
    <div class="cr">Adult visual novel &middot; all characters are adults</div>
  </div>
</div></div>

<script>
"use strict";
/* ====================================================== [JS-01] cast + rules
   Six people you can end the story with. Biro is written but not romanceable;
   he reacts, he does not pair.                                              */
const CAST = {
  jas:  {n:"Jasmine", r:"A-rank assassin",     c:"var(--jas)",
         desc:"Speaks once a scene, if that. Watches everything."},
  ama:  {n:"Amane",   r:"B-rank fire mage",    c:"var(--ama)",
         desc:"Jokes first. The jokes are load-bearing."},
  misa: {n:"Misa",    r:"C-rank healer",       c:"var(--misa)",
         desc:"Wants to be useful. Terrified of not being."},
  ela:  {n:"Elara",   r:"A-class adventurer",  c:"var(--ela)",
         desc:"On a contract. You are the contract."},
  sera: {n:"Sera Vane",r:"Grey Coat agent",    c:"var(--sera)",
         desc:"The only one who is not afraid of you."},
  wren: {n:"Wren",    r:"Innkeeper's daughter",c:"var(--wren)",
         desc:"No rank, no stake. Treats you like a man."},
  /* --- Act Two. Four temperaments the first six do not cover: one who takes,
     one who deflects, one who has no register but "mate", one who watches. --- */
  roa:  {n:"Captain Roa",r:"Free company captain",c:"var(--roa)", act:2,
         desc:"Does not ask. Decides, and tells you after."},
  kesst:{n:"Kesst",   r:"Courier, south road", c:"var(--kesst)", act:2,
         desc:"Talks constantly. Allergic to a sincere sentence."},
  bex:  {n:"Bex",     r:"Stablehand, the Weepers",c:"var(--bex)",act:2,
         desc:"Treats you like one of the lads and cannot switch."},
  /* Ilya is not known to be a man until he says so, and the UI must not be the
     thing that tells you. `hide` is what the Bonds panel shows until the
     `ilya_revealed` flag is set; every string before that point is written to
     be true without being specific, and the prose uses "they" throughout. The
     reveal is his to make, and how you take it is the branch. */
  ilya: {n:"Ilya",    r:"Scribe and singer",   c:"var(--ilya)",  act:2,
         hide:{r:"Scribe and singer",
               desc:"Says little, misses nothing. Watching you carefully."},
         desc:"Says little, misses nothing. Braver than he looks."},
  biro: {n:"Biro",    r:"B-rank tank",         c:"var(--dim)", ally:true,
         desc:"Founded the Venturas. Watched you take it."},
};
const IDS = Object.keys(CAST).filter(k => !CAST[k].ally);

/* Choosing one person IN FRONT OF another is the whole engine. CROSS[a][b] is
   what siding with a costs (or gains) you with b. Jasmine and Elara are
   canonically competitive; Sera is an enemy agent, so being seen with her
   costs you with everyone who can read a room. */
const CROSS = {
  jas:  {ama:+1, misa:+1, ela:-3, sera:-4, wren: 0, roa:-1, kesst: 0, bex: 0, ilya:+1},
  ama:  {jas:+1, misa:+2, ela: 0, sera:-2, wren:+1, roa:+1, kesst:+2, bex:+2, ilya:+1},
  misa: {jas:+1, ama:+2, ela:-1, sera:-4, wren:+1, roa:-2, kesst: 0, bex:+1, ilya:+2},
  ela:  {jas:-3, ama: 0, misa:-1, sera:-2, wren:-1, roa:+1, kesst:+1, bex:+1, ilya: 0},
  sera: {jas:-4, ama:-2, misa:-4, ela:-2, wren:-3, roa:-1, kesst:-2, bex:-2, ilya:-1},
  wren: {jas: 0, ama:+1, misa:+1, ela:-1, sera:-3, roa:-1, kesst:+2, bex:-3, ilya:+2},
  roa:  {jas:-1, ama:+1, misa:-3, ela:+1, sera:-1, wren:-2, kesst:-1, bex:+1, ilya:-3},
  kesst:{jas: 0, ama:+2, misa: 0, ela:+1, sera:-2, wren:+2, roa:-1, bex:+3, ilya:+2},
  bex:  {jas: 0, ama:+2, misa:+1, ela:+1, sera:-2, wren:-3, roa:+1, kesst:+3, ilya:+1},
  ilya: {jas:+1, ama:+1, misa:+2, ela: 0, sera:-1, wren:+2, roa:-3, kesst:+2, bex:+1},
};

/* Pair bonds: how the two of THEM feel about each other. Only moves in scenes
   where both are present and you decline to pick a favourite. Poly endings
   need all three of aff/trust/bond high, which is deliberately hard. */
const PAIRS = [
  ["ama","misa"],["jas","ela"],["jas","wren"],["ela","sera"],
  ["ama","wren"],["misa","wren"],["jas","ama"],["ela","misa"],["jas","misa"],
  ["kesst","wren"],["kesst","ama"],["kesst","ilya"],["ilya","misa"],
  ["ilya","wren"],["roa","ela"],["roa","jas"],["sera","roa"],
  ["bex","kesst"],["bex","wren"],["bex","ama"],["bex","ilya"],["bex","roa"],
];
const pairKey = (a,b) => [a,b].sort().join("|");

/* Four rungs, not two. Most scenes should NOT be fully explicit -- the ladder
   is the point. T1 is emotional, T2 is the almost (a tease that stops), T3 is
   the first night, T4 is unguarded. A route that jumps straight from talking to
   bed has skipped the part that makes the bed mean anything. */
const TIERS = [
  {aff:35, tru:20, label:"a line crossed"},
  {aff:48, tru:32, label:"almost"},
  {aff:62, tru:48, label:"the first night"},
  {aff:82, tru:70, label:"nothing held back"},
];
const T_TEASE = 2, T_EXPLICIT = 3;
const POLY = {aff:70, tru:55, bond:60};
const SAVEKEY = "cvvn_save_v1", SETKEY = "cvvn_set_v1";

/* ======================================================== [JS-02] game state */
let S, SET, cur = null, li = 0, typing = false, tmr = null, hist = [];

/* The story does not begin at zero. Lelouch has been with the Venturas for a
   month: Jasmine is already his primary confidante with trust at 9/10 and an
   unspoken thing neither of them has named, and Amane and Misa have shared a
   campfire with him for weeks. Starting everyone at nothing would contradict
   the campaign this is set in, and it would flatten Jasmine's whole shape --
   her route is not about winning her, it is about not losing her. */
const START = {
  jas:  {aff:30, trust:45},
  ama:  {aff:14, trust:22},
  misa: {aff:12, trust:20},
};
function freshState(){
  const z = () => IDS.reduce((o,k)=>(o[k]=0,o),{});
  const a = z(), t = z();
  for (const k in START){ a[k] = START[k].aff; t[k] = START[k].trust; }
  const b = {}; PAIRS.forEach(([x,c]) => b[pairKey(x,c)] = 0);
  b[pairKey("ama","misa")] = 40;          // they have been friends for years
  return {day:1, scene:null, aff:a, trust:t, bond:b, flags:{}, seen:{},
          cg:{}, met:{}, route:null, poly:null, stops:0, ending:null, stamp:""};
}
/* Anything added to state later must default here too, or old saves break. */
function normalize(o){
  const f = freshState();
  const s = Object.assign(f, o || {});
  s.aff   = Object.assign(f.aff,   s.aff   || {});
  s.trust = Object.assign(f.trust, s.trust || {});
  s.bond  = Object.assign(f.bond,  s.bond  || {});
  s.flags = s.flags || {}; s.seen = s.seen || {};
  s.cg = s.cg || {}; s.met = s.met || {};
  return s;
}
function loadSet(){
  try{ SET = JSON.parse(localStorage.getItem(SETKEY)) || {}; }catch(e){ SET = {}; }
  SET = Object.assign({speed:26, floats:true, auto:false}, SET);
}
function saveSet(){ try{ localStorage.setItem(SETKEY, JSON.stringify(SET)); }catch(e){} }

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const aff  = k => S.aff[k] || 0;
const tru  = k => S.trust[k] || 0;
const bond = (a,b) => S.bond[pairKey(a,b)] || 0;
const flag = f => !!S.flags[f];
const met  = k => !!S.met[k];

/* ======================================================= [JS-03] art loading */
const ART = "art/";
const artMissing = {};
const artURL = (kind, name) => ART + kind + "/" + name + ".jpg";

function setArt(loc, who, mood){
  const el = document.getElementById("art");
  let want = null;
  if (who && loc && !CAST[who].ally) want = artURL("scene", who+"-"+loc+"-"+(mood||"neutral"));
  else if (loc) want = artURL("scene", "bg-"+loc);
  if (!want) return;
  if (artMissing[want]){                       // fall back to the empty room
    const bg = artURL("scene", "bg-"+loc);
    if (artMissing[bg]) return;
    want = bg;
  }
  if (el.dataset.src === want) return;
  const fade = document.getElementById("artFade");
  fade.classList.add("on");
  const img = new Image();
  img.onload = () => {
    el.style.backgroundImage = "url('"+want+"')";
    el.dataset.src = want;
    el.classList.remove("ken"); void el.offsetWidth; el.classList.add("ken");
    fade.classList.remove("on");
  };
  img.onerror = () => {
    artMissing[want] = 1; fade.classList.remove("on");
    if (want.indexOf("bg-") === -1) setArt(loc, null, null);
  };
  img.src = want;
}

/* ================================================ [JS-04] relationship math
   Two currencies, deliberately separate:
     AFFECTION is bought with ATTENTION -- who you turned toward.
     TRUST     is bought with TRUTH     -- what you were willing to admit.
   Being adored by someone who does not believe a word you say is its own
   ending, and it is not a kind one.                                        */
function applyEff(eff, silent){
  if (!eff) return;
  const shown = [];
  if (eff.aff) for (const k in eff.aff){
    if (!IDS.includes(k)) continue;
    S.aff[k] = clamp(aff(k) + eff.aff[k], 0, 100);
    if (eff.aff[k]) shown.push([k, eff.aff[k], "closer"]);
  }
  if (eff.trust) for (const k in eff.trust){
    if (!IDS.includes(k)) continue;
    S.trust[k] = clamp(tru(k) + eff.trust[k], 0, 100);
    if (eff.trust[k]) shown.push([k, eff.trust[k], "trust"]);
  }
  if (eff.bond) for (const k in eff.bond){
    S.bond[k] = clamp((S.bond[k]||0) + eff.bond[k], -40, 100);
  }
  if (eff.meet)  eff.meet.forEach(k => S.met[k] = 1);
  if (eff.flags) eff.flags.forEach(f => S.flags[f] = 1);
  if (eff.clear) eff.clear.forEach(f => delete S.flags[f]);
  if (eff.cg)    eff.cg.forEach(c => S.cg[c] = 1);
  if (eff.stop)  S.stops += eff.stop;
  if (!silent && SET.floats) shown.forEach(([k,v,kind]) => floatMsg(k, v, kind));
}

/* Turning toward one person in front of others. This is the cost engine:
   `at` is who you chose, `seen` is who watched you choose. */
function turnToward(who, seen, weight){
  const w = weight || 1;
  const eff = {aff:{}, trust:{}};
  eff.aff[who] = 6 * w;
  (seen || []).forEach(k => {
    if (k === who || !met(k) || !IDS.includes(k)) return;
    const cross = (CROSS[who] && CROSS[who][k]) || 0;
    eff.aff[k] = Math.round(cross * w * 10) / 10;
  });
  applyEff(eff);
}

function floatMsg(k, v, kind){
  const box = document.getElementById("floats");
  const d = document.createElement("div");
  d.className = "fl"; d.style.setProperty("--c", CAST[k].c);
  d.textContent = CAST[k].n + "  " + (v > 0 ? "▲" : "▼") + " " + kind;
  box.appendChild(d);
  setTimeout(() => d.remove(), 2700);
}

function tierOf(k){
  let t = 0;
  TIERS.forEach((T,i) => { if (aff(k) >= T.aff && tru(k) >= T.tru) t = i+1; });
  return t;
}
const polyReady = (a,b) =>
  aff(a) >= POLY.aff && aff(b) >= POLY.aff &&
  tru(a) >= POLY.tru && tru(b) >= POLY.tru && bond(a,b) >= POLY.bond;

/* Committing has a price, and the price is other people.
   Spending a night with someone is the one thing in this game that cannot be
   done quietly -- it is a small inn, everyone in it reads people for a living,
   and by morning they all know. So the route you take actively closes others:
   everyone loses ground, and anyone who is a poor loser about this specific
   person (a strongly negative CROSS) is shut out for good.
   `poly` is the exception -- if two people arrived together, neither of them
   is being betrayed by the other. */
function commitRoute(k, poly){
  S.route = k;
  const eff = {aff:{}, trust:{}};
  IDS.forEach(o => {
    if (o === k || !met(o)) return;
    if (poly && poly.indexOf(o) !== -1) return;
    const cross = (CROSS[k] && CROSS[k][o]) || 0;
    // a flat cost for choosing someone, plus extra from anyone who minds
    eff.aff[o]   = -(6 + Math.max(0, -cross) * 2.5);
    eff.trust[o] = -(2 + Math.max(0, -cross));
    if (cross <= -3){ S.flags["locked_" + o] = 1; }   // that door is shut
  });
  applyEff(eff);
}
const routeLocked = k => !!S.flags["locked_" + k] || (S.route && S.route !== k &&
                          !(S.poly && S.poly.split("|").indexOf(k) !== -1));

function statusWord(k){
  const a = aff(k), t = tru(k);
  if (a >= 82 && t >= 70) return "unguarded";
  if (a >= 60 && t >= 45) return "close";
  if (a >= 60) return "close, but wary";
  if (a >= 35) return "warming";
  if (a >= 15) return "civil";
  return "a stranger";
}
/* Whose story this turned out to be.
   Scored on MOVEMENT, not standing. Jasmine opens at 30/45 because the
   campaign says so, and if this measured absolute totals she would win every
   playthrough by default -- the head start would decide the story instead of
   the player. What matters is who you actually turned toward, so the score is
   how far someone came from where they started, with a small weight on where
   they now stand so a strong bond is not thrown away for a fast-moving one. */
const startAff  = k => (START[k] ? START[k].aff   : 0);
const startTru  = k => (START[k] ? START[k].trust : 0);
function momentum(k){
  // Pure movement, no absolute term. An earlier version added 0.35 of the
  // current total "so a deep existing bond is not thrown away", but that
  // quietly handed Jasmine 54 points of head start before the player did
  // anything, and Sera's and Wren's routes became mathematically unwinnable.
  // The existing bond is already represented properly -- Jasmine simply has
  // more scenes, so turning toward her moves her furthest anyway.
  return (aff(k) - startAff(k)) + (tru(k) - startTru(k));
}
function leader(){
  let best = null, bv = -Infinity;
  IDS.forEach(k => { if (!met(k)) return;
    const v = momentum(k); if (v > bv){ bv = v; best = k; } });
  return best;
}

/* ========================================================= [JS-05] scene run */
function goto(id){
  const sc = STORY[id];
  if (!sc){ console.warn("missing scene:", id); return; }
  cur = sc; li = 0; S.scene = id; S.seen[id] = 1;
  if (sc.day) { S.day = sc.day; document.getElementById("dayTag").textContent = DAYNAME(sc.day); }
  if (sc.enter) sc.enter();
  if (sc.eff) applyEff(sc.eff, true);
  // `act` runs AFTER eff, so a scene can commit a route using the numbers its
  // own effects just set. Choices support this too; scenes silently did not,
  // which meant every commitRoute() on a night scene never fired at all.
  if (sc.act) sc.act();
  if (sc.loc) document.getElementById("locTag").textContent = LOCNAME[sc.loc] || "";
  setArt(sc.loc, sc.who, sc.mood);
  document.getElementById("choices").classList.remove("on");
  if (sc.card) return showCard(sc.card, () => step());
  step();
}
const DAYNAME = d => ["","Day One","Day Two","Day Three","Day Four","Day Five",
  "Day Six","Day Seven","Day Eight","Day Nine","Day Ten","Day Eleven"][d] || ("Day "+d);

function showCard(card, done){
  const el = document.getElementById("chapCard");
  el.querySelector(".k").textContent = card.k || "";
  el.querySelector(".t").textContent = card.t || "";
  el.querySelector(".s").textContent = card.s || "";
  el.classList.add("on");
  setTimeout(() => { el.classList.remove("on"); done(); }, card.ms || 2400);
}

function step(){
  if (!cur) return;
  const lines = cur.lines || [];
  if (li >= lines.length) return finishScene();
  const L = lines[li++];
  if (L.if && !L.if()) return step();               // conditional line
  if (L.art) setArt(L.art.loc || cur.loc, L.art.who, L.art.mood);
  if (L.eff) applyEff(L.eff);
  if (L.flash) doFlash();
  const who = document.getElementById("who");
  if (L.s && L.s !== "n"){
    const c = L.s === "me" ? {n:"Lelouch", c:"var(--gold)"} : CAST[L.s];
    who.textContent = c.n; who.style.color = c.c; who.style.borderLeftColor = c.c;
    who.classList.remove("hide");
  } else who.classList.add("hide");
  hist.push({who: (L.s && L.s !== "n") ? (L.s === "me" ? "Lelouch" : CAST[L.s].n) : "", t:L.t});
  if (hist.length > 400) hist.shift();
  typeOut(L.t);
}

function typeOut(text){
  const el = document.getElementById("txt");
  clearInterval(tmr);
  if (SET.speed >= 60){ el.innerHTML = text; typing = false; return afterType(); }
  typing = true;
  let i = 0;
  el.innerHTML = "";
  tmr = setInterval(() => {
    i += 1;
    let s = text.slice(0, i);
    const o = s.lastIndexOf("<"), c = s.lastIndexOf(">");
    if (o > c) s = s.slice(0, o);                    // never split a tag
    el.innerHTML = s + '<span id="cursor">|</span>';
    if (i >= text.length){
      clearInterval(tmr); el.innerHTML = text; typing = false; afterType();
    }
  }, Math.max(4, 62 - SET.speed));
}
function afterType(){
  if (SET.auto) setTimeout(() => {
    if (SET.auto && !typing && !document.getElementById("choices").classList.contains("on")) step();
  }, 1200);
}
function skipType(){
  if (!typing) return false;
  clearInterval(tmr); typing = false;
  const L = (cur.lines || [])[li-1];
  document.getElementById("txt").innerHTML = L ? L.t : "";
  afterType();
  return true;
}

function finishScene(){
  if (cur.choices){
    const list = (typeof cur.choices === "function") ? cur.choices() : cur.choices;
    if (list && list.length) return showChoices(list, cur.prompt);
  }
  if (cur.then){
    const n = (typeof cur.then === "function") ? cur.then() : cur.then;
    if (n) return goto(n);
  }
  document.getElementById("hint").textContent = "— end of the current chapter —";
}

function showChoices(list, prompt){
  const box = document.getElementById("choices");
  box.innerHTML = prompt ? '<div id="chPrompt">'+prompt+'</div>' : "";
  list.forEach(ch => {
    if (ch.if && !ch.if()) return;
    const locked = ch.need && !ch.need();
    const b = document.createElement("button");
    b.className = "ch" + (locked ? " locked" : "") + (ch.big ? " big" : "");
    b.innerHTML = ch.t +
      (ch.tag ? '<span class="tag">'+ch.tag+'</span>' : "") +
      (locked && ch.lock ? '<span class="tag lk">— '+ch.lock+'</span>' : "");
    if (!locked) b.onclick = () => {
      box.classList.remove("on");
      if (ch.turn) turnToward(ch.turn[0], ch.turn[1], ch.turn[2]);
      if (ch.eff) applyEff(ch.eff);
      if (ch.act) ch.act();
      if (ch.goto) return goto(ch.goto);
      if (ch.lines){
        cur = {lines:ch.lines, loc:ch.loc || cur.loc, who:ch.who || cur.who,
               mood:ch.mood || cur.mood, then:ch.then || cur.then, choices:ch.choices};
        li = 0;
        if (ch.loc) document.getElementById("locTag").textContent = LOCNAME[ch.loc] || "";
        setArt(cur.loc, cur.who, cur.mood);
        return step();
      }
      if (ch.then) return goto(typeof ch.then === "function" ? ch.then() : ch.then);
      finishScene();
    };
    box.appendChild(b);
  });
  box.classList.add("on");
}
function doFlash(){
  const f = document.getElementById("flash");
  f.classList.add("on"); setTimeout(() => f.classList.remove("on"), 90);
}

/* ============================================================ [JS-06] panels */
const openOv = id => document.getElementById(id).classList.add("on");
document.querySelectorAll(".close").forEach(b =>
  b.onclick = () => document.getElementById(b.dataset.x).classList.remove("on"));

function renderRel(){
  const box = document.getElementById("relList"); box.innerHTML = "";
  const shown = IDS.filter(met);
  if (!shown.length) box.innerHTML = '<div class="note">You have not met anyone yet.</div>';
  shown.forEach(k => {
    const C0 = CAST[k], t = tierOf(k);
    // a character may conceal something; show the concealed sheet until told
    const C = (C0.hide && !flag(k+"_revealed")) ? Object.assign({}, C0, C0.hide) : C0;
    const d = document.createElement("div");
    d.className = "rel"; d.style.setProperty("--c", C.c);
    d.innerHTML =
      '<div class="hd"><b>'+C.n+'</b><span>'+C.r+'</span><span class="st">'+statusWord(k)+'</span></div>' +
      '<div class="mrow"><span>Affection</span><div class="bar"><i style="width:'+aff(k)+'%"></i></div><b>'+Math.round(aff(k))+'</b></div>' +
      '<div class="mrow"><span>Trust</span><div class="bar t"><i style="width:'+tru(k)+'%"></i></div><b>'+Math.round(tru(k))+'</b></div>' +
      '<div class="note">'+C.desc+(t ? ' &middot; <span style="color:'+C.c+'">'+TIERS[t-1].label+'</span>' : '')+'</div>';
    box.appendChild(d);
  });
  const bb = document.getElementById("bondList"); bb.innerHTML = "";
  PAIRS.forEach(([a,b2]) => {
    if (!met(a) || !met(b2)) return;
    const v = bond(a,b2), ready = polyReady(a,b2);
    const d = document.createElement("div");
    d.className = "bond";
    d.innerHTML = '<div class="bn"><span>'+CAST[a].n+' &amp; '+CAST[b2].n+'</span><i>' +
      (ready ? "in step" : v >= 60 ? "warm" : v >= 30 ? "civil" : v <= -15 ? "friction" : "distant") +
      '</i></div><div class="bar"><i style="width:'+clamp(v,0,100)+'%;background:' +
      (ready ? "var(--gold)" : "var(--line2)")+'"></i></div>';
    bb.appendChild(d);
  });
  if (!bb.innerHTML) bb.innerHTML = '<div class="note">Nothing between anyone yet.</div>';
  openOv("ovRel");
}
function renderLog(){
  document.getElementById("logList").innerHTML =
    hist.slice(-120).map(h => "<p>"+(h.who ? "<b>"+h.who+"</b>" : "")+h.t+"</p>").join("")
    || "<p>Nothing yet.</p>";
  openOv("ovLog");
}
function renderGal(){
  const box = document.getElementById("galList"); box.innerHTML = "";
  CGS.forEach(c => {
    const got = S.cg[c.id];
    const f = document.createElement("figure");
    if (got){
      f.innerHTML = '<img src="'+ART+c.src+'" alt=""><figcaption>'+c.name+'</figcaption>';
      f.querySelector("img").onclick = e => {
        const lb = document.getElementById("lightbox");
        lb.querySelector("img").src = e.target.src; lb.classList.add("on");
      };
    } else f.innerHTML = '<div class="lockbox">🔒</div><figcaption>— locked —</figcaption>';
    box.appendChild(f);
  });
  openOv("ovGal");
}
document.getElementById("lightbox").onclick = e => e.currentTarget.classList.remove("on");

function renderSave(mode){
  document.getElementById("saveTitle").textContent = mode === "save" ? "Save" : "Load";
  const box = document.getElementById("saveList"); box.innerHTML = "";
  for (let i = 1; i <= 3; i++){
    let meta = null;
    try{ const r = localStorage.getItem(SAVEKEY+"_"+i); meta = r ? JSON.parse(r) : null; }catch(e){}
    const b = document.createElement("button");
    b.className = "slot";
    b.innerHTML = "<b>Slot "+i+"</b><span>" +
      (meta ? DAYNAME(meta.day)+" · "+(meta.stamp||"") : "empty") + "</span>";
    b.onclick = () => {
      if (mode === "save"){
        S.stamp = new Date().toLocaleString();
        try{ localStorage.setItem(SAVEKEY+"_"+i, JSON.stringify(S)); }
        catch(e){ alert("Could not save."); }
        renderSave("save");
      } else if (meta){
        S = normalize(meta); hist = [];
        document.getElementById("ovSave").classList.remove("on");
        document.getElementById("title").classList.add("off");
        document.getElementById("dayTag").textContent = DAYNAME(S.day);
        goto(S.scene && STORY[S.scene] ? S.scene : "prologue");
      }
    };
    box.appendChild(b);
  }
  openOv("ovSave");
}
function renderSet(){
  const box = document.getElementById("setList");
  box.innerHTML =
    '<label>Text speed <input type="range" id="sSpeed" min="8" max="60" value="'+SET.speed+'"></label>' +
    '<label><input type="checkbox" id="sFloat" '+(SET.floats?"checked":"")+'> Show relationship changes</label>' +
    '<label><input type="checkbox" id="sAuto" '+(SET.auto?"checked":"")+'> Auto-advance</label>';
  box.querySelector("#sSpeed").oninput  = e => { SET.speed = +e.target.value; saveSet(); };
  box.querySelector("#sFloat").onchange = e => { SET.floats = e.target.checked; saveSet(); };
  box.querySelector("#sAuto").onchange  = e => { SET.auto = e.target.checked; saveSet(); };
  openOv("ovSet");
}

/* ============================================================ [JS-07] input */
document.getElementById("stage").addEventListener("click", e => {
  if (e.target.closest("#top,#choices,.ov,#title,#lightbox,#chapCard")) return;
  if (skipType()) return;
  if (document.getElementById("choices").classList.contains("on")) return;
  step();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    document.querySelectorAll(".ov.on").forEach(o => o.classList.remove("on"));
    document.getElementById("lightbox").classList.remove("on");
    return;
  }
  if (e.key === " " || e.key === "Enter"){
    if (!document.getElementById("title").classList.contains("off")) return;
    if (document.querySelector(".ov.on")) return;
    e.preventDefault();
    if (!skipType() && !document.getElementById("choices").classList.contains("on")) step();
  }
});
document.getElementById("bRel").onclick  = renderRel;
document.getElementById("bLog").onclick  = renderLog;
document.getElementById("bGal").onclick  = renderGal;
document.getElementById("bSave").onclick = () => renderSave("save");
document.getElementById("bSet").onclick  = renderSet;
document.getElementById("bMenu").onclick = () => document.getElementById("title").classList.remove("off");
document.getElementById("mNew").onclick  = () => {
  S = freshState(); hist = [];
  document.getElementById("title").classList.add("off");
  goto("prologue");
};
document.getElementById("mCont").onclick = () => {
  for (let i = 1; i <= 3; i++){
    const raw = localStorage.getItem(SAVEKEY+"_"+i);
    if (!raw) continue;
    try{
      S = normalize(JSON.parse(raw)); hist = [];
      document.getElementById("title").classList.add("off");
      document.getElementById("dayTag").textContent = DAYNAME(S.day);
      return goto(S.scene && STORY[S.scene] ? S.scene : "prologue");
    }catch(e){}
  }
  alert("No save found.");
};
document.getElementById("mLoad").onclick = () => renderSave("load");
document.getElementById("mGal").onclick  = () => renderGal();

loadSet(); S = freshState();
</script>
