<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DLES — flag contact sheet</title>
<style>
  body{margin:0;background:#0c0908;color:#f1e6dc;font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:26px}
  h1{font-size:20px;letter-spacing:.1em;margin:0 0 6px}
  p{color:#b9a698;margin:0 0 22px;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  figure{margin:0}
  .box{aspect-ratio:3/2;border-radius:6px;overflow:hidden;border:1px solid #452f26;background:#191311}
  .box svg{display:block;width:100%;height:100%}
  figcaption{font-size:12.5px;color:#b9a698;margin-top:6px;text-align:center}
</style>
</head>
<body>
<h1>FLAG CONTACT SHEET</h1>
<p>Every flag Flagle can deal, drawn from the specs in <code>data/geo.js</code>.
   If one of these looks wrong, fix the renderer in <code>js/games/flagle.js</code> — or delete the
   spec so that country drops out of Flagle rather than appearing incorrectly.</p>
<div class="grid" id="grid"></div>

<script src="data/words.js"></script>
<script src="data/geo.js"></script>
<script src="js/core.js"></script>
<script src="js/games/flagle.js"></script>
<script>
  var host = document.getElementById('grid');
  GEO.FLAGGED.forEach(function (c) {
    var f = document.createElement('figure');
    var b = document.createElement('div');
    b.className = 'box';
    try { b.innerHTML = DLES.flagSVG(GEO.FLAGS[c.n]); }
    catch (e) { b.textContent = 'ERROR: ' + e.message; }
    var cap = document.createElement('figcaption');
    cap.textContent = c.n;
    f.appendChild(b); f.appendChild(cap); host.appendChild(f);
  });
  document.querySelector('p').insertAdjacentHTML('beforeend',
    '<br><b style="color:#e0873a">' + GEO.FLAGGED.length + ' flags</b>');
</script>
</body>
</html>
